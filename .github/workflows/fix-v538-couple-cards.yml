name: Fix v5.38 couple cards

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/fix_v538.py
      - name: Verify
        run: |
          grep -Fq "const APP_VERSION='v5.38';" index.html
          grep -Fq 'drawCard(cardX,y,cardW,coupleCardH);' index.html
          ! grep -Fq 'const shareTxns=normalTxns.concat(coupleTxnRows);' index.html
          grep -Fq 'dutch-pay-v5.38' sw.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'v5.38 공유 이미지 커플 카드 분리 복원'
          git push
