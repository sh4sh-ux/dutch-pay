name: Apply v5.40 desktop category grid
on:
  push:
    paths:
      - '.github/workflows/apply-v540-desktop-grid.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump version and cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if "const APP_VERSION='v5.39';" not in s:
              raise SystemExit('v5.39 app version not found')
          s=s.replace("const APP_VERSION='v5.39';","const APP_VERSION='v5.40';",1)
          p.write_text(s,encoding='utf-8')
          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          if 'dutch-pay-v5.39' not in s:
              raise SystemExit('v5.39 cache not found')
          s=s.replace('dutch-pay-v5.39','dutch-pay-v5.40',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -Fq "const APP_VERSION='v5.40';" index.html
          grep -Fq 'dutch-pay-v5.40' sw.js
          grep -Fq 'grid-template-columns: repeat(8, minmax(0, 1fr));' category-grid-v5.27.css
      - name: Commit
        run: |
          rm .github/workflows/apply-v540-desktop-grid.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js .github/workflows/apply-v540-desktop-grid.yml
          git commit -m 'v5.40 데스크탑 카테고리 8x2 배열'
          git push
