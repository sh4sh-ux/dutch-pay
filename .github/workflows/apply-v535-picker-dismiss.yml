name: Apply v5.35 picker dismiss
on:
  push:
    paths:
      - '.github/workflows/apply-v535-picker-dismiss.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch category picker dismiss and version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # index.html: keep image-only share from v5.34, just bump version
          p=Path('index.html')
          s=p.read_text()
          if "const APP_VERSION='v5.34';" not in s:
              raise SystemExit('v5.34 source version not found')
          s=s.replace("const APP_VERSION='v5.34';","const APP_VERSION='v5.35';")
          p.write_text(s)

          # category picker helper: add robust pointer/touch outside dismiss
          j=Path('category-grid-v5.27.js')
          t=j.read_text()
          marker="    if (anchorRect) pop.style.top = (anchorRect.bottom + window.scrollY + 6) + 'px';\n"
          if marker not in t:
              raise SystemExit('picker anchor marker not found')
          insert=marker+"\n    // Mobile-safe outside dismiss: pointerdown fires reliably before synthetic click.\n    // Ignore the opening pointer itself; then close whenever the next pointer is outside.\n    setTimeout(() => {\n      const closeOutside = (e) => {\n        if (!pop.isConnected) {\n          document.removeEventListener('pointerdown', closeOutside, true);\n          return;\n        }\n        if (!pop.contains(e.target)) {\n          pop.remove();\n          document.removeEventListener('pointerdown', closeOutside, true);\n        }\n      };\n      document.addEventListener('pointerdown', closeOutside, true);\n    }, 0);\n"
          t=t.replace(marker,insert,1)
          j.write_text(t)

          sw=Path('sw.js')
          w=sw.read_text()
          w=re.sub(r'dutch-pay-v5\.\d+', 'dutch-pay-v5.35', w)
          sw.write_text(w)
          PY
      - name: Validate
        run: |
          grep -q "const APP_VERSION='v5.35'" index.html
          test "$(grep -o "title:'더치페이 정산 내역'" index.html | wc -l)" -eq 0
          grep -q "document.addEventListener('pointerdown', closeOutside, true)" category-grid-v5.27.js
          grep -q 'dutch-pay-v5.35' sw.js
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/apply-v535-picker-dismiss.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html category-grid-v5.27.js sw.js .github/workflows/apply-v535-picker-dismiss.yml
          git commit -m 'v5.35 모바일 카테고리 외부 터치 닫기'
          git push
