name: Apply v5.29 direct version fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v5.29-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch index and service worker directly
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          idx = Path('index.html')
          s = idx.read_text(encoding='utf-8')
          s, n1 = re.subn(r"const APP_VERSION='v5\.25';", "const APP_VERSION='v5.29';", s, count=1)
          s, n2 = re.subn(r"const BUILD_TIME='[^']+';", "const BUILD_TIME='2026-09-02 09:15';", s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'index patch failed: version={n1}, build={n2}')
          idx.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          w = sw.read_text(encoding='utf-8')
          w = w.replace('dutch-pay-v5.28', 'dutch-pay-v5.29')
          w, n3 = re.subn(
              r'  html = html\n    \.replace\("const APP_VERSION=\'v5\.25\';", "const APP_VERSION=\'v5\.28\';"\)\n    \.replace\("const BUILD_TIME=\'[^\']+\';", "const BUILD_TIME=\'[^\']+\';"\);',
              '  // v5.29부터 버전은 index.html 원본에서 직접 관리한다.\n  // 서비스워커는 버전 문자열을 변경하지 않는다.',
              w,
              count=1,
          )
          if n3 != 1:
              raise SystemExit(f'service worker version rewrite removal failed: {n3}')
          sw.write_text(w, encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          grep -q "const APP_VERSION='v5.29';" index.html
          grep -q "const BUILD_TIME='2026-09-02 09:15';" index.html
          grep -q 'dutch-pay-v5.29' sw.js
          ! grep -q 'replace("const APP_VERSION' sw.js

      - name: Commit permanent fix and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-v529-direct.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: persist v5.29 in index.html [v5.29-applied]"
          git push origin HEAD:main
