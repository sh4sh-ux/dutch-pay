name: Apply v5.43 popup position fix
on:
  push:
    paths:
      - '.github/workflows/apply-v543-popup-position.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bump app version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          import re
          s,n=re.subn(r"const APP_VERSION='v5\.\d+';", "const APP_VERSION='v5.43';", s, count=1)
          if n != 1:
              raise SystemExit('APP_VERSION replacement failed')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'v5.43 카테고리 팝업 상하 자동 배치' || exit 0
          git push
