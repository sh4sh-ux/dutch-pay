name: Fix share date structure v4.52
on:
  push:
    paths:
      - '.github/workflows/fix-share-date-structure-v452.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch v4.52
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s, n = re.subn(r"const APP_VERSION='v4\.51';", "const APP_VERSION='v4.52';", s, count=1)
          if n != 1:
              raise SystemExit('APP_VERSION v4.51 not found exactly once')

          s, n = re.subn(r"\.share-date-row\{[^}]*\}", ".share-date-block{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}\n.share-date-row{margin:0;display:grid;grid-template-columns:minmax(0,1fr) 60px;column-gap:8px;align-items:center;height:36px;}", s, count=1)
          if n != 1:
              raise SystemExit('share-date-row CSS not found exactly once')

          s, n = re.subn(r"@media\(max-width:700px\)\{\.share-date-sep,\.share-date-rm,\.share-date-add\{transform:translateY\(-10px\);\}\}", "@media(max-width:700px){.share-date-sep,.share-date-rm,.share-date-add{transform:none;}}", s, count=1)
          if n != 1:
              raise SystemExit('mobile symbol transform rule not found exactly once')

          s = re.sub(r"\n/\* v4\.(?:49|50) period-row optical spacing \*/\n@media\(max-width:700px\)\{\n\s*\.share-date-row \+ \.share-date-row\{margin-top:-\d+px;\}\n\}\n", "\n", s)

          wave = '<span class="share-date-sep" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 13c2.7 0 2.7-3 5.3-3s2.7 3 5.3 3 2.7-3 5.4-3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>'
          add = '<button class="share-date-add" onclick="addSettleEndDate()">+ 기간</button>'
          rm = '<button class="share-date-rm" aria-label="종료 날짜 삭제" onclick="clearSettleEndDate()"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>'

          mobile_repl = "    let html='<div class=\"share-date-block\"><div class=\"share-date-row\">'\n      + _dpHtml(settleDateStart,\"updateSettleDate('start',this.value)\",\"share-date-dp\")\n      + (settleDateEnd ? " + repr(wave) + " : " + repr(add) + ")\n      + '</div>'\n      + (settleDateEnd ? '<div class=\"share-date-row\">' + _dpHtml(settleDateEnd,\"updateSettleDate('end',this.value)\",\"share-date-dp\",settleDateStart) + " + repr(rm) + " + '</div>' : '')\n      + '</div>';\n    const peopleCount="
          s, n = re.subn(r"    let html=.*?share-date-row.*?\n    const peopleCount=", mobile_repl, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('mobile date row renderer not found exactly once')

          desktop_repl = "  const dateRow='<div class=\"share-date-block\"><div class=\"share-date-row\">'\n    + _dpHtml(settleDateStart,\"updateSettleDate('start',this.value)\",\"share-date-dp\")\n    + (settleDateEnd ? " + repr(wave) + " : " + repr(add) + ")\n    + '</div>'\n    + (settleDateEnd ? '<div class=\"share-date-row\">' + _dpHtml(settleDateEnd,\"updateSettleDate('end',this.value)\",\"share-date-dp\",settleDateStart) + " + repr(rm) + " + '</div>' : '')\n    + '</div>';\n  const peopleCount="
          s, n = re.subn(r"  const dateRow=.*?share-date-row.*?\n  const peopleCount=", desktop_repl, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('desktop date row renderer not found exactly once')

          p.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          t = sw.read_text(encoding='utf-8')
          t, n = re.subn(r'dutch-pay-v4\.51', 'dutch-pay-v4.52', t, count=1)
          if n != 1:
              raise SystemExit('sw cache v4.51 not found exactly once')
          sw.write_text(t, encoding='utf-8')
          PY

          rm .github/workflows/fix-share-date-structure-v452.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js .github/workflows/fix-share-date-structure-v452.yml
          git commit -m 'Fix share date row structure v4.52'
          git push
