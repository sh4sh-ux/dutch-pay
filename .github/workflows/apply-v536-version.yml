name: Apply v5.36 version bump
on:
  push:
    paths:
      - '.github/workflows/apply-v536-version.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump app version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s=s.replace("const APP_VERSION='v5.35';","const APP_VERSION='v5.36';")
          p.write_text(s)
          sw=Path('sw.js')
          w=sw.read_text()
          w=re.sub(r'dutch-pay-v5\.\d+', 'dutch-pay-v5.36', w)
          sw.write_text(w)
          PY
      - name: Validate
        run: |
          grep -q "const APP_VERSION='v5.36'" index.html
          grep -q 'dutch-pay-v5.36' sw.js
          grep -q 'Same category icon tapped again' category-grid-v5.27.js
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/apply-v536-version.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js .github/workflows/apply-v536-version.yml
          git commit -m 'v5.36 카테고리 토글 버전 반영'
          git push
