name: Apply receipt fixed layout v486

on:
  push:
    paths:
      - '.github/workflows/apply-receipt-layout-v486.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply layout
        run: |
          echo '' | base64 -d | python3
      - name: Validate
        run: |
          grep -q 'RECEIPT_LAYOUT_V2' index.html
          grep -q "APP_VERSION='v4.86'" index.html
          grep -q 'dutch-pay-v4.86' sw.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "v4.86 match Receipt DB fixed layout"
          git push origin main
