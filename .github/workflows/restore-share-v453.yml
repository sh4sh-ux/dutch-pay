name: Restore share UI v4.53
on:
  push:
    paths:
      - '.github/workflows/restore-share-v453.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore known-good share structure and bump version
        run: |
          git checkout 6d1f1696600ade667e3c35049ae6276c85a5edc3 -- index.html sw.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const APP_VERSION='v4.51';", "const APP_VERSION='v4.53';", 1)
          p.write_text(s, encoding='utf-8')
          sw=Path('sw.js')
          t=sw.read_text(encoding='utf-8').replace('dutch-pay-v4.51','dutch-pay-v4.53',1)
          sw.write_text(t, encoding='utf-8')
          PY
          rm .github/workflows/restore-share-v453.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js .github/workflows/restore-share-v453.yml
          git commit -m 'Restore share period controls v4.53'
          git push
