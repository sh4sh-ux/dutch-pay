name: Fix monthly row overlap v4.59
on:
  push:
    paths:
      - '.github/workflows/fix-monthly-row-overlap-v459.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix monthly amount/status overlap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if "const APP_VERSION='v4.58';" not in s:
              raise SystemExit('v4.58 app version not found')
          s=s.replace("const APP_VERSION='v4.58';","const APP_VERSION='v4.59';",1)

          marker='/* v4.59 monthly row overlap fix */'
          css=r'''
/* v4.59 monthly row overlap fix */
@media(max-width:700px){
  .pm-month-person-left{transform:none!important;padding-left:12px;}
  .pm-month-status{transform:none!important;}
  .pm-month-right{display:grid!important;grid-template-columns:minmax(0,1fr) 44px!important;column-gap:8px!important;align-items:center!important;min-width:0!important;padding-right:8px!important;}
  .pm-month-amount{min-width:0!important;text-align:right!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;}
  .pm-month-status{width:44px!important;min-width:44px!important;text-align:left!important;white-space:nowrap!important;justify-self:start!important;}
}
'''
          if marker not in s:
              pos=s.rfind('</style>')
              if pos<0:
                  raise SystemExit('style closing tag not found')
              s=s[:pos]+css+s[pos:]
          p.write_text(s,encoding='utf-8')

          sw=Path('sw.js')
          t=sw.read_text(encoding='utf-8')
          if 'dutch-pay-v4.58' not in t:
              raise SystemExit('v4.58 cache not found')
          t=t.replace('dutch-pay-v4.58','dutch-pay-v4.59',1)
          sw.write_text(t,encoding='utf-8')
          PY
          rm .github/workflows/fix-monthly-row-overlap-v459.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js .github/workflows/fix-monthly-row-overlap-v459.yml
          git commit -m 'Fix monthly amount status overlap v4.59'
          git push
