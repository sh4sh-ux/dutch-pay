name: Fix monthly row overlap v4.59
"on":
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r"const APP_VERSION\s*=\s*['\"]v\d+\.\d+['\"]\s*;","const APP_VERSION='v4.59';",s,count=1)
          if n!=1: raise SystemExit('APP_VERSION not found')
          marker='/* v4.59 monthly row overlap fix */'
          css=base64.b64decode('').decode()
          if marker not in s:
              pos=s.rfind('</style>')
              if pos < 0: raise SystemExit('no style close')
              s=s[:pos]+css+s[pos:]
          p.write_text(s,encoding='utf-8')
          sw=Path('sw.js')
          t=sw.read_text(encoding='utf-8')
          t,n=re.subn(r'dutch-pay-v\d+\.\d+','dutch-pay-v4.59',t,count=1)
          if n!=1: raise SystemExit('cache version not found')
          sw.write_text(t,encoding='utf-8')
          PY
          rm .github/workflows/fix-monthly-row-overlap-v459.yml
          rm -f .github/workflows/fix-monthly-row-overlap-v459b.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix monthly amount status overlap v4.59"
          git push
