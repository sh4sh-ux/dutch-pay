name: Fix share date gap v4.51
on:
  push:
    paths:
      - '.github/workflows/fix-share-date-gap-v451.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch v4.51
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s, n = re.subn(r"const APP_VERSION='v4\.50';", "const APP_VERSION='v4.51';", s, count=1)
          if n != 1:
              raise SystemExit('APP_VERSION v4.50 not found exactly once')

          old = '.share-date-row{margin-bottom:14px;display:grid;'
          new = '.share-date-row{margin-bottom:5px;display:grid;'
          if old not in s:
              raise SystemExit('share-date-row margin rule not found')
          s = s.replace(old, new, 1)

          # Remove the ineffective adjacent-sibling optical patch from v4.50.
          s = re.sub(
              r'\n/\* v4\.50 period-row optical spacing \*/\n@media\(max-width:700px\)\{\n  \.share-date-row \+ \.share-date-row\{margin-top:-9px;\}\n\}\n',
              '\n', s, count=1
          )

          p.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          t = sw.read_text(encoding='utf-8')
          t, n = re.subn(r'dutch-pay-v4\.50', 'dutch-pay-v4.51', t, count=1)
          if n != 1:
              raise SystemExit('sw cache v4.50 not found exactly once')
          sw.write_text(t, encoding='utf-8')
          PY

          rm .github/workflows/fix-share-date-gap-v451.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js .github/workflows/fix-share-date-gap-v451.yml
          git commit -m 'Fix actual share date row gap v4.51'
          git push
