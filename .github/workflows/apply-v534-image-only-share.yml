name: Apply v5.34 image-only mobile share
on:
  push:
    paths:
      - '.github/workflows/apply-v534-image-only-share.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch image share payload
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="const shareData={files:[file],title:'더치페이 정산 내역'};"
          n=s.count(old)
          if n != 2:
              raise SystemExit(f'expected 2 shareData title occurrences, found {n}')
          s=s.replace(old,"const shareData={files:[file]};")
          s=s.replace("const APP_VERSION='v5.33';","const APP_VERSION='v5.34';")
          p.write_text(s)
          sw=Path('sw.js')
          w=sw.read_text()
          import re
          w=re.sub(r"dutch-pay-v5\.\d+", "dutch-pay-v5.34", w)
          sw.write_text(w)
          PY
      - name: Validate
        run: |
          grep -q "const APP_VERSION='v5.34'" index.html
          test "$(grep -o "title:'더치페이 정산 내역'" index.html | wc -l)" -eq 0
          test "$(grep -o 'const shareData={files:\[file\]};' index.html | wc -l)" -ge 2
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/apply-v534-image-only-share.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js .github/workflows/apply-v534-image-only-share.yml
          git commit -m 'v5.34 모바일 이미지 단독 공유'
          git push
