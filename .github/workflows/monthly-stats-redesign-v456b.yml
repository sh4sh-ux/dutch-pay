name: Monthly stats redesign v4.56b
on:
  push:
    paths:
      - '.github/workflows/monthly-stats-redesign-v456b.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch monthly stats UI
        run: |
          echo '' | base64 -d > /tmp/monthly.css
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if "const APP_VERSION='v4.55';" not in s:
              raise SystemExit('v4.55 app version not found')
          s=s.replace("const APP_VERSION='v4.55';","const APP_VERSION='v4.56';",1)
          marker='/* v4.56 monthly stats redesign */'
          if marker not in s:
              css=Path('/tmp/monthly.css').read_text(encoding='utf-8')
              pos=s.rfind('</style>')
              if pos<0: raise SystemExit('style closing tag not found')
              s=s[:pos]+css+s[pos:]
          p.write_text(s,encoding='utf-8')
          sw=Path('sw.js')
          t=sw.read_text(encoding='utf-8')
          if 'dutch-pay-v4.55' not in t: raise SystemExit('v4.55 cache not found')
          sw.write_text(t.replace('dutch-pay-v4.55','dutch-pay-v4.56',1),encoding='utf-8')
          PY
          rm .github/workflows/monthly-stats-redesign-v456b.yml
          rm -f .github/workflows/monthly-stats-redesign-v456.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js .github/workflows/monthly-stats-redesign-v456b.yml .github/workflows/monthly-stats-redesign-v456.yml
          git commit -m 'Redesign monthly stats UI v4.56'
          git push
