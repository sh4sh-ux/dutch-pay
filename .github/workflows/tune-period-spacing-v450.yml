name: Tune period spacing v4.50
on:
  push:
    paths:
      - '.github/workflows/tune-period-spacing-v450.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch v4.50
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s, n = re.subn(r"const APP_VERSION='v4\.49';", "const APP_VERSION='v4.50';", s, count=1)
          if n != 1:
              raise SystemExit('APP_VERSION v4.49 not found exactly once')

          old = ".share-date-row + .share-date-row{margin-top:-5px;}"
          new = ".share-date-row + .share-date-row{margin-top:-9px;}"
          if old not in s:
              raise SystemExit('v4.49 period spacing rule not found')
          s = s.replace(old, new, 1)

          s = s.replace('/* v4.49 period-row optical spacing */', '/* v4.50 period-row optical spacing */', 1)
          p.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          t = sw.read_text(encoding='utf-8')
          t, n = re.subn(r'dutch-pay-v4\.49', 'dutch-pay-v4.50', t, count=1)
          if n != 1:
              raise SystemExit('sw cache v4.49 not found exactly once')
          sw.write_text(t, encoding='utf-8')
          PY

          rm .github/workflows/tune-period-spacing-v450.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js .github/workflows/tune-period-spacing-v450.yml
          git commit -m 'Tighten actual period row spacing v4.50'
          git push
