name: Apply v5.30 direct category UI fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v5.30-direct-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch index directly
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          idx = Path('index.html')
          s = idx.read_text(encoding='utf-8')

          # 1) 버전은 원본에서 직접 관리
          s = s.replace("const APP_VERSION='v5.29';", "const APP_VERSION='v5.30';", 1)
          s = s.replace("const BUILD_TIME='2026-09-02 09:15';", "const BUILD_TIME='2026-09-02 09:25';", 1)

          # 2) 확대/4열 레이아웃 CSS를 원본 HTML에 직접 연결
          css = '<link rel="stylesheet" href="./category-grid-v5.27.css"/>'
          if css not in s:
              s = s.replace('</head>', css + '\n</head>', 1)

          # 3) 사용자 제공 최신 SVG 16종을 원본 HTML에서 직접 로드
          old_icons = '<script src="category-icons.js"></script>'
          new_icons = '\n'.join([
              '<script src="./category-icons-v5.28-1.js"></script>',
              '<script src="./category-icons-v5.28-2.js"></script>',
              '<script src="./category-icons-v5.28-3.js"></script>',
              '<script src="./category-icons-v5.28-4.js"></script>',
          ])
          if old_icons in s:
              s = s.replace(old_icons, new_icons, 1)

          # 4) 4x4 카테고리 피커 JS도 원본 HTML에 직접 연결
          grid_js = '<script src="./category-grid-v5.27.js"></script>'
          if grid_js not in s:
              s = s.replace('</body>', grid_js + '\n</body>', 1)

          idx.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          w = sw.read_text(encoding='utf-8')
          w = w.replace('dutch-pay-v5.29', 'dutch-pay-v5.30')
          sw.write_text(w, encoding='utf-8')
          PY

      - name: Validate direct source wiring
        shell: bash
        run: |
          grep -q "const APP_VERSION='v5.30';" index.html
          grep -q './category-grid-v5.27.css' index.html
          grep -q './category-grid-v5.27.js' index.html
          grep -q './category-icons-v5.28-1.js' index.html
          grep -q './category-icons-v5.28-2.js' index.html
          grep -q './category-icons-v5.28-3.js' index.html
          grep -q './category-icons-v5.28-4.js' index.html
          if grep -q '<script src="category-icons.js"></script>' index.html; then
            echo 'old icon bundle still wired in index.html'
            exit 1
          fi
          grep -q 'dutch-pay-v5.30' sw.js

      - name: Commit direct fix and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-v530-direct-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: wire v5.30 category UI directly in index [v5.30-direct-applied]"
          git push origin HEAD:main
