name: Align X v4.55
on:
  push:
    paths:
      - '.github/workflows/align-x-v455.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch v4.55
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if "const APP_VERSION='v4.54';" not in s:
              raise SystemExit('v4.54 app version not found')
          s=s.replace("const APP_VERSION='v4.54';","const APP_VERSION='v4.55';",1)
          old='''.share-date-row > .share-date-dp:nth-child(3),\n  .share-date-row > .share-date-rm:nth-child(4){transform:translateY(-8px);}'''
          new='''.share-date-row > .share-date-dp:nth-child(3){transform:translateY(-8px);}\n  .share-date-row > .share-date-rm:nth-child(4){transform:translateY(-17px);}'''
          if old not in s:
              raise SystemExit('v4.54 spacing rule not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          sw=Path('sw.js')
          t=sw.read_text(encoding='utf-8')
          if 'dutch-pay-v4.54' not in t:
              raise SystemExit('v4.54 cache not found')
          sw.write_text(t.replace('dutch-pay-v4.54','dutch-pay-v4.55',1),encoding='utf-8')
          PY
          rm .github/workflows/align-x-v455.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js .github/workflows/align-x-v455.yml
          git commit -m 'Align X control v4.55'
          git push
