name: Apply v5.27 category grid direct fix

on:
  push:
    branches:
      - fix/v5.27-category-grid-direct

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[v5.27-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v5.27-category-grid-direct
          fetch-depth: 0

      - name: Patch index.html directly
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          old_version = "const APP_VERSION='v5.25';"
          if s.count(old_version) != 1:
              raise SystemExit(f'Expected exactly one {old_version!r}, found {s.count(old_version)}')
          s = s.replace(old_version, "const APP_VERSION='v5.27';", 1)

          s, build_count = re.subn(
              r"const BUILD_TIME='[^']+';",
              "const BUILD_TIME='2026-09-02 08:46';",
              s,
              count=1,
          )
          if build_count != 1:
              raise SystemExit(f'BUILD_TIME replacement count={build_count}')

          css = r'''
/* v5.27 카테고리 선택창 — index.html 직접 적용 */
.pay-ic > svg{width:18px!important;height:18px!important;}
.icon-pop.category-picker-v527{min-width:0!important;box-sizing:border-box;}
.icon-pop.category-picker-v527 .icon-pop-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px 10px;}
.icon-pop.category-picker-v527 .icon-auto{display:inline-flex;align-items:center;justify-content:center;gap:4px;border:none;background:transparent;border-radius:8px;color:var(--label2);padding:5px 8px;font-family:inherit;cursor:pointer;}
.icon-pop.category-picker-v527 .icon-auto:hover{background:var(--fill);}
.icon-pop.category-picker-v527 .icon-auto.on{background:var(--blue-bg);color:var(--blue-txt);}
.icon-pop.category-picker-v527 .icon-auto svg{width:14px;height:14px;}
.icon-pop.category-picker-v527 .icon-auto .icon-lbl{font-size:10px;color:inherit;line-height:1;}
.icon-pop.category-picker-v527 .icon-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 10px;width:100%;padding:14px 16px 16px;}
.icon-pop.category-picker-v527 .icon-opt{min-width:0;gap:6px;padding:11px 4px 10px;}
.icon-pop.category-picker-v527 .icon-opt svg{width:22px;height:22px;}
.icon-pop.category-picker-v527 .icon-lbl{font-size:10.5px;line-height:1.15;white-space:nowrap;}
@media(max-width:700px){
  .icon-pop.category-picker-v527 .icon-pop-hd{padding:10px 10px 9px;}
  .icon-pop.category-picker-v527 .icon-grid{grid-template-columns:repeat(8,minmax(0,1fr));gap:4px 2px;padding:10px 6px 12px;}
  .icon-pop.category-picker-v527 .icon-opt{gap:5px;padding:8px 0 7px;}
  .icon-pop.category-picker-v527 .icon-opt svg{width:18px;height:18px;}
  .icon-pop.category-picker-v527 .icon-lbl{font-size:8.5px;letter-spacing:-.25px;}
}
'''
          if '/* v5.27 카테고리 선택창 — index.html 직접 적용 */' in s:
              raise SystemExit('v5.27 CSS already present unexpectedly')
          if '</style>' not in s:
              raise SystemExit('No </style> marker found')
          s = s.replace('</style>', css + '\n</style>', 1)

          new_picker = r'''function showIconPicker(itemId,anchorEl,ev){
  if(ev){ev.stopPropagation();ev.preventDefault();}
  document.querySelectorAll('.icon-pop,.rounder-pop').forEach(el=>el.remove());
  const it=items.find(i=>i.id===itemId);if(!it)return;
  const cur=it.iconOverride||'';
  const categories=[
    {k:'food',svg:svgFood,lbl:'외식',tip:'식당·한식·일식·중식'},
    {k:'cafe',svg:svgCafe,lbl:'카페',tip:'카페·커피·음료'},
    {k:'beer',svg:svgBeer,lbl:'술집',tip:'맥주·소주·이자카야·바'},
    {k:'mic',svg:svgMic,lbl:'노래방',tip:'노래방·코노·가라오케'},
    {k:'shop',svg:svgShop,lbl:'쇼핑',tip:'마트·편의점·백화점'},
    {k:'movie',svg:svgMovie,lbl:'문화',tip:'영화·공연·전시·문화'},
    {k:'car',svg:svgCar,lbl:'교통',tip:'택시·버스·주유·주차'},
    {k:'plane',svg:svgPlane,lbl:'여행',tip:'비행기·여행·항공·출장'},
    {k:'bed',svg:svgBed,lbl:'숙박',tip:'호텔·펜션·풀빌라·숙소'},
    {k:'golf',svg:svgGolf,lbl:'골프',tip:'골프·라운드·그린피'},
    {k:'spa',svg:svgSpa,lbl:'스파',tip:'찜질방·사우나·마사지'},
    {k:'dumbbell',svg:svgDumbbell,lbl:'운동',tip:'헬스·볼링·수영·스포츠'},
    {k:'cake',svg:svgCake,lbl:'기념',tip:'케이크·생일·기념일'},
    {k:'event',svg:svgEvent,lbl:'경조',tip:'축의·부의·경조사'},
    {k:'medical',svg:svgMedical,lbl:'의료',tip:'병원·약국·진료·검진'},
    {k:'receipt',svg:svgReceipt,lbl:'기타',tip:'기타·분류 없음'}
  ];
  const svgAutoIcon='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>';
  const pop=document.createElement('div');
  pop.className='icon-pop category-picker-v527';
  pop.innerHTML=`<div class="icon-pop-hd"><span>아이콘 선택</span><button type="button" class="icon-auto${cur===''?' on':''}" data-key="">${svgAutoIcon}<span class="icon-lbl">자동</span></button></div><div class="icon-grid">${categories.map(o=>`<button class="icon-opt${cur===o.k?' on':''}" data-key="${o.k}" data-tip="${o.tip||''}">${o.svg}<span class="icon-lbl">${o.lbl}</span></button>`).join('')}</div>`;
  pop.addEventListener('click',ev2=>{ev2.stopPropagation();const btn=ev2.target.closest('[data-key]');if(!btn)return;setIconOverride(itemId,btn.dataset.key);pop.remove();});
  document.body.appendChild(pop);

  const ar=anchorEl&&anchorEl.getBoundingClientRect?anchorEl.getBoundingClientRect():null;
  const row=anchorEl&&anchorEl.closest?anchorEl.closest('.detail-row,.rc-item-row'):null;
  const area=row&&row.parentElement?row.parentElement:null;
  const cr=area&&area.getBoundingClientRect?area.getBoundingClientRect():null;
  const vw=document.documentElement.clientWidth||window.innerWidth;
  const margin=8;
  let width,left;
  if(cr&&cr.width>0){width=Math.min(cr.width,vw-margin*2);left=cr.left+window.scrollX;}
  else{width=Math.min(window.matchMedia('(max-width:700px)').matches?vw-margin*2:640,vw-margin*2);left=(vw-width)/2+window.scrollX;}
  left=Math.max(window.scrollX+margin,Math.min(left,window.scrollX+vw-width-margin));
  pop.style.width=width+'px';
  pop.style.minWidth='0';
  pop.style.left=left+'px';
  pop.style.top=((ar?ar.bottom:0)+window.scrollY+6)+'px';

  setTimeout(()=>{
    const h=ev3=>{if(!pop.contains(ev3.target)){pop.remove();document.removeEventListener('click',h);document.removeEventListener('keydown',k);}};
    const k=ev3=>{if(ev3.key==='Escape'){pop.remove();document.removeEventListener('click',h);document.removeEventListener('keydown',k);}};
    document.addEventListener('click',h);document.addEventListener('keydown',k);
  },0);
}'''

          pattern = re.compile(r"function showIconPicker\(itemId,anchorEl,ev\)\{.*?\n\nfunction showRounderPicker", re.S)
          s, picker_count = pattern.subn(new_picker + '\n\nfunction showRounderPicker', s, count=1)
          if picker_count != 1:
              raise SystemExit(f'showIconPicker replacement count={picker_count}')

          path.write_text(s, encoding='utf-8')
          PY

      - name: Replace service worker with direct v5.27 cache
        shell: bash
        run: |
          cat > sw.js <<'EOF'
          const CACHE_NAME = "dutch-pay-v5.27";
          const ASSETS = [
            "./",
            "./index.html",
            "./category-icons.js",
            "./manifest.webmanifest",
            "./favicon.png",
            "./icons/icon-192.png",
            "./icons/icon-512.png",
            "./icons/apple-touch-icon.png"
          ];

          self.addEventListener("install", (event) => {
            event.waitUntil(caches.open(CACHE_NAME).then((cache) => cache.addAll(ASSETS.filter(Boolean))));
            self.skipWaiting();
          });

          self.addEventListener("activate", (event) => {
            event.waitUntil(
              caches.keys().then((keys) => Promise.all(
                keys.filter((key) => key.startsWith("dutch-pay") && key !== CACHE_NAME).map((key) => caches.delete(key))
              ))
            );
            self.clients.claim();
          });

          self.addEventListener("fetch", (event) => {
            if (event.request.method !== "GET") return;
            const url = new URL(event.request.url);
            const isHTML = event.request.mode === "navigate" || url.pathname.endsWith(".html") || url.pathname.endsWith("/");

            if (isHTML) {
              event.respondWith(
                fetch(event.request, { cache: "no-store" }).then((response) => {
                  if (response && response.status === 200) {
                    const copy = response.clone();
                    caches.open(CACHE_NAME).then((cache) => cache.put(event.request, copy)).catch(() => {});
                  }
                  return response;
                }).catch(() => caches.match(event.request).then((c) => c || caches.match("./index.html")))
              );
              return;
            }

            event.respondWith(
              caches.match(event.request).then((cached) => cached || fetch(event.request).then((response) => {
                if (!response || response.status !== 200) return response;
                const copy = response.clone();
                caches.open(CACHE_NAME).then((cache) => cache.put(event.request, copy)).catch(() => {});
                return response;
              }))
            );
          });
          EOF

      - name: Remove v5.26 workaround files
        run: rm -f category-grid-v5.26.css category-grid-v5.26.js

      - name: Validate direct changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks={
            'version': "const APP_VERSION='v5.27';" in s,
            'desktop_4x4': 'grid-template-columns:repeat(4,minmax(0,1fr))' in s,
            'mobile_8x2': 'grid-template-columns:repeat(8,minmax(0,1fr))' in s,
            'picker_direct': "pop.className='icon-pop category-picker-v527'" in s,
            'category_count': s.count("{k:'") >= 16,
            'old_runtime_helper_absent': 'category-grid-v5.26.css' not in s and 'category-grid-v5.26.js' not in s,
          }
          failed=[k for k,v in checks.items() if not v]
          print(checks)
          if failed: raise SystemExit('failed: '+', '.join(failed))
          PY
          node --check sw.js
          test ! -e category-grid-v5.26.css
          test ! -e category-grid-v5.26.js

      - name: Commit direct fix
        shell: bash
        run: |
          rm -f .github/workflows/v527-category-grid-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: apply v5.27 category grid directly [v5.27-applied]"
          git push origin HEAD:fix/v5.27-category-grid-direct
