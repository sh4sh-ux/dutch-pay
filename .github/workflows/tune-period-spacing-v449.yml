name: Tune period spacing v4.49
on:
  push:
    paths:
      - '.github/workflows/tune-period-spacing-v449.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch v4.49
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Version bump
          s, n = re.subn(r"const APP_VERSION='v4\.48';", "const APP_VERSION='v4.49';", s, count=1)
          if n != 1:
              raise SystemExit('APP_VERSION v4.48 not found exactly once')

          # Keep zero internal gap, then visually pull only the second date row upward.
          # This addresses the real spacing between the two separate date rows.
          marker = '/* v4.49 period-row optical spacing */'
          css = "\n" + marker + "\n@media(max-width:700px){\n  .share-date-row + .share-date-row{margin-top:-5px;}\n}\n"
          if marker not in s:
              idx = s.find('</style>')
              if idx == -1:
                  raise SystemExit('</style> not found')
              s = s[:idx] + css + s[idx:]

          p.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          t = sw.read_text(encoding='utf-8')
          t, n = re.subn(r'dutch-pay-v4\.48', 'dutch-pay-v4.49', t, count=1)
          if n != 1:
              raise SystemExit('sw cache v4.48 not found exactly once')
          sw.write_text(t, encoding='utf-8')
          PY

          rm .github/workflows/tune-period-spacing-v449.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js .github/workflows/tune-period-spacing-v449.yml
          git commit -m 'Tighten actual period row spacing v4.49'
          git push
