name: Apply v5.33 icon weight tuning

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-v533-icon-weight.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply subtle icon weight increase
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [Path(f'category-icons-v5.28-{i}.js') for i in range(1,5)]
          for p in files:
              s = p.read_text()
              old = 'stroke-width="0.30"'
              new = 'stroke-width="0.38"'
              if old not in s:
                  raise SystemExit(f'{old} not found in {p}')
              s = s.replace(old, new)
              p.write_text(s)

          p = Path('index.html')
          s = p.read_text()
          if "const APP_VERSION='v5.32';" not in s:
              raise SystemExit('v5.32 APP_VERSION not found')
          s = s.replace("const APP_VERSION='v5.32';", "const APP_VERSION='v5.33';", 1)
          s = s.replace("const BUILD_TIME='2026-09-02 09:37';", "const BUILD_TIME='2026-09-02 09:41';", 1) if "const BUILD_TIME='2026-09-02 09:37';" in s else s
          p.write_text(s)

          p = Path('sw.js')
          s = p.read_text()
          if 'dutch-pay-v5.32' not in s:
              raise SystemExit('v5.32 cache name not found')
          s = s.replace('dutch-pay-v5.32', 'dutch-pay-v5.33', 1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          grep -q "APP_VERSION='v5.33'" index.html
          grep -q 'dutch-pay-v5.33' sw.js
          for f in category-icons-v5.28-{1,2,3,4}.js; do
            grep -q 'stroke-width="0.38"' "$f"
            ! grep -q 'stroke-width="0.30"' "$f"
          done
      - name: Commit fix and remove temporary workflow
        run: |
          rm .github/workflows/apply-v533-icon-weight.yml
          git config user.name "sh4sh-ux"
          git config user.email "onlysh4sh@gmail.com"
          git add index.html sw.js category-icons-v5.28-1.js category-icons-v5.28-2.js category-icons-v5.28-3.js category-icons-v5.28-4.js .github/workflows/apply-v533-icon-weight.yml
          git commit -m "v5.33 카테고리 아이콘 굵기 미세 조정"
          git push
