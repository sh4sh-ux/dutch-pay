name: Fix v5.44 display version
on:
  push:
    paths:
      - '.github/workflows/fix-v544-display-version.yml'
permissions:
  contents: write
jobs:
  fix-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update displayed app version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = "const APP_VERSION='v5.43';"
          new = "const APP_VERSION='v5.44';"
          if old not in s:
              raise SystemExit('Expected v5.43 APP_VERSION not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -q "const APP_VERSION='v5.44';" index.html
          ! grep -q "const APP_VERSION='v5.43';" index.html
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'v5.44 화면 표시 버전 반영'
          git push
