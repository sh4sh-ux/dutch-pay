name: Apply v5.45 display version
on:
  push:
    paths:
      - '.github/workflows/apply-v545-display.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update APP_VERSION
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s,n=re.subn(r"const APP_VERSION='v5\.\d+';", "const APP_VERSION='v5.45';", s, count=1)
          if n != 1:
              raise SystemExit(f'APP_VERSION replacements: {n}')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'v5.45 화면 표시 버전 반영'
          git push
