name: Fix monthly row desktop v4.60b
"on":
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch desktop monthly rows
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, base64
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r"const APP_VERSION='v\d+\.\d+';", "const APP_VERSION='v4.60';", s, count=1)
          if n != 1: raise SystemExit('APP_VERSION not found')
          marker='/* v4.60 monthly row alignment all screens */'
          css=base64.b64decode('').decode()
          if marker not in s:
              pos=s.rfind('</style>')
              if pos < 0: raise SystemExit('style closing tag not found')
              s=s[:pos]+css+s[pos:]
          p.write_text(s,encoding='utf-8')
          sw=Path('sw.js')
          t=sw.read_text(encoding='utf-8')
          t,n=re.subn(r'dutch-pay-v\d+\.\d+', 'dutch-pay-v4.60', t, count=1)
          if n != 1: raise SystemExit('cache version not found')
          sw.write_text(t,encoding='utf-8')
          PY
          rm -f .github/workflows/fix-monthly-row-desktop-v460.yml
          rm .github/workflows/fix-monthly-row-desktop-v460b.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Apply monthly row alignment on desktop v4.60"
          git push
