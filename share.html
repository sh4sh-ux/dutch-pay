<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>더치페이 정산</title>
<meta name="theme-color" content="#f4f4f6"/>
<style>
  :root{
    --bg:#f4f4f6;--card:#fff;--sep:#ececef;--fill:#f4f4f6;--fill2:#eeeef1;
    --label:#111114;--label2:#6b6b72;--label3:#9a9aa2;
    --blue:#3f51e0;--blue-bg:#eceefe;--blue-txt:#3140c0;--green:#12b76a;--txn-amber:#e59a2b;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0d0e11;--card:#17181c;--sep:#25262c;--fill:#1a1b20;--fill2:#202128;
      --label:#f2f2f4;--label2:#9fa0a8;--label3:#6d6e77;
      --blue:#7c8bff;--blue-bg:#1e2350;--blue-txt:#aeb8ff;--green:#3ddc97;--txn-amber:#f0b350;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d0e11;--card:#17181c;--sep:#25262c;--fill:#1a1b20;--fill2:#202128;
    --label:#f2f2f4;--label2:#9fa0a8;--label3:#6d6e77;
    --blue:#7c8bff;--blue-bg:#1e2350;--blue-txt:#aeb8ff;--green:#3ddc97;--txn-amber:#f0b350;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--label);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;padding:20px 14px 48px;display:flex;justify-content:center;}
  .wrap{width:100%;max-width:460px;}
  .brand{display:flex;align-items:center;gap:8px;margin:0 2px 16px;}
  .brand-badge{width:30px;height:30px;border-radius:9px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;}
  .brand-name{font-size:12px;font-weight:700;letter-spacing:.6px;color:var(--label3);text-transform:uppercase;}
  .hero{background:var(--card);border:1px solid var(--sep);border-radius:16px;padding:20px 18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 20px rgba(0,0,0,.05);}
  .hero-title{font-size:18px;font-weight:800;letter-spacing:-.4px;}
  .hero-date{font-size:12.5px;color:var(--label3);margin-top:3px;}
  .hero-total{font-size:30px;font-weight:800;letter-spacing:-.6px;margin-top:14px;font-variant-numeric:tabular-nums;}
  .hero-sub{font-size:12.5px;color:var(--label2);margin-top:4px;}
  .sec{font-size:13px;font-weight:700;color:var(--label2);margin:0 0 9px 4px;}
  .card{background:var(--card);border:1px solid var(--sep);border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 20px rgba(0,0,0,.05);overflow:hidden;margin-bottom:16px;}
  .txn{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--sep);}
  .txn:last-child{border-bottom:none;}
  .txn.grp{border-top:3px solid var(--txn-amber);}
  .txn.grp.mine{border-top-color:var(--blue);}
  .txn-from{font-size:14px;font-weight:600;}
  .txn-arrow{color:var(--label3);}
  .txn-to{font-size:14px;font-weight:600;flex:1;}
  .txn-amt{font-size:14.5px;font-weight:800;font-variant-numeric:tabular-nums;}
  .row{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-bottom:1px solid var(--sep);}
  .row:last-child{border-bottom:none;}
  .row-info{flex:1;min-width:0;}
  .row-main{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .row-name{font-size:15px;font-weight:700;letter-spacing:-.2px;}
  .row-payer{font-size:11.5px;font-weight:600;color:var(--blue);background:var(--blue-bg);padding:2px 7px;border-radius:6px;white-space:nowrap;}
  .row-sub{display:flex;align-items:center;gap:6px;margin-top:4px;}
  .row-mem{font-size:12px;color:var(--label3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
  .row-amt{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .row.has-rcpt{cursor:pointer;}
  .rc-chev{font-size:10px;color:var(--blue);flex-shrink:0;transition:transform .2s ease;align-self:center;}
  .row.exp .rc-chev{transform:rotate(180deg);}
  .rc-inline{max-height:0;overflow:hidden;transition:max-height .28s ease;background:var(--fill);border-bottom:1px solid var(--sep);}
  .rc-inline.open{max-height:1600px;}
  .rc-inline-img{display:block;width:100%;max-width:320px;margin:14px auto;border-radius:10px;cursor:zoom-in;box-shadow:0 4px 16px rgba(0,0,0,.14);background:#fff;}
  .foot{text-align:center;font-size:11.5px;color:var(--label3);margin-top:6px;line-height:1.6;}
  .foot a{color:var(--blue);text-decoration:none;font-weight:600;}
  .empty{text-align:center;color:var(--label3);padding:48px 16px;font-size:14px;line-height:1.6;}
  /* 뷰어 */
  .viewer{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:26px 16px;background:rgba(0,0,0,.82);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .18s ease;}
  .viewer.on{opacity:1;pointer-events:auto;}
  .viewer-inner{position:relative;max-width:100%;max-height:100%;display:flex;align-items:center;justify-content:center;transform:scale(.96);transition:transform .18s ease;}
  .viewer.on .viewer-inner{transform:scale(1);}
  .viewer-img{max-width:100%;max-height:82vh;border-radius:12px;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.5);display:none;cursor:zoom-in;transition:transform .2s ease;}
  .viewer-img.ready{display:block;}
  .viewer-img.zoom{transform:scale(1.6);cursor:zoom-out;}
  .viewer-close{position:absolute;top:-46px;right:-2px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;border:none;font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:2;}
  .viewer-spin{width:38px;height:38px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg)}}
  .viewer-open{color:#fff;text-decoration:underline;font-size:14px;}
  @media(max-width:480px){.viewer-close{top:-44px;right:0;}}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="empty" id="empty">정산 내역을 불러오는 중…</div>
</div>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="영수증 보기">
  <div class="viewer-inner">
    <button class="viewer-close" id="vClose" type="button" aria-label="닫기">✕</button>
    <div class="viewer-spin" id="vSpin" aria-hidden="true"></div>
    <img class="viewer-img" id="vImg" alt="영수증">
    <a class="viewer-open" id="vOpen" target="_blank" rel="noopener noreferrer" hidden>새 탭에서 열기</a>
  </div>
</div>

<script>
(function(){
  "use strict";
  var APP_URL="https://sh4sh-ux.github.io/dutch-pay/";
  // 저장된 테마를 최대한 반영 (같은 기기에서 열 때)
  try{var dm=localStorage.getItem('dutchpay_dark_mode');if(dm==='1')document.documentElement.setAttribute('data-theme','dark');else if(dm==='0')document.documentElement.setAttribute('data-theme','light');}catch(e){}

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function fmt(n){n=Math.round(Number(n)||0);var neg=n<0;n=Math.abs(n);var s=String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',');return (neg?'-':'')+s;}
  function normalize(u){u=String(u||'').trim();if(!u)return'';if(/^data:/i.test(u))return u;if(/^https?:\/\//i.test(u)&&/dropbox\.com/i.test(u)){var v=u.replace(/([?&])dl=0(&|$)/,'$1dl=1$2');if(!/[?&]dl=1(&|$)/.test(v)&&!/[?&]raw=1(&|$)/.test(v))v+=(v.indexOf('?')>=0?'&':'?')+'raw=1';return v;}return u;}

  // 번들 읽기: #d=<encodeURIComponent(JSON)>
  function readBundle(){
    try{
      var h=location.hash||'';
      var m=h.match(/[#&]d=([^&]+)/);
      if(!m){var q=new URLSearchParams(location.search);if(q.get('d'))return JSON.parse(decodeURIComponent(q.get('d')));return null;}
      return JSON.parse(decodeURIComponent(m[1]));
    }catch(e){return null;}
  }

  var receipts={}; // index -> normalized url

  function render(b){
    var wrap=document.getElementById('wrap');
    if(!b||!b.items){wrap.innerHTML='<div class="empty">정산 내역을 불러오지 못했어요.<br>링크가 올바른지 확인해주세요.</div>';return;}
    var people=b.pc||0;
    var total=Number(b.tot)||0;
    var per=people?Math.floor(Math.abs(total)/people):0;
    var html='';
    html+='<div class="brand"><span class="brand-badge">D</span><span class="brand-name">DUTCH PAY</span></div>';
    html+='<div class="hero"><div class="hero-title">'+esc(b.t||'정산 내역')+'</div>'+
          (b.d?'<div class="hero-date">'+esc(b.d)+'</div>':'')+
          '<div class="hero-total">'+fmt(total)+'원</div>'+
          '<div class="hero-sub">총 '+people+'명 · 인당 평균 '+fmt(per)+'원</div></div>';

    // 송금
    if(b.txns&&b.txns.length){
      html+='<div class="sec">보낼 송금 '+b.txns.length+'건</div><div class="card">';
      var prevTo=null;
      b.txns.forEach(function(t){
        var to=t[1];var grp=(to!==prevTo);prevTo=to;
        var mine=(b.me&&to===b.me);
        html+='<div class="txn'+(grp?' grp'+(mine?' mine':''):'')+'"><span class="txn-from">'+esc(t[0])+'</span><span class="txn-arrow">→</span><span class="txn-to">'+esc(to)+'</span><span class="txn-amt">'+fmt(t[2])+'원</span></div>';
      });
      html+='</div>';
    }

    // 지출 내역 — 영수증 있는 항목은 행 클릭 시 펼쳐서 영수증 표시
    html+='<div class="sec">지출 내역</div><div class="card">';
    b.items.forEach(function(it,i){
      var src=normalize(it.r||'');
      if(src)receipts[i]=src;
      var chev=src?'<span class="rc-chev">▼</span>':'';
      html+='<div class="row'+(src?' has-rcpt':'')+'"'+(src?(' data-exp="'+i+'"'):'')+'><div class="row-info"><div class="row-main"><span class="row-name">'+esc(it.n||'(이름 없음)')+'</span>'+(it.p?'<span class="row-payer">'+esc(it.p)+' 결제</span>':'')+'</div>'+
            '<div class="row-sub"><span class="row-mem">'+esc(it.m||'')+'</span></div></div>'+
            chev+'<span class="row-amt">'+fmt(it.a)+'원</span></div>'+
            (src?('<div class="rc-inline" id="rcin'+i+'"><img class="rc-inline-img" data-idx="'+i+'" alt="'+esc(it.n||'')+' 영수증" src="'+esc(src)+'"></div>'):'');
    });
    html+='</div>';
    html+='<div class="foot">더치페이로 정산했어요 · <a href="'+APP_URL+'" target="_blank" rel="noopener">나도 쓰기</a></div>';
    wrap.innerHTML=html;

    // 행 클릭 → 영수증 펼침 / 펼친 이미지 클릭 → 크게 보기
    wrap.addEventListener('click',function(e){
      var img=e.target.closest('.rc-inline-img');
      if(img){openViewer(receipts[img.getAttribute('data-idx')]);return;}
      var row=e.target.closest('.row[data-exp]');
      if(row){var i=row.getAttribute('data-exp');var panel=document.getElementById('rcin'+i);if(panel){var open=panel.classList.toggle('open');row.classList.toggle('exp',open);}}
    });

    // 버퍼링 0: 모든 영수증 이미지를 미리 로딩(캐시)
    Object.keys(receipts).forEach(function(k){var im=new Image();im.src=receipts[k];});
  }

  // 뷰어
  var viewer=document.getElementById('viewer'),vImg=document.getElementById('vImg'),vSpin=document.getElementById('vSpin'),vOpen=document.getElementById('vOpen');
  function looksImg(u){return /^data:image\//i.test(u)||/\.(jpe?g|png|webp|gif|heic|bmp)(\?|#|$)/i.test(u)||/dropbox\.com/i.test(u);}
  function openViewer(src){
    if(!src)return;
    if(!looksImg(src)){window.open(src,'_blank','noopener');return;}
    vImg.classList.remove('ready','zoom');vImg.style.display='';vSpin.style.display='';vOpen.hidden=true;
    vImg.onload=function(){vSpin.style.display='none';vImg.classList.add('ready');};
    vImg.onerror=function(){vSpin.style.display='none';vOpen.href=src;vOpen.hidden=false;};
    vImg.src=src;
    viewer.classList.add('on');document.addEventListener('keydown',onKey);
  }
  function closeViewer(){viewer.classList.remove('on');document.removeEventListener('keydown',onKey);}
  function onKey(e){if(e.key==='Escape')closeViewer();}
  document.getElementById('vClose').onclick=closeViewer;
  viewer.addEventListener('click',function(e){if(e.target===viewer)closeViewer();});
  vImg.addEventListener('click',function(e){e.stopPropagation();vImg.classList.toggle('zoom');});

  render(readBundle());
})();
</script>
</body>
</html>
