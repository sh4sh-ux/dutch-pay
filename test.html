<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<style>

</head>
<body>
<h1>더치페이 계산 로직 테스트</h1>
<p class="subtitle">computeShares · calcTxns · _receiptTableHtml</p>
<div class="note">
  이 테스트는 <b>index.html을 iframe으로 불러 그 안의 실제 함수를 직접 호출</b>합니다.
  로직 복사본을 두지 않으므로 앱과 테스트가 갈라지지 않습니다.<br>
  실행 중 앱의 저장 함수(<code>saveState</code>·<code>syncCurrentToGroup</code>·<code>saveHistory</code>·<code>syncToDropbox</code>)를
  무력화하고, 끝나면 localStorage를 원래대로 되돌립니다. <b>실제 정산 데이터는 건드리지 않습니다.</b>
</div>
<div id="summary"></div>
<div id="results"></div>
<iframe id="appFrame" src="index.html" title="테스트 대상 앱"></iframe>

<script>
// ── 테스트 프레임워크 ──────────────────────────────────────────────────────

const suites = [];
let currentSuite = null;
let APP = null;   // index.html의 window

function suite(name, fn) {
  currentSuite = { name, tests: [] };
  suites.push(currentSuite);
  try { fn(); }
  catch(e) { currentSuite.tests.push({ name:'스위트 실행 실패', status:'fail', detail:'', error:e.message }); }
}

function test(name, fn) {
  const t = { name, status: 'skip', detail: '', error: '' };
  currentSuite.tests.push(t);
  try {
    const result = fn();
    t.status = result === false ? 'fail' : 'pass';
    if (typeof result === 'string') t.detail = result;
  } catch(e) {
    t.status = 'fail';
    t.error = e.message;
  }
}

function expect(val) {
  return {
    toBe(expected) {
      if (val !== expected) throw new Error(`expected ${JSON.stringify(expected)}, got ${JSON.stringify(val)}`);
    },
    toEqual(expected) {
      const a = JSON.stringify(val), b = JSON.stringify(expected);
      if (a !== b) throw new Error(`expected ${b}, got ${a}`);
    },
    toBeGreaterThan(n) { if (!(val > n)) throw new Error(`expected ${val} > ${n}`); },
    toBeLessThan(n)    { if (!(val < n)) throw new Error(`expected ${val} < ${n}`); },
  };
}

// ── 앱 함수 호출 도우미 ────────────────────────────────────────────────────
// 앱의 computeShares/calcTxns는 전역 people·items를 읽는다.
// 다만 이 둘은 index.html에서 let으로 선언돼 window 속성이 아니라 렉시컬 바인딩이므로
// 부모 창에서 APP.people = ... 로는 앱 함수에 전달되지 않는다.
// 그래서 iframe 안에 헬퍼 스크립트를 주입해 그 스코프에서 대입한다. (__test.set)
// calcTxns(paid,owes)는 인자를 받지만 본문에서 쓰지 않으므로 인자 없이 부른다.

let CUR_PEOPLE = [];

function setup(p, it) {
  CUR_PEOPLE = p.slice();
  const norm = it.map((x, i) => ({ id: i+1, name: x.name || 't'+i, members: [], watchers: [], isTreat: false, ...x }));
  APP.__test.set(p.slice(), norm);
}
const shares = () => APP.computeShares();
const txns   = () => APP.calcTxns();

// 각자의 순포지션(낸 돈 − 자기 몫)이 실제 송금 순액과 맞는지 —
// 최소 송금 여부와 무관하게 항상 성립해야 하는 불변식.
function assertBalanced(tol) {
  tol = tol === undefined ? 1 : tol;
  const { paid, owes } = shares();
  const t = txns();
  const move = {};
  CUR_PEOPLE.forEach(p => move[p] = 0);
  t.forEach(x => { move[x.from] -= x.amt; move[x.to] += x.amt; });
  const bad = CUR_PEOPLE
    .map(p => ({ p, need: (paid[p]||0) - (owes[p]||0), got: move[p] }))
    .filter(x => Math.abs(x.need - x.got) > tol);
  if (bad.length) throw new Error('수지 불일치: ' + JSON.stringify(bad));
}

const txnStr = t => t.map(x => `${x.from}→${x.to} ${x.amt.toLocaleString()}`).join(', ') || '(없음)';

// ── 테스트 케이스 ──────────────────────────────────────────────────────────

function defineTests() {

// 화면 표시 버전(APP_VERSION)과 서비스워커 캐시 이름(CACHE_NAME)이 어긋나면
// 앱은 옛 버전을 표시하면서 캐시만 갱신되어, 배포가 반영된 건지 알 수 없게 된다.
// 실제로 v5.46~v5.48에서 sw.js만 올라가고 index.html이 v5.45에 멈춘 적이 있다.
suite('TC0: 버전 동기화', () => {
  let appVer=null, swVer=null, err=null;
  try {
    appVer = APP.__test.ver();
    const req = new XMLHttpRequest();
    req.open('GET', 'sw.js', false);          // 동기 요청 — 테스트 실행 흐름을 단순하게
    req.send(null);
    const m = req.responseText.match(/dutch-pay-(v[\d.]+)/);
    swVer = m && m[1];
  } catch(e) { err = e.message; }

  test('index.html의 APP_VERSION과 sw.js의 CACHE_NAME이 같다', () => {
    if (err) throw new Error('sw.js를 읽지 못함: ' + err);
    if (!appVer) throw new Error('APP_VERSION을 찾지 못함');
    if (!swVer)  throw new Error('sw.js에서 CACHE_NAME을 찾지 못함');
    if (appVer !== swVer) throw new Error(`어긋남 — index.html ${appVer} vs sw.js ${swVer}`);
    return `${appVer}`;
  });
});


suite('TC1: 균등 분배 (나누어 떨어짐)', () => {
  setup(['A','B','C'], [{ name:'저녁', amount:30000, payer:'A' }]);
  const { paid, owes } = shares();
  const t = txns();

  test('각 인당 분담액 = 10,000원', () => {
    expect(owes['A']).toBe(10000);
    expect(owes['B']).toBe(10000);
    expect(owes['C']).toBe(10000);
  });
  test('A의 결제액 = 30,000원', () => expect(paid['A']).toBe(30000));
  test('송금 2건: B→A, C→A', () => {
    expect(t.length).toBe(2);
    return txnStr(t);
  });
  test('B는 A에게 10,000 송금', () => {
    const x = t.find(v => v.from === 'B' && v.to === 'A');
    if (!x) throw new Error('B→A 송금 없음');
    expect(x.amt).toBe(10000);
  });
  test('수지 균형', () => assertBalanced());
});

suite('TC2: 1원 나머지 — 결제자 흡수', () => {
  setup(['A','B','C'], [{ name:'커피', amount:10000, payer:'A' }]);
  const { owes, hasRounding } = shares();

  test('총 분담액 합 = 총액', () => {
    expect(Object.values(owes).reduce((s,v)=>s+v,0)).toBe(10000);
  });
  test('hasRounding = true', () => {
    if (!hasRounding) throw new Error('나머지 발생 감지 실패');
  });
  test('결제자(A)가 나머지 1원 흡수 → owes[A] = 3,334', () => {
    expect(owes['A']).toBe(3334);
  });
  test('수지 균형', () => assertBalanced());
});

suite('TC3: 특정 멤버만 참여하는 지출', () => {
  setup(['A','B','C'], [{ name:'택시', amount:20000, payer:'A', members:['A','B'] }]);
  const { owes } = shares();
  const t = txns();

  test('C의 분담액 = 0 (불참)', () => expect(owes['C']).toBe(0));
  test('A, B 각 10,000원 분담', () => {
    expect(owes['A']).toBe(10000);
    expect(owes['B']).toBe(10000);
  });
  test('B→A 10,000 송금 1건만 발생', () => {
    expect(t.length).toBe(1);
    expect(t[0].from).toBe('B');
    expect(t[0].to).toBe('A');
    expect(t[0].amt).toBe(10000);
  });
  test('수지 균형', () => assertBalanced());
});

suite('TC4: 여러 지출 — 결제자별 직접 정산', () => {
  setup(['A','B','C'], [
    { name:'저녁', amount:30000, payer:'A' },
    { name:'교통', amount:15000, payer:'B' },
    { name:'카페', amount:9000,  payer:'C' },
  ]);
  const { paid, owes } = shares();
  const t = txns();

  test('총 분담액 합 = 총 지출', () => {
    expect(Object.values(paid).reduce((s,v)=>s+v,0))
      .toBe(Object.values(owes).reduce((s,v)=>s+v,0));
  });
  test('모든 송금액이 양수', () => {
    if (t.some(x => x.amt <= 0)) throw new Error('0원 이하 송금 발생');
  });
  // 앱의 calcTxns는 최소 송금이 목표가 아니라 결제자별 채무를 직접 정산한다.
  // 따라서 건수는 N-1을 넘을 수 있고, 대신 아래 수지 불변식이 성립해야 한다.
  test('쌍별 상계 후 한 방향만 남음 (A↔B 역방향 동시 발생 없음)', () => {
    const seen = new Set();
    t.forEach(x => {
      const rev = x.to + '|' + x.from;
      if (seen.has(rev)) throw new Error(`${x.from}↔${x.to} 양방향 송금 발생`);
      seen.add(x.from + '|' + x.to);
    });
    return txnStr(t);
  });
  test('수지 균형', () => assertBalanced());
});

suite('TC5: 1인 정산', () => {
  setup(['혼자'], [{ name:'밥', amount:15000, payer:'혼자' }]);
  const { owes } = shares();
  const t = txns();

  test('분담액 = 전체 금액', () => expect(owes['혼자']).toBe(15000));
  test('송금 없음', () => expect(t.length).toBe(0));
});

suite('TC6: 결제자 미지정 항목', () => {
  setup(['A','B'], [{ name:'식사', amount:20000, payer:'' }]);
  const { paid, owes } = shares();

  test('결제자 없으면 paid 합계 = 0', () => {
    expect(Object.values(paid).reduce((s,v)=>s+v,0)).toBe(0);
  });
  test('분담액 합 = 총액 (나머지 포함)', () => {
    expect(Object.values(owes).reduce((s,v)=>s+v,0)).toBe(20000);
  });
  test('송금 없음 (받을 사람이 없으므로)', () => expect(txns().length).toBe(0));
});

suite('TC7: rounderOverride 나머지 지정', () => {
  setup(['A','B','C'], [{ name:'택시', amount:10000, payer:'A', rounderOverride:'B' }]);
  const { owes } = shares();

  test('B가 나머지 흡수 → owes[B] = 3,334', () => {
    expect(owes['B']).toBe(3334);
    expect(owes['A']).toBe(3333);
    expect(owes['C']).toBe(3333);
  });
  test('총 분담액 합 = 10,000', () => {
    expect(Object.values(owes).reduce((s,v)=>s+v,0)).toBe(10000);
  });
  test('수지 균형', () => assertBalanced());
});

suite('TC8: 4인 복합 정산', () => {
  setup(['A','B','C','D'], [
    { name:'숙박',  amount:200000, payer:'A' },
    { name:'저녁1', amount:80000,  payer:'B' },
    { name:'저녁2', amount:60000,  payer:'C' },
    { name:'교통',  amount:40000,  payer:'D' },
  ]);
  const { paid, owes } = shares();

  test('총 지출 = 380,000', () => {
    expect(Object.values(paid).reduce((s,v)=>s+v,0)).toBe(380000);
  });
  test('인당 분담 합 = 총 지출', () => {
    expect(Object.values(owes).reduce((s,v)=>s+v,0))
      .toBe(Object.values(paid).reduce((s,v)=>s+v,0));
  });
  test('모든 순액(paid-owes) 합 ≈ 0', () => {
    const net = Object.keys(paid).reduce((s,p)=>s+(paid[p]-owes[p]),0);
    if (Math.abs(net) > 1) throw new Error(`순액 합 ${net} ≠ 0`);
  });
  test('수지 균형', () => assertBalanced());
});

// v5.05 회귀 — 환불(음수 지출) 시 반대 방향 송금
suite('TC9: 환불(음수 지출) 정산 [v5.05 회귀]', () => {
  test('A가 -20,000 환불 → A→B 10,000', () => {
    setup(['A','B'], [{ name:'환불', amount:-20000, payer:'A' }]);
    const t = txns();
    expect(t.length).toBe(1);
    expect(t[0].from).toBe('A');
    expect(t[0].to).toBe('B');
    expect(t[0].amt).toBe(10000);
    return txnStr(t);
  });
  test('지출 후 환불 상계 — 30,000 후 -10,000 → B→A 10,000', () => {
    setup(['A','B'], [
      { name:'식사', amount:30000,  payer:'A' },
      { name:'환불', amount:-10000, payer:'A' },
    ]);
    const t = txns();
    expect(t.length).toBe(1);
    expect(t[0].from).toBe('B');
    expect(t[0].to).toBe('A');
    expect(t[0].amt).toBe(10000);
    return txnStr(t);
  });
  test('환불이 더 큼 — 10,000 후 -30,000 → A→B 10,000', () => {
    setup(['A','B'], [
      { name:'식사', amount:10000,  payer:'A' },
      { name:'환불', amount:-30000, payer:'A' },
    ]);
    const t = txns();
    expect(t.length).toBe(1);
    expect(t[0].from).toBe('A');
    expect(t[0].to).toBe('B');
    expect(t[0].amt).toBe(10000);
    return txnStr(t);
  });
  test('3인 환불 — 수지 균형', () => {
    setup(['A','B','C'], [
      { name:'저녁', amount:30000, payer:'A' },
      { name:'환불', amount:-9000, payer:'B' },
    ]);
    assertBalanced();
    return txnStr(txns());
  });
});

// 한턱(isTreat)은 정산에서 제외된다
suite('TC10: 한턱(isTreat) 제외', () => {
  setup(['A','B'], [
    { name:'식사', amount:20000, payer:'A' },
    { name:'한턱', amount:50000, payer:'A', isTreat:true },
  ]);
  const { paid, owes } = shares();
  const t = txns();

  test('한턱 금액은 paid에 포함되지 않음', () => expect(paid['A']).toBe(20000));
  test('한턱 금액은 분담에 포함되지 않음', () => {
    expect(owes['A']).toBe(10000);
    expect(owes['B']).toBe(10000);
  });
  test('송금은 식사분만 — B→A 10,000', () => {
    expect(t.length).toBe(1);
    expect(t[0].amt).toBe(10000);
    return txnStr(t);
  });
});

// v5.06 회귀 — 영수증 상세표 합계 행
suite('TC11: 영수증 상세표 합계 표시 [v5.06 회귀]', () => {
  const foot = (rt) => {
    const d = document.createElement('div');
    d.innerHTML = APP._receiptTableHtml({ receiptText: rt }, 'test');
    const tf = d.querySelector('tfoot');
    if (!tf) return null;
    const tds = tf.querySelectorAll('td');
    const last = tds[tds.length - 1];
    return { val: last.textContent.trim(), neg: last.classList.contains('rc-neg') };
  };

  test('음수 합계도 표시되고 빨강 처리', () => {
    const f = foot('상품 환불 | 1 | -20000 | -20000');
    if (!f) throw new Error('합계 행 없음');
    expect(f.val).toBe('-20,000');
    if (!f.neg) throw new Error('rc-neg 클래스 없음');
  });
  test('합계 0(상계)도 표시', () => {
    const f = foot('상품 | 1 | 20000 | 20000\n환불 | 1 | -20000 | -20000');
    if (!f) throw new Error('합계 행 없음');
    expect(f.val).toBe('0');
  });
  test('양수 합계 (회귀)', () => {
    const f = foot('상품 | 1 | 20000 | 20000');
    if (!f) throw new Error('합계 행 없음');
    expect(f.val).toBe('20,000');
    if (f.neg) throw new Error('양수인데 rc-neg 적용됨');
  });
  test('증정품은 합계에서 제외', () => {
    const f = foot('상품 | 1 | 10000 | 10000\n사은품 | 1 | 0 | 증정');
    if (!f) throw new Error('합계 행 없음');
    expect(f.val).toBe('10,000');
  });
});

suite('TC12: 정산 공유 수취인 순서 [v5.24 회귀]', () => {
  const rows=[
    {from:'김영석',to:'이종현',amt:18000},
    {from:'이정환',to:'조상현',amt:271860},
    {from:'지유정',to:'이종현',amt:18000},
    {from:'박정호',to:'조상현',amt:271860}
  ];

  test('내가 받을 송금은 원본 순서와 무관하게 첫 그룹', () => {
    const groups=APP._groupTxnsByRecipient(rows,'조상현');
    expect(groups.map(g=>g.to)).toEqual(['조상현','이종현']);
    expect(groups[0].isOwner).toBe(true);
  });

  test('각 수취인 그룹 안의 송금 순서는 보존', () => {
    const groups=APP._groupTxnsByRecipient(rows,'조상현');
    expect(groups[0].txns.map(t=>t.from)).toEqual(['이정환','박정호']);
    expect(groups[1].txns.map(t=>t.from)).toEqual(['김영석','지유정']);
  });

  test('내 수취 내역이 없어도 다른 수취인 순서는 보존', () => {
    const groups=APP._groupTxnsByRecipient(rows,'신유철');
    expect(groups.map(g=>g.to)).toEqual(['이종현','조상현']);
    expect(groups.every(g=>!g.isOwner)).toBe(true);
  });
});

suite('TC13: 사용자 카테고리 SVG [v5.25 회귀]', () => {
  const keys=['food','cafe','beer','cake','mic','car','shop','movie','bed','golf','spa','dumbbell','plane','event','medical','receipt'];

  test('16개 카테고리 아이콘을 모두 불러옴', () => {
    const icons=keys.map(iconOverride=>APP.getIconSvg({name:'',iconOverride}));
    expect(icons.length).toBe(16);
    expect(new Set(icons).size).toBe(16);
    if(icons.some(svg=>!svg.startsWith('<svg')||!svg.includes('currentColor')))throw new Error('SVG 또는 테마 색상 연결 누락');
  });

  test('경조·의료·문화 자동분류가 새 SVG를 사용', () => {
    expect(APP.getIconSvg('결혼식 축의금')).toBe(APP.getIconSvg({name:'',iconOverride:'event'}));
    expect(APP.getIconSvg('병원 진료비')).toBe(APP.getIconSvg({name:'',iconOverride:'medical'}));
    expect(APP.getIconSvg('문화 공연')).toBe(APP.getIconSvg({name:'',iconOverride:'movie'}));
  });

  // 함수 원문(toString)을 검사하면 category-grid.js가 showIconPicker를 감쌌을 때
  // 원문을 볼 수 없어 실제로는 정상인데도 실패한다. 실제로 그려진 목록을 검사한다.
  test('아이콘 선택 목록에 16개 카테고리가 모두 노출', () => {
    const doc=APP.document;
    doc.querySelectorAll('.icon-pop').forEach(e=>e.remove());
    APP.__test.set(['A','B'],[{id:1,name:'t',amount:1000,payer:'A',members:[],watchers:[],isTreat:false}]);
    APP.showIconPicker(1, doc.body, null);
    const pop=doc.querySelector('.icon-pop');
    if(!pop) throw new Error('선택창이 열리지 않음');
    const labels=[...pop.querySelectorAll('.icon-opt')]
      .map(e=>((e.querySelector('.icon-opt-lbl')||e).textContent||'').trim());
    doc.querySelectorAll('.icon-pop').forEach(e=>e.remove());
    const expected=['자동','외식','카페','술집','노래방','쇼핑','문화','교통','여행',
                    '숙박','골프','스파','운동','기념일','경조','의료','기타'];
    const missing=expected.filter(x=>!labels.includes(x));
    if(missing.length) throw new Error('누락: '+missing.join(', ')+' / 실제: '+labels.join(','));
    expect(labels.length).toBe(17);   // 자동 + 카테고리 16
    return labels.join(' · ');
  });
});

}

// ── 렌더링 ────────────────────────────────────────────────────────────────

function render() {
  let pass = 0, fail = 0, total = 0;
  const html = suites.map(s => {
    const rows = s.tests.map(t => {
      total++;
      if (t.status === 'pass') pass++;
      else if (t.status === 'fail') fail++;
      const badge = `<div class="badge ${t.status}"></div>`;
      const err = t.error ? `<div class="error">✗ ${t.error}</div>` : '';
      const detail = t.detail ? `<div class="test-detail">${t.detail}</div>` : '';
      return `<div class="test">${badge}<div class="test-name">${t.name}${detail}${err}</div></div>`;
    }).join('');
    return `<div class="suite"><div class="suite-title">${s.name}</div>${rows}</div>`;
  }).join('');

  document.getElementById('results').innerHTML = html;
  document.getElementById('summary').innerHTML = `
<div class="summary">
  <div class="sum-item"><div class="sum-num pass-num">${pass}</div><div class="sum-label">통과</div></div>
  <div class="sum-item"><div class="sum-num fail-num">${fail}</div><div class="sum-label">실패</div></div>
  <div class="sum-item"><div class="sum-num">${total}</div><div class="sum-label">전체</div></div>
</div>`;
}

// ── 부팅 ──────────────────────────────────────────────────────────────────
// 앱을 iframe으로 띄우고, 저장 경로를 막은 뒤 실제 함수로 테스트한다.
// test.html과 index.html은 같은 오리진이라 localStorage를 공유하므로
// 실행 전후로 스냅샷·복원해 실제 정산 데이터를 보호한다.

(function boot() {
  const snapshot = {};
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      snapshot[k] = localStorage.getItem(k);
    }
  } catch(e) {}

  const frame = document.getElementById('appFrame');
  frame.addEventListener('load', () => {
    try {
      APP = frame.contentWindow;

      // people·items는 let 선언이라 바깥에서 대입할 수 없다.
      // iframe의 전역 스코프에서 실행되는 스크립트를 주입해 그 안에서 대입·무력화한다.
      const doc = APP.document;
      const helper = doc.createElement('script');
      helper.textContent = `
        window.__test = {
          set: function(p, i){ people = p; items = i; },
          // APP_VERSION은 최상위 const라 window 속성이 아니다. 이 스코프에서 읽어 넘긴다.
          ver: function(){ try { return APP_VERSION; } catch(e) { return null; } },
          stub: function(){
            try{ saveState = function(){}; }catch(e){}
            try{ syncCurrentToGroup = function(){}; }catch(e){}
            try{ saveHistory = function(){}; }catch(e){}
            try{ syncToDropbox = function(){ return Promise.resolve(); }; }catch(e){}
            try{ renderAll = function(){}; }catch(e){}
          }
        };`;
      doc.body.appendChild(helper);

      if (!APP.__test) {
        throw new Error('헬퍼 주입 실패 — index.html과 같은 오리진에서 열어주세요 (file:// 불가, http(s)로 접속)');
      }
      APP.__test.stub();   // 저장·동기화 무력화 (실제 데이터 보호)

      if (typeof APP.computeShares !== 'function' || typeof APP.calcTxns !== 'function') {
        throw new Error('앱 함수를 찾을 수 없습니다 (computeShares / calcTxns)');
      }

      defineTests();
    } catch(e) {
      const hint = /cross-origin|Blocked a frame/i.test(e.message)
        ? ' — file://로 열면 오리진이 달라 접근이 막힙니다. 로컬에서는 간단한 http 서버로 띄워주세요.'
        : '';
      suites.push({ name: '부팅 실패', tests: [{ name: e.message + hint, status: 'fail', detail: '', error: e.stack || '' }] });
    } finally {
      // localStorage 원복
      try {
        localStorage.clear();
        Object.keys(snapshot).forEach(k => localStorage.setItem(k, snapshot[k]));
      } catch(e) {}
      render();
    }
  });
})();
</script>
