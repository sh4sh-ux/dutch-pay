function _pmHistResultsHtml(){
  const name=_pmHistSearch.trim();
  if(!name){
    const allRecs=loadHistory().sort((a,b)=>(b.dateStart||b.savedAt||'').localeCompare(a.dateStart||a.savedAt||''));
    if(!allRecs.length)return '<div class="empty" style="padding:40px 0"><p style="color:var(--label3)">저장된 정산 기록이 없어요</p></div>';
    const viewToggle=`<div class="pm-view-toggle"><button class="pm-view-btn${_pmViewMode==='list'?' on':''}" onclick="_pmSetViewMode('list')">목록</button><button class="pm-view-btn${_pmViewMode==='monthly'?' on':''}" onclick="_pmSetViewMode('monthly')">월별 통계</button></div>`;
    if(_pmViewMode==='monthly')return viewToggle+_pmMonthlyHtml(allRecs);
    const recsHtml=allRecs.map(rec=>{
      const dateStr=rec.dateStart?rec.dateStart.slice(2).replace(/-/g,'. ')+'.':rec.savedAt?rec.savedAt.slice(0,10):'';
      const txnsList=_myName?(rec.txns||[]).filter(t=>t.to===_myName):(rec.txns||[]);
      const pmObj=rec.payments||{};
      const doneCount=txnsList.filter(t=>!!(pmObj[`${t.from}|${t.to}`]||{}).done).length;
      const totalCount=txnsList.length;
      const statusHtml=totalCount===0?''
        :doneCount===totalCount?`<span class="pm-badge done">✓ 완료</span>`
        :doneCount===0?`<span class="pm-badge pending">${totalCount}명 미입금</span>`
        :`<span class="pm-badge pending">${totalCount-doneCount}명 미입금</span>`;
      const rid=ea(rec.id);
      return `<div class="pm-allrec-card" data-rec-id="${rid}" onclick="toggleAllRecCard('${rid}')"><div class="pm-allrec-left"><div class="pm-record-date">${e(dateStr)}</div><div class="pm-record-group">${e((rec.people||[]).join(', ')||rec.groupName||'')}</div></div><div class="pm-allrec-right"><div class="pm-record-total">${fmt(rec.total||0)}원</div>${statusHtml}<span class="pm-allrec-chev">▼</span></div></div>`;
    }).join('');
    return viewToggle+`<div class="pay-section-title" style="margin-top:8px">전체 기록 · ${allRecs.length}건</div>`+recsHtml;
  }
  let allRec=[];try{const raw=localStorage.getItem(HISTORY_KEY);allRec=raw?JSON.parse(raw):[];}catch(ex){}
  const _txnCards=[];const _billedRecIds=new Set();
  allRec.forEach(rec=>{
    (rec.txns||[]).filter(t=>t.from===name).forEach(t=>{
      const key=`${t.from}|${t.to}`;
      const pm=(rec.payments||{})[key]||{};
      const billing=t.amt;
      const _va1=pm.amount!=null&&pm.amount!==''&&!isNaN(+pm.amount);const received=pm.done?(_va1?+pm.amount:billing):0;
      const diff=pm.done?received-billing:null;
      const isOwnerTxn=!_myName||t.to===_myName;
      _txnCards.push({rec,key,billing,received,diff,pm,done:!!pm.done,isOwnerTxn});
      _billedRecIds.add(rec.id);
    });
  });
  const _participantCards=[];
  allRec.forEach(rec=>{
    if(_billedRecIds.has(rec.id))return;
    if(!(rec.people||[]).includes(name))return;
    const treatItems=(rec.items||[]).filter(it=>it.payer===name&&it.isTreat);
    const treatAmt=treatItems.reduce((s,it)=>s+(+it.amount||0),0);
    _participantCards.push({rec,key:'__attend__',billing:0,received:0,diff:null,pm:{},done:false,isOwnerTxn:false,isParticipant:true,isTreat:treatAmt>0,treatAmt});
  });
  let summaryHtml='';
  let cards=_pmHistFilter==='unpaid'?_txnCards.filter(c=>!c.done):[..._txnCards,..._participantCards];
  if(_pmHistSort==='newest')cards.sort((a,b)=>(b.rec.dateStart||b.rec.savedAt).localeCompare(a.rec.dateStart||a.rec.savedAt));
  else if(_pmHistSort==='oldest')cards.sort((a,b)=>(a.rec.dateStart||a.rec.savedAt).localeCompare(b.rec.dateStart||b.rec.savedAt));
  else if(_pmHistSort==='amtDesc')cards.sort((a,b)=>b.billing-a.billing);
  else if(_pmHistSort==='amtAsc')cards.sort((a,b)=>a.billing-b.billing);
  // 기간 옵션: 데이터에 있는 년도·월 동적 생성
  const _periodSet=new Set();
  cards.forEach(c=>{const ds=c.rec.dateStart||c.rec.savedAt||'';if(ds.length>=4)_periodSet.add(ds.slice(0,4));if(ds.length>=7)_periodSet.add(ds.slice(0,7));});
  const _pYears=[..._periodSet].filter(p=>p.length===4).sort().reverse();
  const _pMonths=[..._periodSet].filter(p=>p.length===7).sort().reverse();
  const periodOptsHtml=`<option value="all"${_pmHistGroup==='all'?' selected':''}>전체 기간</option>`
    +(_pYears.length?'<option disabled>── 년도</option>':'')+_pYears.map(y=>`<option value="${y}"${_pmHistGroup===y?' selected':''}>${y}년</option>`).join('')
    +(_pMonths.length?'<option disabled>── 월별</option>':'')+_pMonths.map(m=>{const[y,mo]=m.split('-');return `<option value="${m}"${_pmHistGroup===m?' selected':''}>${y}년 ${+mo}월</option>`;}).join('');
  const controlsHtml=`<div class="pm-controls"><div class="pm-controls-top"><select class="pm-sort-sel" onchange="_pmSetSort(this.value)"><option value="newest"${_pmHistSort==='newest'?' selected':''}>최신순</option><option value="oldest"${_pmHistSort==='oldest'?' selected':''}>오래된순</option><option value="amtDesc"${_pmHistSort==='amtDesc'?' selected':''}>금액 높은순</option><option value="amtAsc"${_pmHistSort==='amtAsc'?' selected':''}>금액 낮은순</option></select><select class="pm-sort-sel" onchange="_pmSetGroup(this.value)">${periodOptsHtml}</select><div class="pm-filter-chips" style="margin-left:auto"><button class="pm-filter-chip${_pmHistFilter==='all'?' on':''}" onclick="_pmSetFilter('all')">전체</button><button class="pm-filter-chip${_pmHistFilter==='unpaid'?' on':''}" onclick="_pmSetFilter('unpaid')">미수</button></div></div></div>`;
  // 기간 필터 적용
  const displayCards=_pmHistGroup==='all'?cards:cards.filter(c=>(c.rec.dateStart||c.rec.savedAt||'').startsWith(_pmHistGroup));
  const _pLbl=_pmHistGroup==='all'?'총':_pmHistGroup.length===7?(()=>{const[y,mo]=_pmHistGroup.split('-');return `${+mo}월`;})():_pmHistGroup+'년';
  const meetingCount=new Set(displayCards.map(c=>c.rec.id)).size;
  const meetingCountHtml=meetingCount?`<span class="pm-meeting-count">${meetingCount}회</span>`:'';
  const isOwnerSearch=!!(_myName&&name===_myName);
  if(isOwnerSearch){
    const _recSet=new Set(displayCards.map(c=>c.rec.id));
    let ownerBilled=0,ownerReceived=0,ownerSpend=0,ownerTreat=0;
    allRec.filter(r=>_recSet.has(r.id)).forEach(rec=>{
      (rec.txns||[]).filter(t=>t.to===name).forEach(t=>{
        ownerBilled+=t.amt;
        const pm=(rec.payments||{})[`${t.from}|${t.to}`]||{};
        const va=pm.amount!=null&&pm.amount!==''&&!isNaN(+pm.amount);
        ownerReceived+=pm.done?(va?+pm.amount:t.amt):0;
      });
      (rec.items||[]).forEach(it=>{if(it.payer===name){ownerSpend+=(+it.amount||0);if(it.isTreat)ownerTreat+=(+it.amount||0);}});
    });
    const ownerNet=ownerReceived-ownerBilled;
    const ownerUnpaid=ownerBilled-ownerReceived;
    const ownerNetBadge=ownerBilled===0?'':ownerNet>0?`<span class="pm-net-badge pos">+${fmt(ownerNet)}원 초과</span>`:ownerNet<0?`<span class="pm-net-badge neg">-${fmt(-ownerNet)}원 미수</span>`:`<span class="pm-net-badge zero">✓ 완납</span>`;
    const ownerActual=ownerSpend-ownerBilled;
    const ownerSubStats=ownerSpend>0?`<div class="pm-month-my-stats" style="border-top:1px solid var(--sep);border-bottom:none;padding:10px 0 2px"><div class="pm-month-my-stat"><div class="pm-month-my-stat-lbl">결제</div><div class="pm-month-my-stat-val">${fmt(ownerSpend)}원</div></div><div class="pm-month-my-stat"><div class="pm-month-my-stat-lbl">내 몫</div><div class="pm-month-my-stat-val">${fmt(ownerActual)}원</div></div><div class="pm-month-my-stat"><div class="pm-month-my-stat-lbl">한턱</div><div class="pm-month-my-stat-val">${fmt(ownerTreat)}원</div></div></div>`:'';
    const ownerTreatBadge=ownerTreat>0?`<span class="pm-net-badge treat">한턱 ${fmt(ownerTreat)}원</span>`:'';
    summaryHtml=`<div class="pm-person-card"><div class="pm-person-name-row"><span class="pm-person-name">${e(name)}</span>${ownerNetBadge}${ownerTreatBadge}${meetingCountHtml}</div><div class="pm-person-stats"><div class="pm-pstat"><div class="pm-pstat-lbl">${_pLbl} 청구</div><div class="pm-pstat-val">${fmt(ownerBilled)}원</div></div><div class="pm-pstat"><div class="pm-pstat-lbl">${_pLbl} 수령</div><div class="pm-pstat-val${ownerReceived>0?' pos':''}">${fmt(ownerReceived)}원</div></div><div class="pm-pstat"><div class="pm-pstat-lbl">미수</div><div class="pm-pstat-val${ownerUnpaid>0?' neg':''}">${ownerUnpaid>0?'-'+fmt(ownerUnpaid)+'원':'없음'}</div></div></div>${ownerSubStats}</div>`;
  }else{
    const _dTxnCards=displayCards.filter(c=>!c.isParticipant&&c.isOwnerTxn);
    const totalBilled=_dTxnCards.reduce((s,c)=>s+c.billing,0);
    const totalReceived=_dTxnCards.filter(c=>c.done).reduce((s,c)=>s+c.received,0);
    const totalUnpaid=totalBilled-totalReceived;
    const net=totalReceived-totalBilled;
    const netBadge=totalBilled===0?'':net>0?`<span class="pm-net-badge pos">+${fmt(net)}원 초과</span>`:net<0?`<span class="pm-net-badge neg">-${fmt(-net)}원 미수</span>`:`<span class="pm-net-badge zero">✓ 완납</span>`;
    const _sumTreatAmt=displayCards.reduce((s,c)=>{if(c.isParticipant)return s;return s+(c.rec.items||[]).filter(it=>it.payer===name&&it.isTreat).reduce((a,it)=>a+(+it.amount||0),0);},0);
    const treatBadge=_sumTreatAmt>0?`<span class="pm-net-badge treat">한턱 ${fmt(_sumTreatAmt)}원</span>`:'';
    summaryHtml=`<div class="pm-person-card"><div class="pm-person-name-row"><span class="pm-person-name">${e(name)}</span>${netBadge}${treatBadge}${meetingCountHtml}</div><div class="pm-person-stats"><div class="pm-pstat"><div class="pm-pstat-lbl">${_pLbl} 청구</div><div class="pm-pstat-val">${fmt(totalBilled)}원</div></div><div class="pm-pstat"><div class="pm-pstat-lbl">${_pLbl} 수령</div><div class="pm-pstat-val${totalReceived>0?' pos':''}">${fmt(totalReceived)}원</div></div><div class="pm-pstat"><div class="pm-pstat-lbl">미수</div><div class="pm-pstat-val${totalUnpaid>0?' neg':''}">${totalUnpaid>0?'-'+fmt(totalUnpaid)+'원':'없음'}</div></div></div></div>`;
  }
  if(!displayCards.length)return summaryHtml+controlsHtml+'<div class="empty" style="padding:30px 0"><p style="color:var(--label3)">해당하는 기록이 없어요</p></div>';
  const _renderCard=c=>{
    const dateStr=c.rec.dateStart?c.rec.dateStart.slice(2).replace(/-/g,'. ')+'.':c.rec.savedAt.slice(0,10);
    const members=(c.rec.people||[]).join(' · ');
    let statusHtml,amtHtml;
    if(c.isParticipant){
      statusHtml=c.isTreat?`<span class="pm-badge treat">한턱 ${fmt(c.treatAmt)}원</span>`:`<span class="pm-badge attend">참석</span>`;
      amtHtml='';
    }else{
      statusHtml=c.done?(c.diff>0?`<span class="pm-badge pos">+${fmt(c.diff)}원 초과</span>`:c.diff<0?`<span class="pm-badge neg">-${fmt(-c.diff)}원 부족</span>`:`<span class="pm-badge done">${c.isOwnerTxn?'✓ 입금완료':'✓ 송금완료'}</span>`):`<span class="pm-badge pending">${c.isOwnerTxn?'미입금':'미확인'}</span>`;
      amtHtml=`<div class="pm-record-total">${fmt(c.billing)}원</div>`;
    }
    const personTreatAmt=(!c.isParticipant)?(c.rec.items||[]).filter(it=>it.payer===name&&it.isTreat).reduce((s,it)=>s+(+it.amount||0),0):0;
    const treatLineHtml=personTreatAmt>0?`<span class="pm-net-badge treat">한턱 ${fmt(personTreatAmt)}원</span>`:'';
    const recValCls=c.done?(c.diff<0?' neg':' done-clr'):'';
    const rid=ea(c.rec.id||'');const rkey=ea(c.key||'__attend__');
    const recItems=(c.rec.items||[]).filter(it=>+it.amount!==0);
    const itemsHtml=recItems.length?`<div class="pm-rec-items"><div class="pm-rec-items-title">지출 내역</div>${recItems.map(it=>{const uid='rcpt_'+(c.rec.id||'')+'_'+(it.id||'');const _mems=(it.members&&it.members.length)?it.members:(c.rec.people||[]);const _ws=(it.watchers||[]).filter(w=>!_mems.includes(w));const memsStr=it.isTreat?[..._mems,..._ws].map(m=>e(m)).join(', '):[..._mems.map(m=>e(m)),..._ws.map(w=>`${e(w)}(깍두기)`)].join(', ');const rowClick=it.receiptText?` onclick="toggleItemReceipt('${uid}',event)" style="cursor:pointer"`:'';const chev=it.receiptText?`<span class="rc-chev" data-rcpt-chev="${uid}">▼</span>`:'';return `<div class="rc-item-row"${rowClick}><span class="pay-ic">${getIconSvg(it)}</span><div class="rc-item-info"><div class="rc-item-name-row"><span class="rc-item-name">${e(it.name||'(이름 없음)')}</span><span class="rc-payer-pill">${e(it.payer||'결제자 미정')} 결제</span>${it.isTreat?'<span class="treat-badge">🎉 한턱 쏨 🎉&nbsp;&nbsp;&nbsp;👏👏👏</span>':''}</div><div class="rc-item-meta">${memsStr}</div></div>${chev}<span class="rc-item-amt${+it.amount<0?' neg':''}">${fmt(+it.amount)}원</span></div>${_receiptTableHtml(it,uid)}`;}).join('')}</div>`:'';
    const bodyHtml=!c.isParticipant&&c.done?`<div class="pm-record-body"><div class="pm-record-row"><span class="pm-record-lbl">실수령액</span><span class="pm-record-val${recValCls}">${fmt(c.received)}원</span></div></div>`:'';
    const footHtml=!c.isParticipant&&(c.pm.account||c.pm.timestamp)?`<div class="pm-record-foot"><span class="pm-record-account">${e(c.pm.account||'')}</span><span class="pm-record-ts">${c.pm.timestamp?_dtpFmt(c.pm.timestamp):''}</span></div>`:'';
    const editBtnHtml=!c.isParticipant&&c.isOwnerTxn?`<div class="pm-rec-edit-row"><button class="pm-rec-edit-btn" onclick="event.stopPropagation();toggleHistRecordPanel('${rid}','${rkey}')">✏️ 수정</button></div>`:'';
    return `<div class="pm-record-card" data-rec-id="${rid}" data-txn-key="${rkey}"><div class="pm-record-hd" onclick="togglePmRecCard('${rid}','${rkey}')"><div class="pm-record-meta"><div class="pm-record-date">${e(dateStr)}</div><div class="pm-record-group">${e((c.rec.people||[]).join(', ')||c.rec.groupName||'')}</div><div class="pm-record-members">${e(members)}</div></div><div class="pm-record-right">${amtHtml}${statusHtml}${treatLineHtml}<span class="pm-record-chev">▼</span></div></div><div class="pm-rec-detail" style="display:none">${itemsHtml}${bodyHtml}${footHtml}${editBtnHtml}</div></div>`;
  };
  // 년도 선택 시 월별 그룹, 특정 월/전체 시 flat
  let cardsHtml='';
  if(_pmHistGroup.length===4){
    const grpMap={};
    displayCards.forEach(c=>{const k=(c.rec.dateStart||c.rec.savedAt||'').slice(0,7);if(!grpMap[k])grpMap[k]=[];grpMap[k].push(c);});
    cardsHtml=Object.keys(grpMap).sort().reverse().map(k=>{const grp=grpMap[k];const[y,mo]=k.split('-');const tot=grp.reduce((s,c)=>s+c.billing,0);return `<div class="pm-period-hd"><span class="pm-period-label">${y}년 ${+mo}월</span><span class="pm-period-meta">${grp.length}건 · ${fmt(tot)}원 청구</span></div>`+grp.map(_renderCard).join('');}).join('');
  }else{
    cardsHtml=displayCards.map(_renderCard).join('');
  }
  return summaryHtml+controlsHtml+`<div class="pay-section-title" style="margin-top:14px">정산 기록 · ${displayCards.length}건</div>`+cardsHtml;
}

function _pmMonthlyHtml(allRecs){
  const months={};
  allRecs.forEach(rec=>{
    const ym=(rec.dateStart||rec.savedAt||'').slice(0,7);
    if(!ym)return;
    if(!months[ym])months[ym]=[];
    months[ym].push(rec);
  });
  const keys=Object.keys(months).sort().reverse();
  if(!keys.length)return '<div class="empty" style="padding:30px 0"><p style="color:var(--label3)">기록이 없어요</p></div>';
  const cardsHtml=keys.map(ym=>{
    const recs=months[ym];
    const [y,mo]=ym.split('-');
    const label=`${y}년 ${+mo}월`;
    const count=recs.length;
    const totalSpend=recs.reduce((s,r)=>s+(+r.total||0),0);
    let totalBilled=0,totalReceived=0;
    const personStats={},personCount={},personTreat={},personPaid={};
    let mySpend=0,myTreat=0,mySettleCount=0,myBilled=0,myReceived=0;
    recs.forEach(rec=>{
      (rec.people||[]).forEach(p=>{personCount[p]=(personCount[p]||0)+1;});
      (_myName?(rec.txns||[]).filter(t=>t.to===_myName):(rec.txns||[])).forEach(t=>{
        totalBilled+=t.amt;
        const pm=(rec.payments||{})[`${t.from}|${t.to}`]||{};
        const va=pm.amount!=null&&pm.amount!==''&&!isNaN(+pm.amount);
        const recv=pm.done?(va?+pm.amount:t.amt):0;
        totalReceived+=recv;
        if(!personStats[t.from])personStats[t.from]={billed:0,received:0};
        personStats[t.from].billed+=t.amt;
        personStats[t.from].received+=recv;
        if(_myName&&t.to===_myName){myBilled+=t.amt;myReceived+=recv;}
      });
      (rec.items||[]).forEach(it=>{
        if(it.isTreat&&it.payer&&(!_myName||it.payer!==_myName)){
          personTreat[it.payer]=(personTreat[it.payer]||0)+(+it.amount||0);
        }
        if(it.payer&&(!_myName||it.payer!==_myName)){
          personPaid[it.payer]=(personPaid[it.payer]||0)+(+it.amount||0);
        }
      });
      if(_myName){
        (rec.items||[]).forEach(it=>{
          if(it.payer===_myName){
            mySpend+=(+it.amount||0);
            if(it.isTreat)myTreat+=(+it.amount||0);
          }
        });
        if((rec.people||[]).includes(_myName))mySettleCount++;
      }
    });
    const totalUnpaid=totalBilled-totalReceived;
    const net=totalReceived-totalBilled;
    const ymId=ym.replace('-','_');
    const isOpen=_pmMonthsOpen.has(ymId);
    const netInline=net!==0?`<span class="pm-month-net-inline ${net>0?'pos':'neg'}">${net>0?'+':'-'}${fmt(Math.abs(net))}원</span>`:'';
    const statsHtml=`<div class="pm-month-stats-row"><div class="pm-mstat"><div class="pm-mstat-lbl">청구</div><div class="pm-mstat-val">${fmt(totalBilled)}원</div></div><div class="pm-mstat"><div class="pm-mstat-lbl">수령${netInline}</div><div class="pm-mstat-val pos">${fmt(totalReceived)}원</div></div><div class="pm-mstat"><div class="pm-mstat-lbl">미수</div><div class="pm-mstat-val${totalUnpaid>0?' neg':''}">${totalUnpaid>0?fmt(totalUnpaid)+'원':'없음'}</div></div></div>`;
    const myNet=myReceived-myBilled;
    const myDelta=myNet>0?`<span class="pm-month-delta pos">+${fmt(myNet)}원</span>`:myNet<0?`<span class="pm-month-delta neg">-${fmt(-myNet)}원</span>`:'';
    const myStatus=myNet>0?`<span class="pm-month-status pos">초과</span>`:myNet<0?`<span class="pm-month-status neg">미수</span>`:`<span class="pm-month-status done">완납</span>`;
    const myActual=mySpend-myBilled;
    const mySubStats=(_myName&&mySpend>0)?`<div class="pm-month-my-stats"><div class="pm-month-my-stat pm-month-my-stat-tap" onclick="event.stopPropagation();_pmShowPayerItems('${ea(_myName)}','${ym}')"><div class="pm-month-my-stat-lbl">결제</div><div class="pm-month-my-stat-val">${fmt(mySpend)}원</div></div><div class="pm-month-my-stat"><div class="pm-month-my-stat-lbl">지출</div><div class="pm-month-my-stat-val">${fmt(myActual)}원</div></div><div class="pm-month-my-stat${myTreat>0?' pm-month-my-stat-tap':''}"${myTreat>0?` onclick="event.stopPropagation();_pmShowTreatItems('${ea(_myName)}','${ym}')"`:''}><div class="pm-month-my-stat-lbl">쏜 금액</div><div class="pm-month-my-stat-val${myTreat>0?' treat':''}">${fmt(myTreat)}원</div></div></div>`:'';
    const myRow=(_myName&&(mySpend>0||myBilled>0))?`<div class="pm-month-person-row pm-name-tap" style="border-bottom:${mySubStats?'none':'1px solid var(--sep)'}" onclick="_pmFilterByName('${ea(_myName)}')"><div class="pm-month-person-left"><span class="pm-month-person-name">${e(_myName)}</span><span class="pm-month-person-cnt">${mySettleCount}회</span></div><div class="pm-month-person-right">${myDelta}<span>청구 ${fmt(myBilled)}원</span>${myStatus}</div></div>${mySubStats}`:'';
    const _pplSort=(a,b)=>_pmMonthPeopleSort==='cnt'?(personCount[b[0]]||0)-(personCount[a[0]]||0):_pmMonthPeopleSort==='name'?a[0].localeCompare(b[0],'ko'):b[1].billed-a[1].billed;
    const peopleRows=Object.entries(personStats).sort(_pplSort).map(([nm,s])=>{
      const pnet=s.received-s.billed;
      const deltaHtml=pnet>0?`<span class="pm-month-delta pos">+${fmt(pnet)}원</span>`:pnet<0?`<span class="pm-month-delta neg">-${fmt(-pnet)}원</span>`:'';
      const statusHtml=pnet>0?`<span class="pm-month-status pos">초과</span>`:pnet<0?`<span class="pm-month-status neg">미수</span>`:`<span class="pm-month-status done">완납</span>`;
      const cnt=personCount[nm]||1;
      const paidAmt=personPaid[nm]||0;
      const paidBadge=paidAmt>0?`<span class="pm-month-person-paid" onclick="event.stopPropagation();_pmShowPayerItems('${ea(nm)}','${ym}')">결제 ${fmt(paidAmt)}원</span>`:'';
      return `<div class="pm-month-person-row pm-name-tap" onclick="_pmFilterByName('${ea(nm)}')"><div class="pm-month-person-left"><span class="pm-month-person-name">${e(nm)}</span><span class="pm-month-person-cnt">${cnt}회</span>${paidBadge}</div><div class="pm-month-person-right">${deltaHtml}<span>청구 ${fmt(s.billed)}원</span>${statusHtml}</div></div>`;
    }).join('');
    const _ptSort=(a,b)=>_pmMonthPeopleSort==='cnt'?(personCount[b]||0)-(personCount[a]||0):_pmMonthPeopleSort==='name'?a.localeCompare(b,'ko'):(personTreat[b]||0)-(personTreat[a]||0);
    const participantRows=Object.keys(personCount).filter(nm=>!personStats[nm]&&(!_myName||nm!==_myName)).sort(_ptSort).map(nm=>{
      const cnt=personCount[nm];
      const treatAmt=personTreat[nm]||0;
      const badge=treatAmt>0?`<span class="pm-month-status treat">한턱 ${fmt(treatAmt)}원</span>`:`<span class="pm-month-status attend">참석</span>`;
      const paidAmt2=personPaid[nm]||0;
      const paidBadge2=paidAmt2>0?`<span class="pm-month-person-paid" onclick="event.stopPropagation();_pmShowPayerItems('${ea(nm)}','${ym}')">결제 ${fmt(paidAmt2)}원</span>`:'';
      return `<div class="pm-month-person-row pm-name-tap" onclick="_pmFilterByName('${ea(nm)}')"><div class="pm-month-person-left"><span class="pm-month-person-name">${e(nm)}</span><span class="pm-month-person-cnt">${cnt}회</span>${paidBadge2}</div><div class="pm-month-person-right">${badge}</div></div>`;
    }).join('');
    const peopleSection=(myRow||peopleRows||participantRows)?`<div class="pm-month-people">${myRow}${peopleRows}${participantRows}</div>`:'';
    return `<div class="pm-month-card" id="pmc_${ymId}"><div class="pm-month-hd" onclick="togglePmMonth('${ymId}')"><div class="pm-month-hd-left"><span class="pm-month-label">${label}</span><span class="pm-month-count">${count}회 · ${fmt(totalSpend)}원</span></div><div class="pm-month-hd-right"><span class="pm-month-chev${isOpen?' open':''}">▼</span></div></div><div class="pm-month-detail" id="pmcd_${ymId}" style="display:${isOpen?'block':'none'}">${statsHtml}${peopleSection}</div></div>`;
  }).join('');
  const monthSortCtrl=`<div class="pm-month-sort-row"><span class="pm-month-sort-lbl">인원 정렬</span><button class="pm-month-sort-btn${_pmMonthPeopleSort==='amt'?' on':''}" onclick="_pmSetMonthPeopleSort('amt')">금액순</button><button class="pm-month-sort-btn${_pmMonthPeopleSort==='cnt'?' on':''}" onclick="_pmSetMonthPeopleSort('cnt')">만남순</button><button class="pm-month-sort-btn${_pmMonthPeopleSort==='name'?' on':''}" onclick="_pmSetMonthPeopleSort('name')">이름순</button></div>`;
  return `<div class="pay-section-title" style="margin-top:8px">월별 통계 · ${keys.length}개월</div>${monthSortCtrl}`+cardsHtml;
}

function toggleHistRecordPanel(recId,txnKey){
  const card=document.querySelector(`.pm-record-card[data-rec-id="${CSS.escape(recId)}"]`);
  if(!card)return;
  const existing=card.querySelector('.pm-hist-edit-panel');
  if(existing){existing.remove();const ch=card.querySelector('.pm-record-chev');if(ch)ch.classList.remove('open');_patchHistResults();return;}

  const pm=(rec.payments||{})[txnKey]||{};
  const baseAmt=(rec.txns||[]).find(t=>`${t.from}|${t.to}`===txnKey)?.amt||0;
  const diffVal=(pm.amount!=null&&pm.amount!=='')?(+pm.amount-baseAmt):null;
  const diffHtml=diffVal!==null?`<span class="pay-diff-badge ${diffVal>0?'pos':diffVal<0?'neg':'zero'}">${diffVal>0?'+':''}${fmt(diffVal)}원</span>`:'';
  const panel=document.createElement('div');panel.className='pm-hist-edit-panel';
  panel.innerHTML=`<div class="pay-panel-row"><span class="pay-panel-lbl">입금</span><div class="pay-toggle-track${pm.done?' on':''}" onclick="histPmToggleDone('${ea(recId)}','${ea(txnKey)}')"><div class="pay-toggle-thumb"></div></div><span class="pay-toggle-lbl${pm.done?' on':''}">${pm.done?'입금완료':'미입금'}</span></div><div class="pay-panel-row"><span class="pay-panel-lbl">실수령액</span><input class="pay-inp" type="text" inputmode="numeric" placeholder="${fmt(baseAmt)}" value="${pm.amount!=null&&pm.amount!==''?fmt(+pm.amount):''}" oninput="histPmUpdateAmt('${ea(recId)}','${ea(txnKey)}',this)"/><span class="pay-unit">원</span>${diffHtml}</div><div class="pay-panel-row"><span class="pay-panel-lbl">입금일시</span>${_dtpHtml(pm.timestamp||'','','pay-date-wrap')}<button class="pay-now-btn" onclick="_dtpRowConfirm(this,v=>histPmUpdate('${ea(recId)}','${ea(txnKey)}','timestamp',v))">확인</button><button class="pay-now-btn" onclick="histPmSetNow('${ea(recId)}','${ea(txnKey)}')">지금</button></div><div class="pay-panel-row"><span class="pay-panel-lbl">계좌</span>${_histAcctHtml(recId,txnKey,pm.account)}</div><div class="pay-panel-row"><span class="pay-panel-lbl">메모</span><input class="pay-inp" type="text" placeholder="메모" value="${ea(pm.memo||'')}" oninput="histPmUpdate('${ea(recId)}','${ea(txnKey)}','memo',this.value)"/></div><button class="pm-close-btn" onclick="toggleHistRecordPanel('${ea(recId)}','${ea(txnKey)}')">저장</button>`;
  card.appendChild(panel);
}
function histPmToggleDone(recId,txnKey){
  const allRec=loadHistory();const rec=allRec.find(r=>r.id===recId);if(!rec)return;
  if(!rec.payments)rec.payments={};if(!rec.payments[txnKey])rec.payments[txnKey]={};
  rec.payments[txnKey].done=!rec.payments[txnKey].done;
  saveHistory(allRec);_patchHistResults();
  if(rec.payments[txnKey].done)_checkAllPaidAutoSaveForRec(rec);
}
function histPmUpdate(recId,txnKey,field,val){
  const allRec=loadHistory();const rec=allRec.find(r=>r.id===recId);if(!rec)return;
  if(!rec.payments)rec.payments={};if(!rec.payments[txnKey])rec.payments[txnKey]={};
  rec.payments[txnKey][field]=val;saveHistory(allRec);_patchHistResults();
}
function histPmUpdateAmt(recId,txnKey,el){
  const raw=el.value.replace(/,/g,'');const num=raw===''?null:+raw;
  el.value=num!==null?fmt(num):'';
  const allRec=loadHistory();const rec=allRec.find(r=>r.id===recId);if(!rec)return;
  if(!rec.payments)rec.payments={};if(!rec.payments[txnKey])rec.payments[txnKey]={};
  rec.payments[txnKey].amount=num;saveHistory(allRec);
  const card=document.querySelector(`.pm-record-card[data-rec-id="${CSS.escape(recId)}"]`);if(!card)return;
  const baseAmt=(rec.txns||[]).find(t=>`${t.from}|${t.to}`===txnKey)?.amt||0;
  const diffVal=num!==null?(num-baseAmt):null;
  const panel=card.querySelector('.pm-hist-edit-panel');if(!panel)return;
  let badge=panel.querySelector('.pay-diff-badge');
  if(diffVal!==null){const cls=diffVal>0?'pos':diffVal<0?'neg':'zero';if(!badge){badge=document.createElement('span');badge.className=`pay-diff-badge ${cls}`;const row=panel.querySelectorAll('.pay-panel-row')[1];if(row)row.appendChild(badge);}badge.className=`pay-diff-badge ${cls}`;badge.textContent=`${diffVal>0?'+':''}${fmt(diffVal)}원`;}else if(badge){badge.remove();}
}
function histPmSetNow(recId,txnKey){
  const now=new Date();const pad=n=>String(n).padStart(2,'0');const local=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const allRec=loadHistory();const rec=allRec.find(r=>r.id===recId);if(!rec)return;
  if(!rec.payments)rec.payments={};if(!rec.payments[txnKey])rec.payments[txnKey]={};
  rec.payments[txnKey].timestamp=local;saveHistory(allRec);
  const card=document.querySelector(`.pm-record-card[data-rec-id="${CSS.escape(recId)}"]`);
  if(card){const inp=card.querySelector('.pm-hist-edit-panel input[type="datetime-local"]');if(inp){inp.value=local;_dtpSync(inp);}}
}

// ── 순수 계산 함수 ──────────────────────────────────────────────────────────
function computeShares(){
  const paid={},owes={},details={},owesFloat={};
  people.forEach(p=>{paid[p]=0;owes[p]=0;details[p]=[];owesFloat[p]=0;});
  const payerSet={};
  items.forEach(it=>{
    if(!it.amount||+it.amount===0)return;if(it.isTreat)return;
    const amt=+it.amount,mems=it.members.length?it.members:[...people],n=mems.length;
    if(it.payer&&people.includes(it.payer))paid[it.payer]=(paid[it.payer]||0)+amt;
    if(it.payer&&people.includes(it.payer))payerSet[it.payer]=true;
    const override=it.rounderOverride;
    if(override&&mems.includes(override)){
      const base=Math.floor(amt/n),rem=amt-base*n;
      mems.forEach(p=>{const share=p===override?base+rem:base;owesFloat[p]=(owesFloat[p]||0)+share;details[p].push({name:it.name||'(이름 없음)',payer:it.payer,share,extra:p===override&&rem>0});});
    }else{
      const exact=amt/n;
      mems.forEach(p=>{owesFloat[p]=(owesFloat[p]||0)+exact;details[p].push({name:it.name||'(이름 없음)',payer:it.payer,share:exact,extra:false});});
    }
  });
  const totalAmt=items.filter(it=>!it.isTreat).reduce((s,it)=>s+(+it.amount||0),0);
  let totalFloor=0;const fracParts=[];
  people.forEach(p=>{const f=owesFloat[p]||0;const fl=Math.floor(f);owes[p]=fl;totalFloor+=fl;fracParts.push({p,frac:f-fl});});
  let diff=Math.round(totalAmt-totalFloor);
  if(diff!==0){fracParts.sort((a,b)=>{const ap=payerSet[a.p]?1:0,bp=payerSet[b.p]?1:0;if(ap!==bp)return bp-ap;return b.frac-a.frac;});if(fracParts.length)owes[fracParts[0].p]+=diff;}
  return{paid,owes,details,hasRounding:diff!==0};
}

// calcTxns: 결제자별 채무 직접 정산 — 같은 (채무자, 채권자) 쌍끼리 상계
function calcTxns(paid,owes){
  const dm={};people.forEach(p=>{dm[p]={};});
  items.forEach(it=>{
    if(!it.amount||+it.amount===0||it.isTreat)return;
    if(!it.payer||!people.includes(it.payer))return;
    const mems=it.members.length?it.members:[...people],n=mems.length;
    const override=it.rounderOverride;
    if(override&&mems.includes(override)){
      const base=Math.floor(+it.amount/n),rem=+it.amount-base*n;
      mems.forEach(m=>{if(m!==it.payer&&people.includes(m)){const s=m===override?base+rem:base;dm[m][it.payer]=(dm[m][it.payer]||0)+s;}});
    }else{
      const s=+it.amount/n;
      mems.forEach(m=>{if(m!==it.payer&&people.includes(m))dm[m][it.payer]=(dm[m][it.payer]||0)+s;});
    }
  });
  // 두 사람 사이의 채무를 부호 있는 순액으로 상계한다.
  // 환불(음수 지출)이 섞이면 채무가 음수가 될 수 있는데, 이는 방향이 뒤집힌 것이므로
  // 음수면 반대 방향에 절댓값으로 넣는다. (이전에는 음수를 그냥 버려 송금이 누락됐다)
  people.forEach((a,i)=>people.slice(i+1).forEach(b=>{
    const net=(dm[a][b]||0)-(dm[b][a]||0);
    if(net>=0){dm[a][b]=net;dm[b][a]=0;}else{dm[a][b]=0;dm[b][a]=-net;}
  }));
  const txns=[];
  people.forEach(debtor=>people.forEach(creditor=>{
    const amt=Math.floor(dm[debtor][creditor]||0);
    if(amt>0)txns.push({from:debtor,to:creditor,amt});
  }));
  return txns;
}

function saveToHistory(){
  const total=items.reduce((s,it)=>s+(+it.amount||0),0);
  if(!total){toast('저장할 정산 내역이 없어요',{type:'error'});return;}
  const{paid,owes}=computeShares();
  const txns=calcTxns(paid,owes);
  const g=getCurrentGroup();
  const record={
    id:'h'+Date.now()+Math.floor(Math.random()*1000),
    savedAt:new Date().toISOString(),
    groupName:g?g.name:'',
    dateStart:settleDateStart,
    dateEnd:settleDateEnd,
    people:[...people],
    total,
    items:JSON.parse(JSON.stringify(items)),
    txns,
    payments:JSON.parse(JSON.stringify(payments)),
    coupleNames:_coupleNames.slice()
  };
  try{
    const raw=localStorage.getItem(HISTORY_KEY);
    const arr=raw?JSON.parse(raw):[];
    if(_loadedHistId){
      const editIdx=arr.findIndex(r=>r.id===_loadedHistId);
      if(editIdx>=0){
        arr[editIdx]={...arr[editIdx],...record,id:_loadedHistId};
      }else{
        arr.unshift(record);
      }
      localStorage.setItem(HISTORY_KEY,JSON.stringify(arr));
      _loadedHistId=null;
      toast('기록이 수정됐어요 ✓',{type:'success',action:()=>goToHistory(),actionLabel:'보기'});
    }else{
      const dupIdx=arr.findIndex(r=>_histFingerprint(r)===_histFingerprint(record));
      if(dupIdx>=0){
        arr[dupIdx]={...arr[dupIdx],people:record.people,items:record.items,total:record.total,payments:record.payments,txns:record.txns,savedAt:record.savedAt};
        localStorage.setItem(HISTORY_KEY,JSON.stringify(arr));
        toast('기록이 업데이트됐어요 ✓',{type:'success',action:()=>goToHistory(),actionLabel:'보기'});
      }else{
        const softIdx=arr.findIndex(r=>_histSoftFingerprint(r)===_histSoftFingerprint(record));
        if(softIdx>=0){
          arr[softIdx]={...arr[softIdx],people:record.people,items:record.items,total:record.total,payments:record.payments,txns:record.txns,savedAt:record.savedAt};
          localStorage.setItem(HISTORY_KEY,JSON.stringify(arr));
          toast('기록이 업데이트됐어요 ✓',{type:'success',action:()=>goToHistory(),actionLabel:'보기'});
        }else{
          arr.unshift(record);
          localStorage.setItem(HISTORY_KEY,JSON.stringify(arr));
          toast('기록 보관함에 저장됐어요 ✓',{type:'success',action:()=>goToHistory(),actionLabel:'보기'});
        }
      }
    }
    if(hDbxGetToken())hSyncDropbox(true);
  }catch(err){
    toast('저장에 실패했어요',{type:'error'});
  }
}

const DBX_H_LASTSYNC='dutchpay_dbx_lastsync';
// 기록 보관함 파일 — 경로는 dbxHistFile()이 DBX_DIR 기준으로 만든다
const svgArrowH='<svg width="13" height="13" viewBox="0 0 24 24"><line x1="2" y1="12" x2="14" y2="12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><path d="M13 6 L22 12 L13 18 Z" fill="currentColor"/></svg>';

function loadHistory(){try{const r=localStorage.getItem(HISTORY_KEY);return r?JSON.parse(r):[];}catch(e){return [];}}
function _loadDelIds(){try{return new Set(JSON.parse(localStorage.getItem(HISTORY_DEL_KEY)||'[]'));}catch(e){return new Set();}}
function _saveDelId(id){try{const s=_loadDelIds();s.add(id);localStorage.setItem(HISTORY_DEL_KEY,JSON.stringify([...s]));}catch(e){}}
function _mergeDelIds(remoteIds){try{const s=_loadDelIds();(remoteIds||[]).forEach(id=>s.add(id));localStorage.setItem(HISTORY_DEL_KEY,JSON.stringify([...s]));return s;}catch(e){return _loadDelIds();}}
function _histFingerprint(r){return[r.dateStart||'',r.dateEnd||'',(r.people||[]).slice().sort().join('|'),(r.items||[]).map(i=>`${i.name||''}|${+i.amount||0}|${i.payer||''}|${i.isTreat?1:0}`).sort().join(',')].join('§');}
function _histSoftFingerprint(r){return[r.dateStart||'',r.dateEnd||'',(r.people||[]).slice().sort().join('|')].join('§');}
function _dedupHistory(arr){const map=new Map();arr.forEach(r=>{const fp=_histFingerprint(r);const ex=map.get(fp);if(!ex){map.set(fp,r);}else{const isNewer=(r.savedAt||'')>(ex.savedAt||'');const winner=isNewer?r:ex,loser=isNewer?ex:r;map.set(fp,{...winner,payments:{...(loser.payments||{}),...(winner.payments||{})}});}});return Array.from(map.values());}
function saveHistory(arr){try{const deduped=_dedupHistory(arr);const removed=arr.length-deduped.length;localStorage.setItem(HISTORY_KEY,JSON.stringify(deduped));if(removed>0)setTimeout(()=>toast(`중복 기록 ${removed}건 자동 삭제됐어요`,{type:'info'}),50);}catch(e){toast('저장 공간이 부족해 기록을 저장하지 못했어요',{type:'error'});}}
function _deduplicateHistoryOnStartup(){try{const arr=loadHistory();if(arr.length<2)return;const deduped=_dedupHistory(arr);const removed=arr.length-deduped.length;if(removed>0){localStorage.setItem(HISTORY_KEY,JSON.stringify(deduped));setTimeout(()=>toast(`중복 기록 ${removed}건 자동 삭제됐어요`,{type:'info'}),400);}}catch(e){}}
function _migrateHistoryGroupNames(){try{const arr=loadHistory();let changed=false;arr.forEach(r=>{const correct=(r.people||[]).join(', ');if(correct&&r.groupName!==correct){r.groupName=correct;changed=true;}});if(changed)saveHistory(arr);}catch(e){}}

function deleteHistoryRecord(id){
  if(!confirm('이 기록을 삭제할까요?'))return;
  _saveDelId(id);

  if(_histDrawerOpen){_refreshHistDrList();return;}

}

function toggleRcTxnPanel(recId,txnKey){
  const row=document.querySelector(`.rc-txn-row[data-rec-id="${CSS.escape(recId)}"][data-txn-key="${CSS.escape(txnKey)}"]`);
  if(!row)return;
  const next=row.nextElementSibling;
  if(next&&next.classList.contains('rc-txn-edit-panel')){next.remove();return;}
  document.querySelectorAll('.rc-txn-edit-panel').forEach(p=>p.remove());
  const allRec=loadHistory();const rec=allRec.find(r=>r.id===recId);if(!rec)return;
  const pm=(rec.payments||{})[txnKey]||{};
  const txn=(rec.txns||[]).find(t=>`${t.from}|${t.to}`===txnKey);
  const _rcPendingLbl=(txnKey.split('|')[1]||'')=== _myName?'미입금':'미확인';
  const baseAmt=txn?txn.amt:0;
  const diffVal=(pm.amount!=null&&pm.amount!=='')?(+pm.amount-baseAmt):null;

function rcTxnToggleDone(recId,txnKey){

function rcTxnUpdate(recId,txnKey,field,val){

function rcTxnUpdateAmt(recId,txnKey,el){

  const savedAtStr=(()=>{try{const d=new Date(r.savedAt);return d.toLocaleString('ko-KR',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e2){return '';}})();

        ${(()=>{if(!_histSettleMode||!_historySearch.trim())return'';const d=_personSettleDelta(r,_historySearch.trim());if(d===null)return'';if(d>0)return`<span class="rc-settle-badge pos">+${fmt(d)}원 초과</span>`;if(d<0)return`<span class="rc-settle-badge neg">-${fmt(-d)}원 부족</span>`;return`<span class="rc-settle-badge zero">완납</span>`;})()}

function _filterHistoryRecords(records,query){
  let recs=records;
  if(!_histMonthAllMode){const ym=`${_histMonthYear}-${String(_histMonthMonth).padStart(2,'0')}`;recs=recs.filter(r=>(r.dateStart||'').startsWith(ym)||(r.dateEnd||'').startsWith(ym));}
  if(!query.trim())return recs;
  const q=query.toLowerCase().trim();
  const fhd=d=>{if(!d)return'';const[y,m,day]=d.split('-');return`${y}년 ${+m}월 ${+day}일`;};
  return recs.filter(r=>{
    if((r.groupName||'').toLowerCase().includes(q))return true;
    if((r.people||[]).some(p=>p.toLowerCase().includes(q)))return true;
    if((r.items||[]).some(it=>(it.name||'').toLowerCase().includes(q)))return true;
    const dateDisplay=r.dateEnd&&r.dateEnd!==r.dateStart?`${fhd(r.dateStart)} ~ ${fhd(r.dateEnd)}`:fhd(r.dateStart);
    if(dateDisplay.includes(q))return true;
    return false;
  });
}

async function _hSha256b64url(str){const data=new TextEncoder().encode(str);const hash=await crypto.subtle.digest('SHA-256',data);return btoa(String.fromCharCode(...new Uint8Array(hash))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function _hRandomStr(len){const arr=new Uint8Array(len);crypto.getRandomValues(arr);return btoa(String.fromCharCode(...arr)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'').slice(0,len);}

function roundRectPath(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();}

const iconImgCache=new Map();
async function loadIconImage(svgStr,color){const key=svgStr+'|'+color;if(iconImgCache.has(key))return iconImgCache.get(key);const colored=svgStr.replace(/currentColor/g,color);const withNs=colored.includes('xmlns')?colored:colored.replace('<svg','<svg xmlns="http://www.w3.org/2000/svg"');const blob=new Blob([withNs],{type:'image/svg+xml;charset=utf-8'});const url=URL.createObjectURL(blob);try{const img=new Image();await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url;});iconImgCache.set(key,img);return img;}finally{setTimeout(()=>URL.revokeObjectURL(url),1000);}}

function formatShareDate(startDate,endDate){
  const fmtDate=(iso)=>{
    if(!iso)return '';
    return iso.replaceAll('-','.');
  };

  if(!startDate)return '';
  if(!endDate||startDate===endDate)return fmtDate(startDate);
  return `${fmtDate(startDate)} ~ ${fmtDate(endDate)}`;
}

function truncateCanvasText(ctx,text,maxWidth){
  const raw=String(text||'');
  if(maxWidth<=0)return '';
  if(ctx.measureText(raw).width<=maxWidth)return raw;
  const ellipsis='…';
  if(ctx.measureText(ellipsis).width>maxWidth)return '';
  let lo=0,hi=raw.length,best=ellipsis;
  while(lo<=hi){
    const mid=Math.floor((lo+hi)/2);
    const next=raw.slice(0,mid)+ellipsis;
    if(ctx.measureText(next).width<=maxWidth){best=next;lo=mid+1;}
    else hi=mid-1;
  }
  return best;
}

function _groupCoupleShareTxns(txns,coupleConfig){
  if(coupleConfig.length!==2)return{normalTxns:txns,coupleTxnRows:[]};
  const[ca,cb]=coupleConfig;
  let aIdx=-1,bIdx=-1;
  for(let i=0;i<txns.length&&aIdx<0;i++){
    if(txns[i].from!==ca)continue;
    const match=txns.findIndex((t,j)=>j!==i&&t.from===cb&&t.to===txns[i].to);
    if(match>=0){aIdx=i;bIdx=match;}
  }
  if(aIdx<0||bIdx<0)return{normalTxns:txns,coupleTxnRows:[]};
  const aTxn=txns[aIdx],bTxn=txns[bIdx];
  return{
    normalTxns:txns.filter((_,i)=>i!==aIdx&&i!==bIdx),
    coupleTxnRows:[{from:`${ca} · ${cb}`,to:aTxn.to,amt:aTxn.amt+bTxn.amt}]
  };
}

async function shareSettleImage(){
  if(_shareBusy)return;
  const total=items.reduce((s,it)=>s+(+it.amount||0),0);if(!total){toast('공유할 정산 내역이 없어요',{type:'error'});return;}
  const inApp=detectInAppBrowser();if(inApp){const ok=confirm(`${inApp.name} 내부 브라우저는 이미지 공유가 제한돼요.\n외부 브라우저에서 열어주세요.\n\n지금 외부 브라우저로 열까요?`);if(ok){openInExternalBrowser();return;}}

}

  const canvas=document.createElement('canvas');canvas.width=W*2;canvas.height=H*2;const ctx=canvas.getContext('2d');ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,W*2,H*2);ctx.scale(2,2);

  const drawDivider=y=>{ctx.strokeStyle=C.line;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cardX+34,y);ctx.lineTo(cardX+cardW-34,y);ctx.stroke();};

  const drawBadge=(text,x,y,bg,fg)=>{setFont(22,600);ctx.textBaseline='middle';ctx.textAlign='left';const tw=ctx.measureText(text).width;const ph=18,pv=8,bh=22+pv*2;const bw=tw+ph*2;ctx.fillStyle=bg;roundRectPath(ctx,x,y-bh/2,bw,bh,bh/2);ctx.fill();ctx.fillStyle=fg;ctx.fillText(text,x+ph,y);return bw+8;};
  let y=TOP_PAD;

      ctx.fillStyle='#F3F3F5';roundRectPath(ctx,afx,ry-22-pillH/2,pillW,pillH,pillH/2);ctx.fill();
      ctx.fillStyle='#666666';ctx.fillText(payerTxt,afx+ppx,ry-22);

      const memsStartX=nameX+ppx,maxMemsW=amtX-amtW-34-memsStartX;

      if(i<validItems.length-1)drawDivider(y+(i+1)*ITEM_ROW_H);
    });
  }
  y+=itemCardH+SECTION_GAP;
  // 입금 내역 (내 기준: 받은 돈)
  y=drawSectionLabel('입금 내역',y);
  drawCard(cardX,y,cardW,txnCardH);
  if(!txns.length){

    const _tPayer=_allTreat&&_tPayers.length===1?_tPayers[0]:'';
    if(_tPayer){const _lh=28;const _gap=(txnCardH-2*_lh)/3;const _y1=y+_gap+_lh/2;const _y2=y+_gap*2+_lh*1.5;ctx.fillStyle=C.muted;setFont(26,600);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('맛있게 먹고, 재밌게 놀았는데 결제의 감동까지…',W/2,_y1);ctx.fillText(`완벽했던 하루! 역시 ${_tPayer}, 클래스가 다르다! 😎 👍🏼👍🏼👍🏼`,W/2,_y2);}

    &&(window.scrollY||0)<=0&&!document.querySelector(BLOCK);
  const place=(d,rot)=>{ind.style.transform='translateY('+(d-48)+'px)';
    icon.style.transform='rotate('+rot+'deg)';ind.style.opacity=String(Math.min(1,d/TH*1.2));};
  const reset=()=>{dist=0;ind.classList.add('settle');ind.classList.remove('spin');
    ind.style.transform='translateY(-48px)';ind.style.opacity='0';icon.style.transform='';};

  addEventListener('touchstart',e=>{
    if(e.touches.length!==1||!ready())return;
    y0=e.touches[0].clientY;pulling=true;dist=0;ind.classList.remove('settle');
  },{passive:true});

  addEventListener('touchmove',e=>{
    if(!pulling)return;
    const dy=e.touches[0].clientY-y0;
    if(dy<=0||(window.scrollY||0)>0){pulling=false;if(dist)reset();return;}
    e.preventDefault();                   // 기본 바운스·새로고침 억제
    dist=Math.min(MAX,dy*0.5);            // 감쇠해서 손가락보다 덜 움직이게
    place(dist,Math.min(1,dist/TH)*270);
  },{passive:false});

  const end=()=>{
    if(!pulling)return;
    pulling=false;ind.classList.add('settle');
    if(dist<TH){reset();return;}
    busy=true;
    ind.style.transform='translateY(22px)';ind.style.opacity='1';
    icon.style.transform='';ind.classList.add('spin');
    setTimeout(()=>location.reload(),340); // 스피너를 잠깐 보여준 뒤 새로고침
  };
  addEventListener('touchend',end,{passive:true});
  addEventListener('touchcancel',()=>{if(pulling){pulling=false;reset();}},{passive:true});
})();
_updateSyncBadge();
if(dbxGetToken())dbxResolveRoot().then(()=>syncFromDropbox());
hDbxHandleCallback().then(async()=>{if(hDbxGetToken()){await dbxResolveRoot();hSyncDropbox();}});
if('serviceWorker' in navigator){window.addEventListener('load',()=>{try{navigator.serviceWorker.register('sw.js').then(reg=>{reg.update();reg.addEventListener('updatefound',()=>{const nw=reg.installing;if(!nw)return;nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller){const t=document.createElement('div');t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#4355E8;color:#fff;padding:12px 18px;border-radius:24px;font:600 13px -apple-system,BlinkMacSystemFont,sans-serif;box-shadow:0 4px 16px rgba(67,85,232,.35);z-index:99999;cursor:pointer;';t.textContent='새 버전이 있어요 · 탭해서 새로고침';t.onclick=()=>location.reload();document.body.appendChild(t);}});});}).catch(()=>{});}catch(e){}});}
</script>
