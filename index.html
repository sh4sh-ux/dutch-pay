
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
<title>더치페이</title>
<link rel="icon" type="image/png" href="favicon.png"/>
<link rel="apple-touch-icon" href="favicon.png"/>
<link rel="manifest" href="manifest.webmanifest"/>
<meta name="theme-color" content="#000000"/>
<meta name="apple-mobile-web-app-title" content="더치페이"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="mobile-web-app-capable" content="yes"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F7F7F8;--card:#fff;--left-bg:#FAFAFA;
  --label:#111;--label2:#666;--label3:#B0B0B8;
  --sep:#EBEBED;--sep2:#D4D4D8;--fill:#F3F3F5;--fill2:#F8F8FA;
  --blue:#4355E8;--blue-bg:#EEEFFE;--blue-txt:#2636B8;
  --green:#1DAD53;--green-bg:#EDFAF3;--green-txt:#13823D;
  --red:#E53E3E;--red-bg:#FFF0F0;
  --txn-amber:#FF9500;
  --r:16px;--rm:10px;--rs:9px;--pad-x:32px;
  --app-shadow:0 1px 3px rgba(0,0,0,.04),0 8px 32px rgba(0,0,0,.06);
  --panel-bg:var(--card);--detail-bg:#FAFAFA;
  --nav-bg:#F1F2F6;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#000000;--card:#222224;--left-bg:#181819;
    --label:#F2F2F7;--label2:#AEAEB2;--label3:#636366;
    --sep:#3A3A3C;--sep2:#484848;--fill:#2E2E30;--fill2:#1A1A1C;
    --blue:#7080F5;--blue-bg:#1A1E4A;--blue-txt:#A5B0FF;
    --green:#30D158;--green-bg:#0C2818;--green-txt:#32D75A;
    --red:#FF453A;--red-bg:#2E1414;
    --txn-amber:#FF9F0A;
    --app-shadow:0 0 0 2px rgba(255,255,255,.1),0 12px 48px rgba(0,0,0,.8);
    --panel-bg:var(--bg);--detail-bg:var(--fill);
    --nav-bg:#0D0E11;
  }
}
:root[data-theme="dark"]{
  --bg:#111113;--card:#2C2C2E;--left-bg:#1C1C1E;
  --label:#F2F2F7;--label2:#AEAEB2;--label3:#636366;
  --sep:#3A3A3C;--sep2:#48484A;--fill:#3A3A3C;--fill2:#222224;
  --blue:#7080F5;--blue-bg:#1A1E4A;--blue-txt:#A5B0FF;
  --green:#30D158;--green-bg:#0C2818;--green-txt:#32D75A;
  --red:#FF453A;--red-bg:#2E1414;
  --txn-amber:#FF9F0A;
  --app-shadow:0 0 0 1px rgba(255,255,255,.08),0 8px 40px rgba(0,0,0,.5);
  --detail-bg:var(--fill);
  --nav-bg:#0D0E11;
}
:root[data-theme="light"]{
  --bg:#F7F7F8;--card:#fff;--left-bg:#FAFAFA;
  --label:#111;--label2:#666;--label3:#B0B0B8;
  --sep:#EBEBED;--sep2:#D4D4D8;--fill:#F3F3F5;--fill2:#F8F8FA;
  --blue:#4355E8;--blue-bg:#EEEFFE;--blue-txt:#2636B8;
  --green:#1DAD53;--green-bg:#EDFAF3;--green-txt:#13823D;
  --red:#E53E3E;--red-bg:#FFF0F0;
  --txn-amber:#FF9500;
  --app-shadow:0 1px 3px rgba(0,0,0,.04),0 8px 32px rgba(0,0,0,.06);
  --panel-bg:var(--card);--detail-bg:#FAFAFA;
  --nav-bg:#F1F2F6;
}
html,body{background:var(--bg);font-family:-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif;font-size:14px;color:var(--label);min-height:100vh;-webkit-font-smoothing:antialiased;}
input,select,button{font-family:inherit;}
input[type="date"]{-webkit-appearance:none;-moz-appearance:none;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%238e8e93' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='4' width='18' height='18' rx='2' ry='2'/><line x1='16' y1='2' x2='16' y2='6'/><line x1='8' y1='2' x2='8' y2='6'/><line x1='3' y1='10' x2='21' y2='10'/></svg>");background-repeat:no-repeat;background-position:right 8px center;background-size:14px 14px;padding-right:28px !important;cursor:pointer;position:relative;}
input[type="date"]::-webkit-calendar-picker-indicator{opacity:0;position:absolute;right:0;top:0;width:34px;height:100%;cursor:pointer;margin:0;padding:0;}
input[type="date"]::-webkit-inner-spin-button,input[type="date"]::-webkit-clear-button{display:none;-webkit-appearance:none;}
button{cursor:pointer;}
svg{display:block;flex-shrink:0;}

.desktop-shell{display:flex;align-items:flex-start;justify-content:center;min-height:100vh;padding:48px 32px 80px;}
.desktop-app{display:grid;grid-template-columns:380px minmax(0,1fr);min-height:660px;width:100%;max-width:1100px;background:var(--card);border-radius:var(--r);border:1px solid var(--sep);overflow:hidden;box-shadow:var(--app-shadow);}
.mobile-shell{display:none;}

@media(max-width:700px){
  .desktop-shell{display:none;}
  .mobile-shell{display:block;background:var(--bg);min-height:100vh;}
  .mob-header{background:var(--card);padding:max(20px,calc(env(safe-area-inset-top,0px) + 12px)) 20px 4px;border-bottom:1px solid var(--sep);}
  .mob-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .mob-title{font-size:22px;font-weight:700;letter-spacing:-.4px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;cursor:pointer;}
  .mob-tabs{display:flex;gap:0;}
  .mob-tab{flex:1;border:none;background:transparent;font-size:13px;font-weight:500;color:var(--label2);padding:10px 0 12px;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;}
  .mob-tab.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:600;}
  .mob-body{padding:16px 16px calc(max(env(safe-area-inset-bottom,0px),0px) + 72px);}
  .mob-owner-tap{display:none;}
  .mob-ver-badge{font-size:11px;font-weight:600;color:var(--label3);cursor:pointer;font-family:inherit;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;display:inline-flex;align-items:center;flex-shrink:0;padding:4px 2px;background:none;border:none;outline:none;-webkit-appearance:none;appearance:none;}
  .mob-section{background:var(--card);border-radius:var(--r);overflow:hidden;margin-bottom:12px;}
  .mob-section-hd{padding:14px 16px;border-bottom:1px solid var(--sep);display:flex;align-items:center;justify-content:space-between;}
  .mob-section-title{font-size:12px;font-weight:600;color:var(--label2);}
  .mob-clear-btn{font-size:12px;color:var(--red);border:none;background:transparent;font-weight:500;padding:0;}
  .mob-pin-wrap{padding:12px 16px;}
  .mob-pin-row{display:flex;gap:8px;margin-bottom:8px;}
  .mob-pin-row input{flex:1;border:1px solid var(--sep2);border-radius:var(--rs);padding:9px 12px;font-size:14px;background:var(--bg);color:var(--label);outline:none;min-width:0;}
  .mob-pin-row input:focus{border-color:var(--blue);}
  .mob-add-btn{border:none;background:var(--blue);color:#fff;border-radius:var(--rs);padding:9px 16px;font-size:14px;font-weight:600;}
  .mob-hint{font-size:11px;color:var(--label3);margin-bottom:10px;}
  .mob-pills{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 14px;}
  .mob-empty-pills{padding:0 16px 14px;font-size:13px;color:var(--label3);}
  .mob-item-row{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--sep);cursor:pointer;animation:rowIn .25s ease;}
  .mob-item-row:last-child{border-bottom:none;}
  .mob-item-row.sel{background:var(--fill2);}
  .mob-item-dot{width:6px;height:6px;border-radius:50%;background:var(--sep2);flex-shrink:0;}
  .mob-item-row.sel .mob-item-dot{background:var(--blue);}
  .mob-item-info{flex:1;min-width:0;}
  .mob-item-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mob-item-meta{font-size:11px;color:var(--label3);margin-top:2px;}
  .mob-item-amt{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;}
  .mob-add-item-row{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;}
  .mob-add-ic{width:24px;height:24px;border-radius:50%;background:var(--blue-bg);color:var(--blue-txt);display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1;}
  .mob-add-txt{font-size:14px;font-weight:500;color:var(--blue);}
  .mob-total-bar{background:var(--card);border-radius:var(--r);padding:14px 16px;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
  .mob-total-lbl{font-size:13px;color:var(--label2);}
  .mob-total-val{font-size:20px;font-weight:700;}
  .mob-sheet-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;}
  .mob-sheet-overlay.open{display:block;}
  .mob-sheet{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-radius:var(--r) var(--r) 0 0;padding:0 0 40px;max-height:85vh;overflow-y:auto;z-index:101;transform:translateY(100%);transition:transform .28s cubic-bezier(.25,.8,.25,1);}
  .mob-sheet.open{transform:translateY(0);}
  .mob-sheet-handle{width:36px;height:4px;background:var(--sep2);border-radius:2px;margin:12px auto 16px;}
  .mob-sheet-title{font-size:16px;font-weight:700;padding:0 20px 16px;border-bottom:1px solid var(--sep);}
  .mob-sheet-body{padding:20px 20px 0;}
  .stat-val{font-size:17px;}
  .stat-box{padding:14px 10px;}
}

.left{border-right:1px solid var(--sep);display:flex;flex-direction:column;background:var(--left-bg);}
.left-top{padding:28px var(--pad-x) 0;}
.app-label{font-size:11px;font-weight:600;color:var(--label3);letter-spacing:.5px;text-transform:uppercase;margin-bottom:5px;}
.app-version{font-weight:400;letter-spacing:0;opacity:.7;text-transform:none;margin-left:4px;}
.app-title{font-size:24px;font-weight:700;letter-spacing:-.5px;line-height:1.15;margin-bottom:18px;}
.tab-row{display:flex;gap:2px;background:var(--fill);border-radius:10px;padding:3px;margin-bottom:20px;}
.tab{flex:1;border:none;background:transparent;font-size:13px;font-weight:500;color:var(--label2);padding:6px 0;border-radius:8px;cursor:pointer;transition:all .15s;}
.tab.on{background:var(--card);color:var(--label);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.people-wrap{padding:0 0 14px;border-bottom:1px solid var(--sep);}
.sec-label-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.sec-label{font-size:12px;font-weight:600;color:var(--label2);}
.clear-all-btn{font-size:11px;color:var(--red);border:none;background:transparent;font-weight:500;padding:0;cursor:pointer;}
.pin-row{display:flex;gap:6px;margin-bottom:6px;}
.pin-row input{flex:1;border:1px solid var(--sep2);border-radius:var(--rs);padding:7px 10px;font-size:13px;background:var(--card);color:var(--label);outline:none;min-width:0;}
.pin-row input:focus{border-color:var(--blue);}
.pin-btn{border:none;background:var(--blue);color:#fff;border-radius:var(--rs);padding:7px 13px;font-size:13px;font-weight:600;}
.pin-hint{font-size:11px;color:var(--label3);margin-bottom:8px;}
.pills{display:flex;flex-wrap:wrap;gap:5px;min-height:20px;}
.pills-empty{font-size:12px;color:var(--label3);}
.amt-neg{color:var(--red);}
.toast-container{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:420px;}
.toast{background:var(--label);color:var(--bg);padding:12px 16px;border-radius:10px;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.18);pointer-events:auto;display:flex;align-items:center;gap:12px;opacity:0;transform:translateY(20px);transition:opacity .25s,transform .25s;max-width:100%;line-height:1.4;}
.toast.show{opacity:1;transform:translateY(0);}
.toast-msg{flex:1;}
.toast-action{background:transparent;color:#5BB0FF;border:none;font-size:14px;font-weight:700;cursor:pointer;padding:0 4px;font-family:inherit;white-space:nowrap;}
.toast.error{background:var(--red);}
.toast.success{background:var(--green);}
.pill{display:inline-flex;align-items:center;gap:3px;background:var(--fill);border:1px solid var(--sep);border-radius:20px;padding:4px 7px 4px 10px;font-size:12px;font-weight:500;white-space:nowrap;animation:pillIn .2s ease;cursor:pointer;user-select:none;}
@keyframes pillIn{from{opacity:0;transform:scale(.85);}to{opacity:1;transform:scale(1);}}
.pill-x{border:none;background:none;color:var(--label3);padding:0;display:flex;align-items:center;}
.items-scroll{flex:1;overflow-y:auto;padding:14px 0 0;}
.items-scroll::-webkit-scrollbar{width:3px;}
.items-scroll::-webkit-scrollbar-thumb{background:var(--sep2);border-radius:2px;}
.ilist-label-row{display:flex;align-items:center;justify-content:space-between;padding:0 var(--pad-x);margin-bottom:8px;gap:6px;}
.ilist-label{font-size:12px;font-weight:600;color:var(--label2);flex-shrink:0;}
.ilist-tools{display:flex;align-items:center;gap:4px;flex:1;justify-content:flex-end;}
.ilist-results-empty{padding:24px var(--pad-x);font-size:13px;color:var(--label3);text-align:center;}
.item-row{display:flex;align-items:center;gap:10px;padding:10px var(--pad-x);border-bottom:1px solid var(--sep);cursor:pointer;transition:background .12s;animation:rowIn .25s ease;}
@keyframes rowIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}
.item-row:hover,.item-row.sel{background:var(--fill);}
.item-dot{width:6px;height:6px;border-radius:50%;background:var(--sep2);flex-shrink:0;}
.item-row.sel .item-dot{background:var(--blue);}
.item-info{flex:1;min-width:0;}
.item-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-meta{font-size:11px;color:var(--label3);margin-top:1px;}
.item-amt{font-size:13px;font-weight:700;flex-shrink:0;font-variant-numeric:tabular-nums;}
.add-row{display:flex;align-items:center;gap:10px;padding:11px var(--pad-x);cursor:pointer;transition:background .1s;}
.add-row:hover{background:var(--fill);}
.add-ic{width:22px;height:22px;border-radius:50%;background:var(--blue-bg);color:var(--blue-txt);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:400;line-height:1;flex-shrink:0;}
.add-txt{font-size:13px;font-weight:500;color:var(--blue);}
.left-foot{border-top:1px solid var(--sep);padding:14px var(--pad-x);}
.foot-row{display:flex;align-items:baseline;justify-content:space-between;}
.foot-lbl{font-size:12px;color:var(--label2);}
.foot-val{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;}

.right{display:flex;flex-direction:column;background:var(--panel-bg);}
.right-top{padding:28px 32px 20px;border-bottom:1px solid var(--sep);}
.r-eye{font-size:12px;font-weight:500;color:var(--label3);letter-spacing:.7px;text-transform:uppercase;line-height:1.4;margin-bottom:11px;}
.r-title{font-size:22px;font-weight:700;letter-spacing:-.4px;}
.r-sub{font-size:13px;color:var(--label2);margin-top:5px;line-height:1.5;}
.right-body{flex:1;padding:24px 32px;overflow-y:auto;}
.right-body::-webkit-scrollbar{width:3px;}
.right-body::-webkit-scrollbar-thumb{background:var(--sep2);border-radius:2px;}

.field-g{margin-bottom:18px;}
.field-lbl{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:16px;margin-bottom:8px;font-size:12px;font-weight:600;line-height:1.35;color:var(--label2);}
.field-inp{width:100%;min-height:42px;border:1px solid var(--sep2);border-radius:var(--rs);padding:9px 12px;font-size:14px;background:var(--bg);color:var(--label);outline:none;}
.field-inp:focus{border-color:var(--blue);}
.field-sel{width:100%;min-height:42px;border:1px solid var(--sep2);border-radius:var(--rs);padding:9px 12px;font-size:14px;background:var(--bg);color:var(--label);outline:none;appearance:none;cursor:pointer;}
.amt-wrap{position:relative;}
.amt-wrap input{padding-left:44px;padding-right:30px;}
.amt-unit{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--label3);pointer-events:none;}
.amt-sign-btn{position:absolute;left:4px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:1px solid var(--sep2);border-radius:50%;background:var(--card);color:var(--label3);font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;font-family:inherit;transition:all .12s;}
.amt-sign-btn:hover{border-color:var(--label3);}
.amt-sign-btn.on{background:var(--red);color:#fff;border-color:var(--red);}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{border:1px solid var(--sep2);border-radius:20px;padding:6px 13px;font-size:13px;font-weight:500;cursor:pointer;background:var(--card);color:var(--label2);transition:all .12s;}
.chip.on{border-color:var(--label);background:var(--label);color:var(--bg);}
.chip.watch{background:#F0EFF8;border-color:#C8C6E0;color:#7070A8;}
.chip-watch-lbl{font-size:10px;font-weight:700;margin-left:2px;}
.treat-toggle{width:100%;border:1px solid var(--sep2);border-radius:var(--rs);padding:10px 14px;font-size:14px;font-family:inherit;background:var(--card);color:var(--label2);cursor:pointer;text-align:left;transition:all .12s;}
.treat-toggle.on{border-color:#D47000;background:#FFF8EE;color:#D47000;font-weight:600;}
.treat-badge{font-size:11px;color:#4355E8;font-weight:600;flex-shrink:0;}
.del-btn{width:100%;border:1px solid var(--sep2);border-radius:var(--rs);padding:10px;font-size:13px;color:var(--red);background:transparent;margin-top:8px;transition:background .12s;display:flex;align-items:center;justify-content:center;gap:6px;}
.del-btn:hover{background:var(--red-bg);}
.confirm-btn{width:100%;border:none;border-radius:var(--rs);padding:12px;font-size:14px;font-weight:600;background:var(--label);color:var(--bg);margin-top:16px;cursor:pointer;transition:opacity .12s;}
.confirm-btn:hover{opacity:.85;}

.stat-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:20px;}
.result-breakdown{background:var(--card);border-radius:var(--r);overflow:hidden;margin-bottom:20px;box-shadow:0 2px 10px rgba(20,25,40,.07);}
.rbd-row{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;border-bottom:1px solid var(--sep);}
.rbd-row:last-child{border-bottom:none;}
.rbd-lbl{font-size:14px;color:var(--label);font-weight:500;}
.rbd-hint{font-size:11px;color:var(--label3);margin-left:5px;font-weight:400;}
.rbd-val{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--label);}
.rbd-val.rbd-neg{color:var(--green);}
.rbd-val.treat{color:#EA580C;}
@media(prefers-color-scheme:dark){.rbd-val.treat{color:#FB923C;}}
:root[data-theme="dark"] .rbd-val.treat{color:#FB923C;}
.rbd-sep{height:1px;background:var(--sep);margin:0 16px;}
.rbd-row.rbd-total .rbd-lbl{color:var(--blue);font-weight:600;}
.rbd-row.rbd-total .rbd-val{color:var(--blue);}
.stat-box{background:var(--fill);border-radius:var(--rm);padding:16px 12px;text-align:center;min-width:0;}
.stat-lbl{font-size:11px;color:var(--label2);font-weight:500;margin-bottom:6px;white-space:nowrap;}
.stat-val{font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;}
.pcard{border-radius:var(--r);margin-bottom:10px;overflow:hidden;box-shadow:0 2px 10px rgba(20,25,40,.08);}
.phd{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--fill2);}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--blue-bg);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--blue-txt);flex-shrink:0;}
.pname-col{flex:1;}
.pname{font-size:14px;font-weight:600;}
.pnet{font-size:11px;margin-top:2px;}
.pnet.pos{color:var(--green);}
.pnet.neg{color:var(--red);}
.pnet.zero{color:var(--label3);}
.ptotal{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;}
.bd-row{display:flex;align-items:center;padding:9px 16px;border-bottom:1px solid var(--sep);gap:8px;}
.bd-row:last-child{border-bottom:none;}

/* 영수증 DB 상세 품목표(.detail-items-panel .items-table)와 동일 규격.
   영수증 DB는 셀 안이 input(패딩 5px 4px + 1px 테두리)이라 td 패딩 7px에 12px이 더해진다.
   더치페이는 평문 텍스트이므로 그 합산값을 td 패딩에 직접 반영해 행 높이를 맞춘다. */
.rc-receipt-tbl{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed;}
.rc-receipt-tbl thead th{padding:7px 14px 7px 10px;font-size:11px;font-weight:600;color:var(--label3);letter-spacing:.3px;text-align:right;border-bottom:1px solid var(--sep2);}
.rc-receipt-tbl thead th:first-child{text-align:left;padding-left:0;}
.rc-receipt-tbl thead th:nth-child(2){width:52px;}
.rc-receipt-tbl thead th:nth-child(3){width:108px;}
.rc-receipt-tbl thead th:nth-child(4){width:108px;}
.rc-receipt-tbl tbody td{padding:13px 14px 13px 10px;text-align:right;color:var(--label);font-variant-numeric:tabular-nums;border-bottom:1px solid var(--sep);vertical-align:top;white-space:nowrap;}
.rc-receipt-tbl tbody td:first-child{text-align:left;padding-left:0;white-space:normal;}
.rc-receipt-tbl tbody td:nth-child(4){font-weight:600;}
.rc-receipt-tbl tbody tr:last-child td{border-bottom:none;}
.rc-receipt-tbl tfoot td{padding:15px 14px 15px 10px;font-weight:700;text-align:right;border-top:2px solid var(--sep2);border-bottom:none;font-variant-numeric:tabular-nums;}
.rc-receipt-tbl tfoot td:first-child{text-align:left;padding-left:0;}
.rc-receipt-tbl tfoot td:last-child{font-size:14px;}
.rc-receipt-tbl td.rc-neg{color:var(--red);}
@media(max-width:780px){
.rc-receipt-tbl{font-size:11px;}
.rc-receipt-tbl thead th{padding:7px 6px 7px 4px;}
.rc-receipt-tbl thead th:first-child{padding-left:3px;}
.rc-receipt-tbl thead th:nth-child(2){width:34px;}
.rc-receipt-tbl thead th:nth-child(3){width:76px;}
.rc-receipt-tbl thead th:nth-child(4){width:80px;}
.rc-receipt-tbl tbody td{padding:11px 6px 11px 4px;}
.rc-receipt-tbl tbody td:first-child{padding-left:3px;}
.rc-receipt-tbl tfoot td{padding:13px 6px 13px 4px;}
.rc-receipt-tbl tfoot td:first-child{padding-left:3px;}
}

/* 레일 아이콘 라벨 — 반투명 배경으로 뒤 내용이 비치게 하고,
   말풍선 오른쪽 끝이 좌측 패널 콘텐츠 시작선(레일 끝 + 28px 여백)을 넘지 않도록
   여백 2px·패딩 5px 8px·11.5px로 좁혀 일자 입력칸과 겹치지 않게 한다. */
.app-rail [data-nav-label]{position:relative;}
.app-rail [data-nav-label]::after{content:attr(data-nav-label);position:absolute;z-index:400;left:calc(100% + 2px);top:50%;transform:translateY(-50%) translateX(-3px);padding:5px 8px;border-radius:7px;background:rgba(36,36,38,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;font-size:11.5px;font-weight:600;line-height:1;letter-spacing:-.1px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.16);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .12s,transform .12s,visibility .12s;}
.app-rail [data-nav-label]:hover::after,.app-rail [data-nav-label]:focus-visible::after,.app-rail [data-nav-label].show-nav-tip::after{opacity:1;visibility:visible;transform:translateY(-50%) translateX(0);}
.left,.right{min-height:0;overflow:hidden;}

  .mob-header{padding:max(18px,calc(env(safe-area-inset-top,0px) + 12px)) 20px 0;}
  /* 헤더 고정 — 지출 목록을 훑는 동안 총 지출이 계속 보이게 한다.
     .mob-tabs는 position:fixed라 backdrop-filter가 만드는 기준 박스에 갇히면

  .mob-header{position:sticky;top:0;z-index:60;

    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);}

  /* 당겨서 새로고침 — 홈 화면에 추가한 PWA에는 브라우저의 기본 당겨서 새로고침이
     없어서 직접 구현한다. overscroll-behavior로 브라우저 기본 동작을 끄고

  html{overscroll-behavior-y:contain;}

  .mob-tab{display:flex;min-height:54px;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:0;border:0;border-radius:14px;font-size:10px;}

}

<script>
const APP_VERSION='v5.11';
const BUILD_TIME='2026-08-30 07:20';
window.diag=()=>{const r={version:APP_VERSION,build:BUILD_TIME,groupCards:document.querySelectorAll('.group-card').length,groupActs:document.querySelectorAll('.group-card-acts').length,sw:navigator.serviceWorker.controller?.scriptURL?.split('/').pop()||'none'};console.table(r);caches.keys().then(k=>console.log('caches:',k));return r;};

let people=[],items=[],idc=0,selectedId=null;
let payments={};
let _justAddedId=null;
let _pmHistTab='current',_pmHistSearch='',_pmHistSort='newest',_pmHistFilter='all',_pmViewMode='list',_pmHistGroup='all',_pmMonthPeopleSort='amt';
const _pmMonthsOpen=new Set();
let _dbxAutoSavedFp='';
let _myName=localStorage.getItem('dutchpay_my_name')||'';
let _coupleNames=(()=>{try{return JSON.parse(localStorage.getItem('dutchpay_couple')||'[]');}catch(e){return[];}})();
let _ownerTapCount=0,_ownerUnlocked=!!localStorage.getItem('dutchpay_owner_unlocked');
let _historySearch='';
let _historySort='newest';
let _histSettleMode=false;
let _histDrawerOpen=false,_loadedHistId=null;
let _histMonthYear=new Date().getFullYear(),_histMonthMonth=new Date().getMonth()+1,_histMonthAllMode=false;
let dTab='input',mTab='input';
let itemSort='default',itemSearch='';
let settleDateStart=new Date().toISOString().slice(0,10),settleDateEnd=null;
let groups=[],currentGroupId=null;
let deletedGroups={};
const _syncSnapshots={};
const SYNC_HASHES_KEY='dutchpay_sync_hashes';
const RECEIPT_DB_TRANSFER_KEY='receipt_db_dutchpay_transfer_v1';
function _dataHash(data){let h=0;const s=JSON.stringify(data)||'';for(let i=0;i<s.length;i++)h=Math.imul(31,h)+s.charCodeAt(i)|0;return (h>>>0).toString(36);}
function _groupHash(g){return _dataHash({name:g.name,nameAuto:g.nameAuto,data:g.data});}
function _loadSyncedHashes(){try{return JSON.parse(localStorage.getItem(SYNC_HASHES_KEY)||'{}')||{};}catch(e){return {};}}
function _saveSyncedHashes(h){try{localStorage.setItem(SYNC_HASHES_KEY,JSON.stringify(h));}catch(e){}}

function _emptyGroupData(){return{people:[],items:[],idc:0,settleDateStart:new Date().toISOString().slice(0,10),settleDateEnd:null,itemSort:'default',itemSearch:'',payments:{}};}
function _autoGroupName(p){return(!p||!p.length)?'모임명 또는 참여자':p.join(', ');}
function _updateAutoNameIfNeeded(){const g=getCurrentGroup();if(!g||!g.nameAuto)return;g.name=_autoGroupName(people);}
function _newGroupId(){return 'g'+Date.now()+Math.floor(Math.random()*1000);}
function getCurrentGroup(){return groups.find(g=>g.id===currentGroupId);}
function syncCurrentToGroup(){const g=getCurrentGroup();if(!g)return;if(!g.createdAt)g.createdAt=new Date().toISOString();const nextData={people:people.slice(),items:JSON.parse(JSON.stringify(items)),idc,settleDateStart,settleDateEnd,itemSort,itemSearch,payments:JSON.parse(JSON.stringify(payments))};const nextStr=JSON.stringify(nextData);if(nextStr!==_syncSnapshots[g.id]){g.updatedAt=new Date().toISOString();_syncSnapshots[g.id]=nextStr;}g.data=nextData;}
function loadGroupData(g){people=(g.data.people||[]).slice();items=JSON.parse(JSON.stringify(g.data.items||[]));idc=g.data.idc||0;settleDateStart=g.data.settleDateStart||new Date().toISOString().slice(0,10);settleDateEnd=g.data.settleDateEnd!==undefined?g.data.settleDateEnd:null;itemSort=g.data.itemSort||'default';itemSearch=g.data.itemSearch||'';payments=JSON.parse(JSON.stringify(g.data.payments||{}));selectedId=null;}
function switchGroup(id){if(id===currentGroupId)return;syncCurrentToGroup();currentGroupId=id;const g=getCurrentGroup();if(g)loadGroupData(g);_loadedHistId=null;renderAll();}
function createGroup(name){const id=_newGroupId();syncCurrentToGroup();const trimmed=(name||'').trim();const isAuto=!trimmed;const now=new Date().toISOString();groups.push({id,name:trimmed||_autoGroupName([]),nameAuto:isAuto,createdAt:now,updatedAt:now,data:_emptyGroupData()});currentGroupId=id;loadGroupData(groups[groups.length-1]);renderAll();toast(trimmed?`'${trimmed}' 그룹 생성됨`:'새 그룹이 생성됐어요',{type:'success'});}
function renameGroup(id,newName){const g=groups.find(g=>g.id===id);if(!g)return;const trimmed=(newName||'').trim();if(!trimmed)return;g.name=trimmed;g.nameAuto=false;g.updatedAt=new Date().toISOString();saveState();renderAll();}
function duplicateGroup(id){const g=groups.find(g=>g.id===id);if(!g)return;syncCurrentToGroup();const newId=_newGroupId();const ng={id:newId,name:g.name+' (복사)',nameAuto:false,data:{people:(g.data.people||[]).slice(),items:[],idc:0,settleDateStart:new Date().toISOString().slice(0,10),settleDateEnd:null,itemSort:'default',itemSearch:''}};groups.push(ng);currentGroupId=newId;loadGroupData(ng);renderAll();toast(`'${ng.name}' 생성됨`,{type:'success'});}
function deleteGroup(id){if(groups.length<=1){toast('마지막 그룹은 삭제할 수 없어요',{type:'error'});return;}const idx=groups.findIndex(g=>g.id===id);if(idx<0)return;if(!confirm(`'${groups[idx].name}' 그룹을 삭제할까요?`))return;const snap={group:JSON.parse(JSON.stringify(groups[idx])),idx,wasCurrent:id===currentGroupId};groups.splice(idx,1);deletedGroups[id]=new Date().toISOString();delete _syncSnapshots[id];if(snap.wasCurrent){currentGroupId=groups[0].id;loadGroupData(groups[0]);}renderAll();toast(`'${snap.group.name}' 그룹 삭제됨`,{action:()=>{delete deletedGroups[snap.group.id];groups.splice(snap.idx,0,snap.group);if(snap.wasCurrent){syncCurrentToGroup();currentGroupId=snap.group.id;loadGroupData(snap.group);}renderAll();},actionLabel:'되돌리기'});}

function _groupSummary(g){const isCurrent=g.id===currentGroupId;const data=isCurrent?{people,items,settleDateStart,settleDateEnd}:g.data||{};const peopleArr=data.people||[];const itemsArr=data.items||[];const total=itemsArr.reduce((s,it)=>s+(+it.amount||0),0);let dateText='';if(data.settleDateStart){const fmtD=(iso)=>iso?iso.slice(5).replace('-','.'):'';if(data.settleDateEnd&&data.settleDateEnd!==data.settleDateStart){dateText=fmtD(data.settleDateStart)+'~'+fmtD(data.settleDateEnd);}else{dateText=data.settleDateStart.slice(2).replace(/-/g,'.');}}return{total,totalText:total?fmt(total)+'원':'—',peopleText:peopleArr.length?peopleArr.join(' · '):'참여자 없음',peopleCount:peopleArr.length,dateText};}

function showGroupManager(anchorEl,ev){
  if(ev){ev.stopPropagation();ev.preventDefault();}
  document.querySelectorAll('.icon-pop,.rounder-pop,.group-pop,.data-pop').forEach(el=>el.remove());
  const pop=document.createElement('div');pop.className='group-pop';
  const cardsHtml=groups.map(g=>{const s=_groupSummary(g);const on=g.id===currentGroupId;return `<div class="group-card${on?' on':''}"><button class="group-card-main" data-action="switch" data-id="${e(g.id)}"><span class="group-card-dot"></span><span class="group-card-info"><span class="group-card-name">${e(g.name)}</span><span class="group-card-meta"><span class="group-card-people">${e(s.peopleText)}</span>${s.dateText?`<span class="group-card-date">${e(s.dateText)}</span>`:''}</span></span><span class="group-card-amt">${s.totalText}</span></button><button class="group-card-more" data-action="more" data-id="${e(g.id)}" aria-label="더보기">⋯</button></div>`;}).join('');
  pop.innerHTML=`<div class="group-pop-hd">정산 그룹</div><div class="group-list">${cardsHtml}</div><button class="group-add" data-action="add">＋ 새 그룹</button>`;
  pop.addEventListener('click',(e2)=>{e2.stopPropagation();const btn=e2.target.closest('[data-action]');if(!btn)return;const action=btn.dataset.action,id=btn.dataset.id;if(action==='switch'){switchGroup(id);pop.remove();}else if(action==='more'){e2.preventDefault();_openGroupMorePop(btn,id,pop);}else if(action==='rename'){const g=groups.find(g=>g.id===id);const newName=prompt('새 이름:',g?g.name:'');if(newName&&newName.trim())renameGroup(id,newName);pop.remove();}else if(action==='delete'){const g=groups.find(g=>g.id===id);if(g&&confirm(`'${g.name}' 그룹을 삭제할까요?`)){deleteGroup(id);}pop.remove();}else if(action==='add'){const name=prompt('새 그룹 이름:','');if(name&&name.trim())createGroup(name.trim());pop.remove();}else if(action==='duplicate'){duplicateGroup(id);pop.remove();}});
  document.body.appendChild(pop);_positionPopover(pop,anchorEl);
  setTimeout(()=>{const h=(e3)=>{if(!pop.contains(e3.target)){pop.remove();document.removeEventListener('click',h);document.removeEventListener('keydown',k);}};const k=(e3)=>{if(e3.key==='Escape'){pop.remove();document.removeEventListener('click',h);document.removeEventListener('keydown',k);}};document.addEventListener('click',h);document.addEventListener('keydown',k);},0);
}

function _positionPopover(pop,anchorEl,rightAlign){
  const r=anchorEl.getBoundingClientRect();
  const isMobile=window.innerWidth<700;
  const rail=!isMobile?anchorEl.closest('.app-rail'):null;
  const margin=12,gap=6;
  pop.style.maxHeight=Math.max(180,window.innerHeight-margin*2)+'px';
  if(isMobile){pop.style.left='12px';pop.style.right='12px';pop.style.width='auto';pop.style.maxWidth='none';}
  else{pop.style.right='auto';pop.style.width='auto';}
  const pr=pop.getBoundingClientRect();
  let top=r.bottom+gap;
  if(top+pr.height>window.innerHeight-margin)top=r.top-pr.height-gap;
  top=Math.max(margin,Math.min(top,window.innerHeight-pr.height-margin));
  pop.style.top=(top+window.scrollY)+'px';
  if(!isMobile){
    let left=rail?rail.getBoundingClientRect().right+gap:(rightAlign?r.right-pr.width:r.left);
    left=Math.max(margin,Math.min(left,window.innerWidth-pr.width-margin));
    pop.style.left=(left+window.scrollX)+'px';
  }
}

function _openGroupMorePop(anchorBtn,id,parentPop){document.querySelectorAll('.group-more-pop').forEach(el=>el.remove());const g=groups.find(x=>x.id===id);if(!g)return;const canDelete=groups.length>1;const menu=document.createElement('div');menu.className='group-more-pop';menu.innerHTML=`<button class="group-more-opt" data-mact="duplicate">${svgCopy}<span>복사</span></button><button class="group-more-opt" data-mact="rename">${svgPencil}<span>이름 변경</span></button>${canDelete?`<button class="group-more-opt danger" data-mact="delete">${svgTrash}<span>삭제</span></button>`:''}`;document.body.appendChild(menu);const r=anchorBtn.getBoundingClientRect();const mr=menu.getBoundingClientRect();let top=r.bottom+4;if(top+mr.height>window.innerHeight-8)top=r.top-mr.height-4;let left=r.right-mr.width;if(left<8)left=8;menu.style.top=top+'px';menu.style.left=left+'px';menu.addEventListener('click',(e2)=>{e2.stopPropagation();const b=e2.target.closest('[data-mact]');if(!b)return;const mact=b.dataset.mact;menu.remove();if(parentPop&&parentPop.remove)parentPop.remove();if(mact==='duplicate'){duplicateGroup(id);}else if(mact==='rename'){const newName=prompt('새 이름:',g.name);if(newName&&newName.trim())renameGroup(id,newName);}else if(mact==='delete'){if(confirm(`'${g.name}' 그룹을 삭제할까요?`))deleteGroup(id);}});setTimeout(()=>{const close=(ev)=>{if(!menu.contains(ev.target)){menu.remove();document.removeEventListener('click',close);document.removeEventListener('keydown',esc);}};const esc=(ev)=>{if(ev.key==='Escape'){menu.remove();document.removeEventListener('click',close);document.removeEventListener('keydown',esc);}};document.addEventListener('click',close);document.addEventListener('keydown',esc);},0);}

function _getEffectiveDark(){const stored=localStorage.getItem('dutchpay_dark_mode');if(stored==='dark')return true;if(stored==='light')return false;return window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches;}

function exportCurrentGroupCsv(){const g=getCurrentGroup();if(!g){toast('내보낼 데이터가 없어요',{type:'error'});return;}syncCurrentToGroup();if(!items.length){toast('지출이 없는 그룹이에요',{type:'error'});return;}const BOM='﻿';const esc=(s)=>{s=String(s==null?'':s);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};const lines=[];lines.push(`그룹,${esc(g.name)}`);if(settleDateStart){if(settleDateEnd&&settleDateEnd!==settleDateStart){lines.push(`기간,${settleDateStart} ~ ${settleDateEnd}`);}else{lines.push(`일자,${settleDateStart}`);}}const total=items.reduce((s,it)=>s+(+it.amount||0),0);lines.push(`총 금액,${total}`);lines.push(`참여자,${esc(people.join(', '))}`);lines.push('');lines.push('# 지출 내역');lines.push('번호,지출 이름,금액,결제자,참여자');items.forEach((it,i)=>{const mems=(it.members.length?it.members:people).join(', ');lines.push([i+1,esc(it.name||'(이름 없음)'),+it.amount||0,esc(it.payer||''),esc(mems)].join(','));});lines.push('');const{paid,owes}=computeShares();const txns=calcTxns(paid,owes);if(txns.length){lines.push('# 송금 내역');lines.push('보내는 사람,받는 사람,금액');txns.forEach(t=>{lines.push([esc(t.from),esc(t.to),t.amt].join(','));});lines.push('');}lines.push('# 개인별 정산');lines.push('이름,결제 총액,분담 총액,순액');people.forEach(p=>{const paidP=paid[p]||0,owesP=owes[p]||0,net=paidP-owesP;lines.push([esc(p),paidP,owesP,net].join(','));});const csv=BOM+lines.join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');const safeName=g.name.replace(/[\\\/:*?"<>|]/g,'_');a.download=`더치페이_${safeName}_${new Date().toISOString().slice(0,10)}.csv`;a.href=url;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(url),1000);toast('엑셀(CSV) 파일이 다운로드됐어요',{type:'success'});}

// ── Dropbox 자동 동기화 ──
/* ── Dropbox 저장 위치 (v5.11) ──────────────────────────────────
   모든 앱 데이터를 Dropbox `/07_Apps/` 아래로 모았다.
   · 새 위치: /07_Apps/더치페이(Dutch-Pay)/   (data·history JSON + 정산 이미지 PNG)
   · 옛 위치: /01_Personal/Dutch-Pay/
   폴더명에 한글이 들어가므로 Dropbox-API-Arg 헤더는 반드시 ASCII 이스케이프한다
   (HTTP 헤더는 ASCII만 허용 — 안 하면 fetch가 통째로 실패한다).
   이전은 copy만 하고 옛 폴더는 지우지 않는다. 복사가 실패하면 옛 위치로 계속
   동작하다 다음 실행에 재시도하므로 어떤 경우에도 데이터가 사라지지 않는다. */
const DBX_ROOT='/07_Apps/더치페이(Dutch-Pay)';
const DBX_OLD_ROOT='/01_Personal/Dutch-Pay';
const DBX_MIGRATED='dutchpay_dbx_migrated';
let   DBX_DIR=localStorage.getItem(DBX_MIGRATED)==='1'?DBX_ROOT:DBX_OLD_ROOT;
const dbxDir=()=>DBX_DIR;
const dbxMainFile=()=>DBX_DIR+'/dutch-pay_data.json';
const dbxHistFile=()=>DBX_DIR+'/dutch-pay_history.json';

/* 저장 위치 확인·이전 — 부팅 때 한 번. 원본은 그대로 두고 복사만 한다. */
async function _dbxRpc(token,ep,body){
  return fetch('https://api.dropboxapi.com/2/'+ep,{method:'POST',
    headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'},
    body:JSON.stringify(body)});   // 본문은 UTF-8 — 한글 그대로 보내도 된다 (헤더만 ASCII 제약)
}
async function _dbxExists(token,path){ try{ return (await _dbxRpc(token,'files/get_metadata',{path})).ok; }catch(e){ return false; } }
let _dbxRootPromise=null;
function dbxResolveRoot(){ return _dbxRootPromise||(_dbxRootPromise=_dbxResolveRoot()); }
async function _dbxResolveRoot(){
  if(localStorage.getItem(DBX_MIGRATED)==='1'){ DBX_DIR=DBX_ROOT; return; }
  const token=dbxGetToken(); if(!token)return;
  try{
    if(await _dbxExists(token,DBX_ROOT)){                        // 이미 옮겨져 있음
      DBX_DIR=DBX_ROOT; localStorage.setItem(DBX_MIGRATED,'1'); return;
    }
    await _dbxRpc(token,'files/create_folder_v2',{path:'/07_Apps'});   // 있으면 conflict — 무시
    if(await _dbxExists(token,DBX_OLD_ROOT)){                    // 옛 폴더를 통째로 복사
      const cp=await _dbxRpc(token,'files/copy_v2',{from_path:DBX_OLD_ROOT,to_path:DBX_ROOT,autorename:false});
      if(!cp.ok){ DBX_DIR=DBX_OLD_ROOT; return; }                // 실패 — 옛 위치로 계속, 다음에 재시도
      toast('Dropbox 데이터를 07_Apps로 옮겼어요 (옛 폴더는 그대로 보관)',{type:'success'});
    }else{
      await _dbxRpc(token,'files/create_folder_v2',{path:DBX_ROOT});
    }
    DBX_DIR=DBX_ROOT; localStorage.setItem(DBX_MIGRATED,'1');
  }catch(e){ DBX_DIR=DBX_OLD_ROOT; }
}
const DBX_LASTSYNC_MAIN='dutchpay_dbx_lastsync_main';
// history.html과 동일한 localStorage 키 공유 (같은 도메인 = 같은 계정)
function dbxGetToken(){return localStorage.getItem('dutchpay_dbx_token');}
async function _dbxRefreshToken(){
  const refresh=localStorage.getItem('dutchpay_dbx_refresh');
  const appKey=localStorage.getItem('dutchpay_dbx_appkey');
  if(!refresh||!appKey)return null;
  try{const res=await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'refresh_token',refresh_token:refresh,client_id:appKey})});const data=await res.json();if(data.access_token){localStorage.setItem('dutchpay_dbx_token',data.access_token);return data.access_token;}return null;}catch(e){return null;}
}
async function _dbxUpload(token,path,content){
  const arg=JSON.stringify({path,mode:'overwrite',autorename:false,mute:true}).replace(/[^\x00-\x7F]/g,c=>`\\u${c.charCodeAt(0).toString(16).padStart(4,'0')}`);
  const res=await fetch('https://content.dropboxapi.com/2/files/upload',{method:'POST',headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/octet-stream','Dropbox-API-Arg':arg},body:content});
  if(res.status===401){const t=await _dbxRefreshToken();if(t)return _dbxUpload(t,path,content);}
  return res.ok;
}
async function _dbxDownload(token,path){
  const arg=JSON.stringify({path}).replace(/[^\x00-\x7F]/g,c=>`\\u${c.charCodeAt(0).toString(16).padStart(4,'0')}`);
  const res=await fetch('https://content.dropboxapi.com/2/files/download',{method:'POST',headers:{'Authorization':`Bearer ${token}`,'Dropbox-API-Arg':arg}});
  if(res.status===409)return null;if(res.status===401){const t=await _dbxRefreshToken();if(t)return _dbxDownload(t,path);return null;}if(!res.ok)return null;
  try{return JSON.parse(await res.text());}catch(e){return null;}
}
let _syncTimer=null,_syncing=false,_syncFromRunning=false;
function _scheduleSyncToDropbox(){
  if(!dbxGetToken())return;
  clearTimeout(_syncTimer);
  _syncTimer=setTimeout(()=>syncFromDropbox(),3000);
}
async function syncToDropbox(){
  if(_syncing||!dbxGetToken())return;
  _syncing=true;
  try{
    syncCurrentToGroup();
    const ok=await _dbxUpload(dbxGetToken(),dbxMainFile(),JSON.stringify({version:2,groups,currentGroupId,deletedGroups,coupleNames:_coupleNames||[],syncedAt:new Date().toISOString()}));
    if(ok){
      localStorage.setItem(DBX_LASTSYNC_MAIN,new Date().toISOString());
      const hashes={};groups.forEach(g=>{hashes[g.id]=_groupHash(g);});
      _saveSyncedHashes(hashes);
      _updateSyncBadge();
    }
  }catch(e){}finally{_syncing=false;}
}
async function syncFromDropbox(){
  const token=dbxGetToken();if(!token)return;
  if(_syncFromRunning)return;_syncFromRunning=true;
  try{
    const remote=await _dbxDownload(token,dbxMainFile());
    if(!remote||!Array.isArray(remote.groups)||!remote.groups.length){await syncToDropbox();return;}
    if(remote.coupleNames?.length&&!localStorage.getItem('dutchpay_couple')){_coupleNames=remote.coupleNames;localStorage.setItem('dutchpay_couple',JSON.stringify(_coupleNames));}

    // 삭제 툼스톤 병합 (양쪽 tombstone 합집합)
    const mergedDeleted={...deletedGroups,...(remote.deletedGroups||{})};

    // 동기화 기준선 해시 (양쪽이 baseline에서 모두 변경됐을 때만 충돌)
    const baseHashes=_loadSyncedHashes();

    const mergedGroups=[...groups];
    const conflicts=[];
    (remote.groups||[]).forEach(rg=>{
      if(mergedDeleted[rg.id])return; // 삭제된 그룹 무시
      const li=mergedGroups.findIndex(lg=>lg.id===rg.id);
      if(li===-1){
        mergedGroups.push(rg);
      }else{
        const lg=mergedGroups[li];
        const baseHash=baseHashes[rg.id]||null;
        const localHash=_groupHash(lg);
        const remoteHash=_groupHash(rg);
        const localChanged=baseHash===null||localHash!==baseHash;
        const remoteChanged=baseHash===null||remoteHash!==baseHash;
        if(localChanged&&remoteChanged&&localHash!==remoteHash){
          conflicts.push({id:rg.id,local:lg,remote:rg,idx:li});
        }else if(remoteChanged){
          mergedGroups[li]=rg;
        }
        // else: 로컬만 변경됐거나 동일 → 로컬 유지
      }
    });

    // 로컬에 남은 그룹 중 tombstone에 있는 것 제거
    const filtered=mergedGroups.filter(g=>!mergedDeleted[g.id]);

    if(conflicts.length){
      _autoBackup('Dropbox 충돌 감지');
      _showSyncConflictUI(conflicts,filtered,remote.currentGroupId,mergedDeleted);
      return;
    }

    const changed=JSON.stringify(filtered)!==JSON.stringify(groups)||JSON.stringify(mergedDeleted)!==JSON.stringify(deletedGroups);
    if(changed)toast('Dropbox에서 최신 내용을 병합했어요',{type:'success'});
    await _applySyncMerge(filtered,remote.currentGroupId,mergedDeleted);
  }catch(e){}finally{_syncFromRunning=false;}
}
async function _applySyncMerge(mergedGroups,remoteCurrentId,mergedDeleted){
  // 병합 전 현재 상태 스냅샷
  const _prevGroupHash=getCurrentGroup()?_groupHash(getCurrentGroup()):null;
  const _prevGroupCount=groups.length;
  groups=mergedGroups;
  if(mergedDeleted)deletedGroups=mergedDeleted;
  // 스냅샷 선-적재: loadGroupData 후 syncCurrentToGroup이 updatedAt을 건드리지 않도록
  groups.forEach(g=>{_syncSnapshots[g.id]=JSON.stringify(g.data);});
  if(!getCurrentGroup()&&groups.length)currentGroupId=groups[0].id;
  const g=getCurrentGroup()||groups[0];
  const _prevSelId=selectedId;
  if(g){currentGroupId=g.id;loadGroupData(g);}
  if(_prevSelId&&items.find(i=>i.id===_prevSelId))selectedId=_prevSelId;
  localStorage.setItem(STORAGE_KEY,JSON.stringify({version:3,savedAt:new Date().toISOString(),groups,currentGroupId,deletedGroups}));
  localStorage.setItem(DBX_LASTSYNC_MAIN,new Date().toISOString());
  const hashes={};groups.forEach(g=>{hashes[g.id]=_groupHash(g);});
  _saveSyncedHashes(hashes);
  _updateSyncBadge();
  // 실제로 데이터가 바뀐 경우에만 화면 재렌더링
  const _newGroupHash=getCurrentGroup()?_groupHash(getCurrentGroup()):null;
  if(_prevGroupHash!==_newGroupHash||groups.length!==_prevGroupCount)_renderAllSafe();
  await syncToDropbox();
}

  const ov=document.createElement('div');ov.id='syncConflictOv';ov.className='sc-overlay';
  ov.innerHTML=`<div class="sc-modal"><div class="sc-hd">⚠️ 동기화 충돌</div><div class="sc-desc">두 기기에서 같은 그룹을 동시에 수정했어요.<br>유지할 버전을 선택해주세요.</div>${cards}<button class="sc-confirm" onclick="_scConfirm()">선택 완료</button></div>`;

// Receipt DB가 남긴 일회성 전송 묶음을 시작 시 한 번만, 전부 병합한다.
// 주 저장소와 분리된 봉투를 사용해 여러 건 중 마지막 건만 남거나 Dropbox 시작 동기화에
// 덮어써지는 문제를 막는다. 저장에 성공한 뒤에만 봉투를 삭제하므로 중간 실패도 복구된다.
function _consumeReceiptDbTransfer(){
  try{
    const params=new URLSearchParams(location.search);
    if(params.get('from')!=='receipt-db')return null;
    const raw=localStorage.getItem(RECEIPT_DB_TRANSFER_KEY);if(!raw)return null;
    const envelope=JSON.parse(raw);
    const requestedBatch=params.get('batch');
    if(!envelope||envelope.version!==1||!Array.isArray(envelope.entries)||!envelope.entries.length)return null;
    if(requestedBatch&&envelope.batchId!==requestedBatch)return null;

    syncCurrentToGroup();
    const now=new Date().toISOString();
    const baseHashes=_loadSyncedHashes();
    const isEmptyStarter=groups.length===1&&!groups[0].receiptSourceId&&
      !(groups[0].data?.people||[]).length&&!(groups[0].data?.items||[]).length;
    if(isEmptyStarter){delete _syncSnapshots[groups[0].id];groups=[];currentGroupId=null;}

    const seen=new Set();
    const entries=envelope.entries.filter(entry=>{
      const id=String(entry?.sourceId||'').trim();
      if(!id||seen.has(id))return false;seen.add(id);return true;
    });
    if(!entries.length)return null;
    const sourceIds=entries.map(entry=>String(entry.sourceId));
    const existingIndex=groups.findIndex(group=>{
      const ids=new Set([group.receiptSourceId,...(group.receiptSourceIds||[]),...(group.data?.items||[]).map(item=>item.receiptSourceId)].filter(Boolean).map(String));
      return sourceIds.some(id=>ids.has(id));
    });
    const existing=existingIndex>=0?groups[existingIndex]:null;
    if(existing&&!baseHashes[existing.id])baseHashes[existing.id]=_groupHash(existing);
    let groupId=existing?.id||_newGroupId();
    while(!existing&&groups.some(g=>g.id===groupId))groupId=_newGroupId();

    const people=(existing?.data?.people||[]).slice();
    entries.forEach(entry=>(entry.people||[]).forEach(value=>{
      const name=String(value||'').trim();if(name&&!people.includes(name))people.push(name);
    }));
    entries.forEach(entry=>{const payer=String(entry.payer||'').trim();if(payer&&!people.includes(payer))people.push(payer);});
    const oldItems=existing?.data?.items||[];
    let nextId=Math.max(0,...oldItems.map(item=>Number(item.id)||0));
    const replacedOldItems=new Set();
    const importedItems=entries.map(entry=>{
      const sourceId=String(entry.sourceId);
      const previous=oldItems.find(item=>String(item.receiptSourceId||'')===sourceId)||
        (String(existing?.receiptSourceId||'')===sourceId&&oldItems.length===1?oldItems[0]:null);
      if(previous)replacedOldItems.add(previous);
      const entryPeople=(entry.people||[]).map(v=>String(v||'').trim()).filter((v,i,a)=>v&&a.indexOf(v)===i);
      const payer=String(entry.payer||entryPeople[0]||'').trim();
      if(payer&&!entryPeople.includes(payer))entryPeople.push(payer);
      const receiptText=(entry.items||[]).map(it=>`${it.name||''} | ${Number(it.quantity)||1} | ${Number(it.unitPrice)||0} | ${Number(it.amount)||0}`).join('\n');
      return{...(previous||{}),id:previous?.id||++nextId,receiptSourceId:sourceId,name:String(entry.store||'영수증'),amount:Number(entry.total)||0,payer,members:entryPeople,watchers:[],isTreat:false,receiptText};
    });
    const retainedItems=oldItems.filter(item=>!replacedOldItems.has(item)&&!sourceIds.includes(String(item.receiptSourceId||'')));
    const finalItems=[...retainedItems,...importedItems];
    const finalSourceIds=finalItems.map(item=>String(item.receiptSourceId||'')).filter((v,i,a)=>v&&a.indexOf(v)===i);
    const dates=[existing?.data?.settleDateStart,existing?.data?.settleDateEnd,...entries.map(entry=>entry.date)].filter(Boolean).sort();
    const firstName=String(finalItems[0]?.name||entries[0].store||'영수증');
    const group={
      ...(existing||{}),id:groupId,receiptSourceId:finalSourceIds.length===1?finalSourceIds[0]:null,receiptSourceIds:finalSourceIds,
      name:finalItems.length===1?firstName:`${firstName} 외 ${finalItems.length-1}건`,nameAuto:false,
      createdAt:existing?.createdAt||now,updatedAt:now,
      data:{people,items:finalItems,idc:Math.max(0,...finalItems.map(item=>Number(item.id)||0)),settleDateStart:dates[0]||new Date().toISOString().slice(0,10),settleDateEnd:dates.length&&dates.at(-1)!==dates[0]?dates.at(-1):null,itemSort:'default',itemSearch:'',payments:existing?.data?.payments||{}}
    };
    if(existing)groups[existingIndex]=group;else groups.push(group);
    delete deletedGroups[groupId];
    _syncSnapshots[groupId]=JSON.stringify(group.data);
    currentGroupId=groupId;loadGroupData(group);
    localStorage.setItem(STORAGE_KEY,JSON.stringify({version:3,savedAt:now,groups,currentGroupId,deletedGroups}));
    _saveSyncedHashes(baseHashes);
    localStorage.removeItem(RECEIPT_DB_TRANSFER_KEY);
    return{count:entries.length,created:existing?0:entries.length,updated:existing?entries.length:0};
  }catch(e){return null;}
}

function _personSettleDelta(r,personName){
  const q=(personName||'').trim().toLowerCase();if(!q)return null;
  const txns=r.txns||[];const pmObj=r.payments||{};
  let delta=0,found=false;
  for(const t of txns){
    const fromM=(t.from||'').toLowerCase()===q;
    const toM=(t.to||'').toLowerCase()===q;
    if(!fromM&&!toM)continue;
    found=true;
    const key=`${t.from}|${t.to}`;
    const pm=pmObj[key]||{};
    const planned=+t.amt||0;
    const hasAmt=pm.amount!=null&&pm.amount!==''&&!isNaN(+pm.amount);
    const actual=pm.done?(hasAmt?+pm.amount:planned):0;
    if(fromM){delta+=actual-planned;}else{delta+=planned-actual;}
  }
  return found?delta:null;
}
function _sortHistRecs(recs,sort){
  const a=[...recs];
  if(sort==='oldest')return a.sort((x,y)=>(x.dateStart||'').localeCompare(y.dateStart||''));
  if(sort==='amtDesc')return a.sort((x,y)=>_recTot(y)-_recTot(x));
  if(sort==='amtAsc')return a.sort((x,y)=>_recTot(x)-_recTot(y));
  return a.sort((x,y)=>(y.dateStart||'').localeCompare(x.dateStart||''));
}

function _histMonthNavHtml(allRecs,dispRecs){
  const now=new Date();const curY=now.getFullYear(),curM=now.getMonth()+1;
  const atMax=!_histMonthAllMode&&(_histMonthYear>curY||(_histMonthYear===curY&&_histMonthMonth>=curM));
  if(!dispRecs){const ym=`${_histMonthYear}-${String(_histMonthMonth).padStart(2,'0')}`;dispRecs=_histMonthAllMode?allRecs:allRecs.filter(r=>(r.dateStart||'').startsWith(ym)||(r.dateEnd||'').startsWith(ym));}
  const lbl=_histMonthAllMode?'전체 기록':`${_histMonthYear}년 ${_histMonthMonth}월`;
  const nav=`<div class="hmn-header"><button class="hmn-arr" onclick="_histMonthPrev()"${_histMonthAllMode?' disabled':''}>‹</button><span class="hmn-label">${lbl}</span><button class="hmn-arr" onclick="_histMonthNext()"${(_histMonthAllMode||atMax)?' disabled':''}>›</button><button class="hmn-all${_histMonthAllMode?' on':''}" onclick="_histMonthToggleAll()">전체</button></div>`;
  let statHtml;
  if(_historySearch.trim()&&dispRecs.length){
    const q=_historySearch.trim().toLowerCase();
    const total=dispRecs.reduce((s,r)=>s+(+r.total||0),0);
    const payerAmt=dispRecs.reduce((s,r)=>s+(r.items||[]).reduce((ss,it)=>ss+((it.payer||'').toLowerCase().includes(q)?(+it.amount||0):0),0),0);
    const txnOut=dispRecs.reduce((s,r)=>s+(r.txns||[]).reduce((ss,t)=>(t.from||'').toLowerCase().includes(q)?ss+(+t.amt||0):ss,0),0);
    const txnIn=dispRecs.reduce((s,r)=>s+(r.txns||[]).reduce((ss,t)=>(t.to||'').toLowerCase().includes(q)?ss+(+t.amt||0):ss,0),0);
    const burdenAmt=payerAmt+txnOut-txnIn;
    const payerLbl=e(_historySearch.length>5?_historySearch.slice(0,5)+'…':_historySearch);
    let settleHtml='';
    if(_histSettleMode){
      let totalDelta=0,hasD=false;
      dispRecs.forEach(r=>{const d=_personSettleDelta(r,_historySearch.trim());if(d!==null){totalDelta+=d;hasD=true;}});
      if(hasD){if(totalDelta>0)settleHtml=`<span class="hmn-stat-settle pos">+${fmt(totalDelta)}원 초과</span>`;else if(totalDelta<0)settleHtml=`<span class="hmn-stat-settle neg">${fmt(-totalDelta)}원 부족</span>`;else settleHtml=`<span class="hmn-stat-settle zero">완납</span>`;}
    }
    statHtml=`<div class="hmn-stat-3"><div class="hmn-stat-col"><span class="hmn-stat-col-lbl">모임</span><div class="hmn-stat-col-right"><span class="hmn-stat-col-val">${dispRecs.length}회</span></div></div><div class="hmn-stat-col"><span class="hmn-stat-col-lbl">${payerLbl} 지출</span><div class="hmn-stat-col-right">${settleHtml}<span class="hmn-stat-col-val">${fmt(burdenAmt)}원</span></div></div><div class="hmn-stat-col"><span class="hmn-stat-col-lbl">총 지출</span><div class="hmn-stat-col-right"><span class="hmn-stat-col-val">${fmt(total)}원</span></div></div></div>`;
  }else{
    const total=dispRecs.reduce((s,r)=>s+(+r.total||0),0);
    const statStr=dispRecs.length?`${dispRecs.length}회 모임 · ${fmt(total)}원`:(_histMonthAllMode?'기록이 없어요':'이 달에 기록이 없어요');
    statHtml=`<div class="hmn-stat">${statStr}</div>`;
  }
  return`<div class="hist-month-nav">${nav}${statHtml}</div>`;
}

  const{paid,owes}=computeShares();const txns=calcTxns(paid,owes);
  const total=items.reduce((s,it)=>s+(+it.amount||0),0);
  return{items:JSON.parse(JSON.stringify(items)),txns,payments:JSON.parse(JSON.stringify(payments)),people:[...people],total,dateStart:settleDateStart,dateEnd:settleDateEnd};
}
async function _checkAllPaidAutoSave(){
  if(!hDbxGetToken())return;
  const rec=_currentSettleRec();
  const _ownerTxns=_myName?rec.txns.filter(t=>t.to===_myName):rec.txns;
  if(!_ownerTxns.length)return;
  if(!_ownerTxns.every(t=>rec.payments[`${t.from}|${t.to}`]?.done))return;
  const fp=_settleAutoSaveFp();if(_dbxAutoSavedFp===fp)return;
  try{
    const canvas=await generateHistoryCanvas(rec);
    const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));if(!blob)return;
    const ok=await _dbxUpload(hDbxGetToken(),`${dbxDir()}/${_buildSettleFilename(rec.dateStart,rec.total,rec.people)}.png`,blob);
    if(ok){_dbxAutoSavedFp=fp;toast('모든 입금 완료 🎉 Dropbox에 정산 이미지가 저장됐어요',{type:'success'});}
  }catch(e){}
}

async function _dbxRenameExistingFiles(){
  const token=hDbxGetToken();
  if(!token){toast('Dropbox가 연결되지 않았어요',{type:'error'});return;}
  toast('Dropbox 파일 목록 확인 중...');
  try{
    // 폴더 내 파일 목록 수집 (페이지네이션 포함)
    let entries=[];
    let res=await fetch('https://api.dropboxapi.com/2/files/list_folder',{method:'POST',headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({path:dbxDir(),recursive:false,include_non_downloadable_files:false})});
    if(res.status===401){const t=await _dbxRefreshToken();if(t)return _dbxRenameExistingFiles();}
    if(!res.ok){toast('폴더 목록을 가져오지 못했어요',{type:'error'});return;}
    let data=await res.json();
    entries.push(...(data.entries||[]));
    while(data.has_more){
      res=await fetch('https://api.dropboxapi.com/2/files/list_folder/continue',{method:'POST',headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({cursor:data.cursor})});
      if(!res.ok)break;
      data=await res.json();
      entries.push(...(data.entries||[]));
    }
    // 이름 변경 대상 추출
    const toRename=[];
    for(const entry of entries){
      if(entry['.tag']!=='file')continue;
      const name=entry.name;
      const newName=name.replace(/더치페이|dutch\s*pay/gi,'정산내역');
      if(newName!==name)toRename.push({fromPath:entry.path_lower,toPath:`${dbxDir()}/${newName}`});
    }
    if(!toRename.length){toast('변경할 파일이 없어요 (이미 최신 이름)',{type:'success'});return;}
    const preview=toRename[0].toPath.split('/').pop();
    if(!confirm(`${toRename.length}개 파일의 이름을 변경할까요?\n예시: ${preview}`))return;
    // 파일 이동 (이름 변경)
    let done=0,fail=0;
    for(const{fromPath,toPath} of toRename){
      const tk=hDbxGetToken();
      const r=await fetch('https://api.dropboxapi.com/2/files/move_v2',{method:'POST',headers:{'Authorization':`Bearer ${tk}`,'Content-Type':'application/json'},body:JSON.stringify({from_path:fromPath,to_path:toPath,autorename:false})});
      if(r.ok)done++;else fail++;
    }
    if(fail===0)toast(`${done}개 파일 이름 변경 완료 ✓`,{type:'success'});
    else toast(`${done}개 변경됨 · ${fail}개 실패`,{type:'error'});
  }catch(e){toast('파일 이름 변경 중 오류가 발생했어요',{type:'error'});}
}

function pmToggleDone(key){
  const pm=_getPayment(key);pm.done=!pm.done;payments[key]=pm;saveState();
  const item=document.querySelector(`.txn-item[data-pm-key="${CSS.escape(key)}"]`);
  if(!item)return;
  const track=item.querySelector('.pay-toggle-track');const lbl=item.querySelector('.pay-toggle-lbl');
  if(track)track.classList.toggle('on',pm.done);
  if(lbl){lbl.classList.toggle('on',pm.done);lbl.textContent=pm.done?'입금완료':'미입금';}
  _patchPmRow(key);_patchSummary();
  if(pm.done)_checkAllPaidAutoSave();
}

function pmUpdateAmt(key,el){
  const pm=_getPayment(key);
  const posFromEnd=el.value.length-el.selectionEnd;
  const raw=el.value.replace(/[^0-9]/g,'');
  if(raw===''){pm.amount=null;el.value='';}
  else{const n=parseInt(raw,10);pm.amount=n;el.value=n.toLocaleString('ko-KR');const newPos=Math.max(0,el.value.length-posFromEnd);el.setSelectionRange(newPos,newPos);}
  payments[key]=pm;saveState();
  const item=document.querySelector(`.txn-item[data-pm-key="${CSS.escape(key)}"]`);
  if(!item)return;
  const panel=item.querySelector('.pay-panel');if(!panel)return;
  const diffVal=(pm.amount!==null&&pm.amount!=='')?(+pm.amount-(window._txnAmtMap[key]||0)):null;
  let badge=panel.querySelector('.pay-diff-badge');
  if(diffVal!==null){
    const cls=diffVal>0?'pos':diffVal<0?'neg':'zero';
    const txt=(diffVal>0?'+':'')+fmt(diffVal)+'원';
    if(!badge){badge=document.createElement('span');badge.className='pay-diff-badge '+cls;const row=panel.querySelectorAll('.pay-panel-row')[1];if(row)row.appendChild(badge);}
    badge.className='pay-diff-badge '+cls;badge.textContent=txt;
  }else if(badge)badge.remove();
  _patchPmRow(key);_patchSummary();
}

function pmUpdate(key,field,val){
  const pm=_getPayment(key);pm[field]=val;payments[key]=pm;saveState();
  if(field!=='memo')_patchPmRow(key);
  _patchSummary();
}

function pmSetNow(key){
  const now=new Date();
  const local=new Date(now-now.getTimezoneOffset()*60000).toISOString().slice(0,16);
  const item=document.querySelector(`.txn-item[data-pm-key="${CSS.escape(key)}"]`);
  if(item){const inp=item.querySelector('input[type="datetime-local"]');if(inp){inp.value=local;_dtpSync(inp);}}
  pmUpdate(key,'timestamp',local);
}

function _patchPmRow(key){
  const pm=_getPayment(key);
  const item=document.querySelector(`.txn-item[data-pm-key="${CSS.escape(key)}"]`);if(!item)return;
  const row=item.querySelector('.txn-row');if(!row)return;
  const hasAmt=pm.amount!==null&&pm.amount!==''&&!isNaN(+pm.amount);
  const diff=hasAmt?(+pm.amount-(window._txnAmtMap[key]||0)):null;
  const isGreen=pm.done&&(diff===null||diff>=0);
  const isRed=diff!==null&&diff<0;
  row.classList.toggle('pm-done',isGreen);row.classList.toggle('pm-diff',isRed);
  const ic=row.querySelector('.txn-status-ic');
  if(ic){ic.className='txn-status-ic'+(isGreen?' done':isRed?' diff':'');ic.innerHTML=pm.done?svgPayCheck:'';}
  const right=row.querySelector('.txn-right');
  if(right){
    const amtEl=right.querySelector('.txn-amt');
    const metaEl=right.querySelector('.txn-pmeta');
    const sdiffEl=right.querySelector('.txn-sdiff');
    if(amtEl)amtEl.className='txn-amt'+(isGreen?' done-clr':isRed?' neg-clr':'');
    if(metaEl){const parts=[];if(pm.done)parts.push('입금완료');if(pm.account)parts.push(pm.account);if(pm.timestamp)parts.push(_dtpFmt(pm.timestamp));metaEl.textContent=parts.join(' · ');}
    if(sdiffEl){if(diff!==null){sdiffEl.className='txn-sdiff'+(diff>0?' pos':' neg');sdiffEl.textContent=(diff>0?'+':'')+fmt(diff)+'원';}else{sdiffEl.textContent='';}}
  }
}

function _patchSummary(){
  document.querySelectorAll('.pay-summary-body').forEach(el=>{
    try{const txns=JSON.parse(el.dataset.txns||'[]');el.innerHTML=_paySummaryBodyHtml(txns);}catch(e){}
  });
}

function _txnRowsHtml(txns){
  if(!txns.length)return'';
  const seen=[],gmap={};
  txns.forEach(t=>{if(!gmap[t.to]){gmap[t.to]=[];seen.push(t.to);}gmap[t.to].push(t);});
  if(seen.length<=1)return txns.map(t=>`<div class="txn-row"><div class="txn-people"><span class="txn-from">${e(t.from)}</span><span class="txn-arr">${svgArrow}</span><span class="txn-to">${e(t.to)}</span></div><span class="txn-amt">${fmt(t.amt)}원</span></div>`).join('');
  return seen.map(to=>{
    const cls=(_myName&&to===_myName)?'txn-div-owner':'txn-div-other';
    const rows=gmap[to].map(t=>`<div class="txn-row"><div class="txn-people"><span class="txn-from">${e(t.from)}</span><span class="txn-arr">${svgArrow}</span><span class="txn-to">${e(t.to)}</span></div><span class="txn-amt">${fmt(t.amt)}원</span></div>`).join('');
    return`<div class="txn-group-div ${cls}"></div>${rows}`;
  }).join('');
}

function _txnRowsOwnerHtml(txns){
  return txns.map(t=>{
    const key=_txnKey(t.from,t.to);
    window._txnAmtMap[key]=t.amt;
    const pm=_getPayment(key);
    const hasAmt=pm.amount!==null&&pm.amount!==''&&!isNaN(+pm.amount);
    const diff=hasAmt?(+pm.amount-t.amt):null;
    const isGreen=pm.done&&(diff===null||diff>=0);
    const isRed=diff!==null&&diff<0;
    const rowCls='txn-row expandable'+(isGreen?' pm-done':isRed?' pm-diff':'');
    const icCls='txn-status-ic'+(isGreen?' done':isRed?' diff':'');
    const amtCls='txn-amt'+(isGreen?' done-clr':isRed?' neg-clr':'');
    const metaParts=[];if(pm.done)metaParts.push('입금완료');if(pm.account)metaParts.push(pm.account);
    const sdiffHtml=diff!==null&&diff!==0?`<div class="txn-sdiff ${diff>0?'pos':'neg'}">${diff>0?'+':''}${fmt(diff)}원</div>`:'<div class="txn-sdiff"></div>';
    return `<div class="txn-item" data-pm-key="${ea(key)}"><div class="${rowCls}" onclick="togglePaymentPanel('${ea(key)}')"><div class="${icCls}">${pm.done?svgPayCheck:''}</div><div class="txn-people"><span class="txn-from">${e(t.from)}</span><span class="txn-arr">${svgArrow}</span><span class="txn-to">${e(t.to)}</span></div><div class="txn-right"><div class="${amtCls}">${fmt(t.amt)}원</div><div class="txn-pmeta">${e(metaParts.join(' · '))}</div>${sdiffHtml}</div><span class="txn-chev">▾</span></div></div>`;
  }).join('');
}

function _paySummaryHtml(txns){
  if(!txns.length)return '';
  return `<div class="pay-summary"><div class="pay-summary-title">입금 현황</div><div class="pay-summary-body" data-txns="${ea(JSON.stringify(txns))}">${_paySummaryBodyHtml(txns)}</div></div>`;
}

function _paySummaryBodyHtml(txns){
  const totalBilled=txns.reduce((s,t)=>s+t.amt,0);
  const totalReceived=txns.reduce((s,t)=>{const pm=_getPayment(_txnKey(t.from,t.to));const validAmt=pm.amount!==null&&pm.amount!==''&&!isNaN(+pm.amount);return s+(pm.done?(validAmt?+pm.amount:t.amt):0);},0);
  const net=totalReceived-totalBilled;
  const unpaid=txns.filter(t=>!_getPayment(_txnKey(t.from,t.to)).done).map(t=>t.from);
  const unpaidHtml=unpaid.length?unpaid.map(p=>`<span class="pay-unpaid-chip">${e(p)}</span>`).join(''):'<span style="font-size:12px;color:var(--green)">모두 입금완료 ✓</span>';
  return `<div class="pay-summary-row"><span class="pay-summary-lbl">총 청구액</span><span class="pay-summary-val">${fmt(totalBilled)}원</span></div><div class="pay-summary-row"><span class="pay-summary-lbl">총 실수령액</span><span class="pay-summary-val${totalReceived>0?' pos':''}">${fmt(totalReceived)}원</span></div><div class="pay-summary-row"><span class="pay-summary-lbl">순 차액</span><span class="pay-summary-val ${net>0?'pos':net<0?'neg':''}">${net>0?'+':''}${fmt(net)}원</span></div><div class="pay-summary-row pay-unpaid-row"><span class="pay-summary-lbl">미입금자</span><div class="pay-unpaid-chips">${unpaidHtml}</div></div>`;
}

function _patchHistResults(){const el=document.querySelector('.pm-hist-results');if(!el)return;const openAllRec=el.querySelector('.pm-allrec-card.open');const openAllRecId=openAllRec?openAllRec.dataset.recId:null;const openRec=el.querySelector('.pm-record-card.open');const openRecId=openRec?openRec.dataset.recId:null;const openRecTxn=openRec?openRec.dataset.txnKey:null;el.innerHTML=_pmHistResultsHtml();if(openAllRecId)toggleAllRecCard(openAllRecId);if(openRecId&&openRecTxn)togglePmRecCard(openRecId,openRecTxn);}
function togglePmRecCard(rid,rkey){const card=document.querySelector(`.pm-record-card[data-rec-id="${CSS.escape(rid)}"]`);if(!card)return;const detail=card.querySelector('.pm-rec-detail');if(!detail)return;const chev=card.querySelector('.pm-record-chev');const isOpen=detail.style.display!=='none';if(isOpen){detail.style.display='none';card.classList.remove('open');if(chev)chev.classList.remove('open');card.querySelector('.pm-hist-edit-panel')?.remove();}else{detail.style.display='block';card.classList.add('open');if(chev)chev.classList.add('open');}}
function toggleAllRecCard(recId){
  const card=document.querySelector(`.pm-allrec-card[data-rec-id="${CSS.escape(recId)}"]`);if(!card)return;
  const next=card.nextElementSibling;
  if(next&&next.classList.contains('pm-allrec-detail')){next.remove();card.classList.remove('open');const ch=card.querySelector('.pm-allrec-chev');if(ch)ch.textContent='▼';return;}
  document.querySelectorAll('.pm-allrec-detail').forEach(d=>d.remove());
  document.querySelectorAll('.pm-allrec-card.open').forEach(c=>{c.classList.remove('open');const ch=c.querySelector('.pm-allrec-chev');if(ch)ch.textContent='▼';});
  card.classList.add('open');const chev=card.querySelector('.pm-allrec-chev');if(chev)chev.textContent='▲';
  const rec=loadHistory().find(r=>r.id===recId);if(!rec)return;
  const txns=_myName?(rec.txns||[]).filter(t=>t.to===_myName):(rec.txns||[]);const pmObj=rec.payments||{};
  const detail=document.createElement('div');detail.className='pm-allrec-detail';
  const dbxBtn=hDbxGetToken()?`<div style="padding:10px 14px 4px"><button class="pm-dbx-btn" style="margin-top:0" onclick="saveHistRecToDropbox('${ea(recId)}')">☁️ Dropbox에 이미지 저장</button></div>`:'';
  const ownerBtns=_ownerUnlocked?`<div class="rc-owner-actions"><button class="rc-owner-btn edit" onclick="loadHistoryForEdit('${ea(recId)}')">✏️ 불러오기</button><button class="rc-owner-btn del" onclick="_pmDelRec('${ea(recId)}',event)">🗑 삭제</button></div>`:'';
  if(!txns.length){detail.innerHTML='<div class="rc-no-txn">모두 정산 완료 ✓</div>'+dbxBtn+ownerBtns;}
  else{detail.innerHTML=txns.map(t=>{const tkey=`${t.from}|${t.to}`;const pm=(pmObj[tkey]||{});const billing=t.amt;const _va2=pm.amount!=null&&pm.amount!==''&&!isNaN(+pm.amount);const received=pm.done?(_va2?+pm.amount:billing):0;const diff=pm.done?received-billing:null;const badge=pm.done?(diff>0?`<span class="pm-badge pos">+${fmt(diff)}원 초과</span>`:diff<0?`<span class="pm-badge neg">-${fmt(-diff)}원 부족</span>`:`<span class="pm-badge done">${t.to===_myName?'✓ 입금완료':'✓ 송금완료'}</span>`):`<span class="pm-badge pending">${t.to===_myName?'미입금':'미확인'}</span>`;const rid=ea(recId);const rkey=ea(tkey);return `<div class="rc-txn-row clickable" data-rec-id="${rid}" data-txn-key="${rkey}" onclick="toggleRcTxnPanel('${rid}','${rkey}')"><div class="rc-txn-left"><div class="rc-txn-people"><span>${e(t.from)}</span>${svgArrowH}<span>${e(t.to)}</span></div>${badge}</div><span class="rc-txn-amt">${fmt(t.amt)}원</span></div>`;}).join('')+dbxBtn+ownerBtns;}
  card.insertAdjacentElement('afterend',detail);
}

function _pmSegHtml(){
